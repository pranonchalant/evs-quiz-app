ibed safety procedures.", "category": "Indian Environmental Laws", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 394, "question": "Section 19 of the Air Act concerns:", "options": ["Air pollution control areas", "Wildlife protection", "Water consent", "Hazardous waste disposal"], "correctAnswer": "Air pollution control areas", "explanation": "Section 19 of the Air Act empowers state governments, in consultation with SPCBs, to declare designated air pollution control areas.", "category": "Indian Environmental Laws", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 395, "question": "Section 21 of the Air Act establishes:", "options": ["Consent mechanism", "Wildlife schedules", "Environmental laboratories", "National parks"], "correctAnswer": "Consent mechanism", "explanation": "Section 21 mandates that no person shall operate any industrial plant in an air pollution control area without previous consent of the State Board.", "category": "Indian Environmental Laws", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 396, "question": "Section 31A of the Air Act provides:", "options": ["Emergency powers including closure/suspension", "Wildlife trade licences", "Forest permits", "Water testing"], "correctAnswer": "Emergency powers including closure/suspension", "explanation": "Section 31A grants regulatory boards authority to issue directions including closure, prohibition, or regulation of industry, and stoppage of electricity/water.", "category": "Indian Environmental Laws", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 397, "question": "CPCB stands for:", "options": ["Central Climate Protection Board", "Central Pollution Control Board", "Central Public Conservation Board", "Central Planning Control Bureau"], "correctAnswer": "Central Pollution Control Board", "explanation": "The CPCB is India's statutory organization constituted under the Water (Prevention and Control of Pollution) Act, 1974.", "category": "Indian Environmental Laws", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": true, "isDatesTreatiesSdg": false}, {"id": 398, "question": "SPCB stands for:", "options": ["State Pollution Control Board", "State Public Conservation Bureau", "Sustainable Pollution Control Bureau", "State Planning and Climate Board"], "correctAnswer": "State Pollution Control Board", "explanation": "SPCB stands for State Pollution Control Board, enforcing environmental laws and discharge standards at state jurisdiction.", "category": "Indian Environmental Laws", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 399, "question": "NGT was established in:", "options": ["1986", "1992", "2002", "2010"], "correctAnswer": "2010", "explanation": "The National Green Tribunal (NGT) was established in 2010 under the NGT Act for expeditious disposal of civil environmental cases.", "category": "Indian Environmental Laws", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": true}, {"id": 400, "question": "The Kyoto Protocol entered into force on:", "options": ["December 11, 1997", "February 16, 2005", "November 4, 2016", "August 2002"], "correctAnswer": "February 16, 2005", "explanation": "Following Russia's decisive ratification meeting the 55% emissions threshold, Kyoto entered legally into force on 16 February 2005.", "category": "Kyoto, Paris & SDGs", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": true}, {"id": 401, "question": "India ratified Kyoto in:", "options": ["1997", "2000", "August 2002", "2015"], "correctAnswer": "August 2002", "explanation": "India formally deposited its instrument of accession/ratification to the Kyoto Protocol in August 2002 as a Non-Annex I party.", "category": "Kyoto, Paris & SDGs", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": true}, {"id": 402, "question": "Which of the following is a Kyoto greenhouse gas?", "options": ["CO2", "CH4", "SF6", "All of the above"], "correctAnswer": "All of the above", "explanation": "Annex A of the Kyoto Protocol explicitly covers 6 greenhouse gases: CO2, CH4, N2O, HFCs, PFCs, and SF6.", "category": "Kyoto, Paris & SDGs", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": true}, {"id": 403, "question": "Which is NOT one of Kyoto's six covered greenhouse gases?", "options": ["CO2", "CH4", "O2", "SF6"], "correctAnswer": "O2", "explanation": "Atmospheric oxygen (O2) is not a greenhouse gas and is not targeted by the Kyoto Protocol.", "category": "Kyoto, Paris & SDGs", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": true}, {"id": 404, "question": "Kyoto's Clean Development Mechanism is abbreviated:", "options": ["CBD", "CDM", "CDR", "CFC"], "correctAnswer": "CDM", "explanation": "CDM stands for Clean Development Mechanism, allowing emission-reduction projects in developing nations to earn certified emission reduction (CER) credits.", "category": "Kyoto, Paris & SDGs", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": true}, {"id": 405, "question": "The Paris Agreement was adopted at:", "options": ["COP3", "COP15", "COP21", "COP28"], "correctAnswer": "COP21", "explanation": "The landmark Paris Agreement was reached during COP21 of the UNFCCC in Paris, December 2015.", "category": "Kyoto, Paris & SDGs", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": true}, {"id": 406, "question": "The Paris Agreement entered into force on:", "options": ["November 4, 2016", "December 11, 1997", "February 16, 2005", "September 2015"], "correctAnswer": "November 4, 2016", "explanation": "The Paris Agreement crossed its 55-party and 55% emissions threshold rapidly, entering into force on November 4, 2016.", "category": "Kyoto, Paris & SDGs", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": true}, {"id": 407, "question": "Paris uses which approach to national climate targets?", "options": ["Completely assigned targets", "Bottom-up nationally determined targets", "No national targets", "Targets only for developed nations"], "correctAnswer": "Bottom-up nationally determined targets", "explanation": "Unlike Kyoto's top-down mandated quotas, Paris utilizes bottom-up pledges formulated domestically by each country (NDCs).", "category": "Kyoto, Paris & SDGs", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": true}, {"id": 408, "question": "NDCs are updated:", "options": ["Every year", "Every two years", "Every five years", "Every ten years"], "correctAnswer": "Every five years", "explanation": "Under the Paris ratchet mechanism, nations must submit updated, progressively more ambitious NDCs every five years.", "category": "Kyoto, Paris & SDGs", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": true}, {"id": 409, "question": "Article 2 of the Paris Agreement concerns:", "options": ["Climate finance", "Temperature goal", "Adaptation", "Trade"], "correctAnswer": "Temperature goal", "explanation": "Article 2 establishes the core temperature objective: holding warming well below 2°C and pursuing 1.5°C above pre-industrial levels.", "category": "Kyoto, Paris & SDGs", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": true}, {"id": 410, "question": "Article 4 concerns:", "options": ["Net-zero/long-term emission trajectory", "Wildlife", "Water pollution", "EIA"], "correctAnswer": "Net-zero/long-term emission trajectory", "explanation": "Article 4 outlines long-term global emissions mitigation aimed at achieving a balance between anthropogenic emissions and greenhouse gas removals (net zero).", "category": "Kyoto, Paris & SDGs", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": true}, {"id": 411, "question": "Article 7 concerns:", "options": ["Adaptation", "Finance", "Biodiversity", "Trade"], "correctAnswer": "Adaptation", "explanation": "Article 7 establishes the global goal on adaptation to enhance adaptive capacity, strengthen resilience, and reduce vulnerability.", "category": "Kyoto, Paris & SDGs", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": true}, {"id": 412, "question": "Article 9 concerns:", "options": ["Climate finance", "Ecosystem diversity", "Air pollution", "Waste management"], "correctAnswer": "Climate finance", "explanation": "Article 9 obligates developed country parties to provide financial resources to assist developing country parties with mitigation and adaptation.", "category": "Kyoto, Paris & SDGs", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": true}, {"id": 413, "question": "The annual climate finance figure in the notes is:", "options": ["USD 10 billion", "USD 50 billion", "USD 100 billion", "USD 1 trillion"], "correctAnswer": "USD 100 billion", "explanation": "Developed nations pledged to collectively mobilize USD 100 billion per year by 2020 to support developing nations.", "category": "Kyoto, Paris & SDGs", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": true}, {"id": 414, "question": "SDG 6 concerns:", "options": ["Quality education", "Clean water and sanitation", "Climate action", "Life below water"], "correctAnswer": "Clean water and sanitation", "explanation": "Sustainable Development Goal 6 aims to ensure availability and sustainable management of water and sanitation for all.", "category": "Sustainable Development Goals", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": true}, {"id": 415, "question": "SDG 7 concerns:", "options": ["Affordable and clean energy", "Gender equality", "Life on land", "Zero hunger"], "correctAnswer": "Affordable and clean energy", "explanation": "SDG 7 aims to ensure access to affordable, reliable, sustainable and modern energy for all.", "category": "Sustainable Development Goals", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": true}, {"id": 416, "question": "SDG 13 concerns:", "options": ["Climate action", "Peace and justice", "Education", "Industry"], "correctAnswer": "Climate action", "explanation": "SDG 13 urges urgent action to combat climate change and its impacts.", "category": "Sustainable Development Goals", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": true}, {"id": 417, "question": "SDG 14 concerns:", "options": ["Terrestrial ecosystems", "Oceans, seas and marine resources", "Sustainable cities", "Poverty"], "correctAnswer": "Oceans, seas and marine resources", "explanation": "SDG 14 commits to conserve and sustainably use the oceans, seas, and marine resources for sustainable development ('Life Below Water').", "category": "Sustainable Development Goals", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": true}, {"id": 418, "question": "SDG 15 concerns:", "options": ["Life on land/terrestrial ecosystems", "Clean energy", "Education", "Reduced inequality"], "correctAnswer": "Life on land/terrestrial ecosystems", "explanation": "SDG 15 focuses on protecting, restoring, and promoting sustainable use of terrestrial ecosystems, forests, and preventing biodiversity loss ('Life on Land').", "category": "Sustainable Development Goals", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": true}, {"id": 419, "question": "SDG 17 concerns:", "options": ["Climate action", "Global partnership for sustainable development", "Clean water", "Life below water"], "correctAnswer": "Global partnership for sustainable development", "explanation": "SDG 17 emphasizes strengthening the means of implementation and revitalizing the Global Partnership for Sustainable Development.", "category": "Sustainable Development Goals", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": true}, {"id": 420, "question": "The SDGs were agreed upon at the UN in:", "options": ["2000", "2010", "September 2015", "2020"], "correctAnswer": "September 2015", "explanation": "All 193 UN Member States adopted the 17 Sustainable Development Goals as part of the 2030 Agenda for Sustainable Development in September 2015.", "category": "Sustainable Development Goals", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": true}, {"id": 421, "question": "The Montreal Protocol, designed to phase out Ozone Depleting Substances (ODSs), was agreed in the year:", "options": ["1972", "1987", "1997", "2015"], "correctAnswer": "1987", "explanation": "The Montreal Protocol on Substances that Deplete the Ozone Layer was adopted on September 16, 1987 (commemorated annually as World Ozone Day).", "category": "Treaties: Montreal Protocol", "section": "International Environmental Treaties", "isFatExam": false, "isFatFocus": false, "isDatesTreatiesSdg": true}, {"id": 422, "question": "Which international treaty is considered the single most successful environmental agreement, successfully phasing out nearly 99% of controlled CFCs?", "options": ["Kyoto Protocol", "Montreal Protocol", "Basel Convention", "Copenhagen Accord"], "correctAnswer": "Montreal Protocol", "explanation": "The 1987 Montreal Protocol is universally ratified and has successfully phased out ~99% of ozone-depleting substances, putting the stratospheric ozone layer on track to recovery.", "category": "Treaties: Montreal Protocol", "section": "International Environmental Treaties", "isFatExam": false, "isFatFocus": false, "isDatesTreatiesSdg": true}, {"id": 423, "question": "The 2016 Kigali Amendment to the Montreal Protocol aims to phase down which group of potent greenhouse gases?", "options": ["Chlorofluorocarbons (CFCs)", "Hydrofluorocarbons (HFCs)", "Carbon dioxide", "Methane"], "correctAnswer": "Hydrofluorocarbons (HFCs)", "explanation": "The Kigali Amendment (2016) legally binds nations to phase down Hydrofluorocarbons (HFCs), which replaced CFCs in refrigeration but are thousands of times more potent than CO2.", "category": "Treaties: Montreal Protocol", "section": "International Environmental Treaties", "isFatExam": false, "isFatFocus": false, "isDatesTreatiesSdg": true}, {"id": 424, "question": "The Basel Convention (adopted in 1989) regulates the international control of:", "options": ["Trade in endangered wildlife", "Transboundary movements of hazardous wastes and their disposal", "Greenhouse gas emissions from aviation", "Ozone depleting chlorofluorocarbons"], "correctAnswer": "Transboundary movements of hazardous wastes and their disposal", "explanation": "The Basel Convention on the Control of Transboundary Movements of Hazardous Wastes and Their Disposal prevents the dumping of toxic waste from developed to developing nations.", "category": "Treaties: Basel Convention", "section": "International Environmental Treaties", "isFatExam": false, "isFatFocus": false, "isDatesTreatiesSdg": true}, {"id": 425, "question": "The Stockholm Convention (2001) aims to eliminate or restrict the production and use of:", "options": ["Persistent Organic Pollutants (POPs)", "Greenhouse gases", "Ozone depleting substances", "Nuclear waste"], "correctAnswer": "Persistent Organic Pollutants (POPs)", "explanation": "The Stockholm Convention on Persistent Organic Pollutants (POPs) targets toxic chemicals (like DDT, dioxins, PCBs) that resist environmental degradation and bioaccumulate.", "category": "Treaties: Stockholm Convention", "section": "International Environmental Treaties", "isFatExam": false, "isFatFocus": false, "isDatesTreatiesSdg": true}, {"id": 426, "question": "The Minamata Convention on Mercury was adopted in which year to protect human health and the environment from toxic mercury emissions?", "options": ["1974", "1992", "2013", "2021"], "correctAnswer": "2013", "explanation": "The Minamata Convention on Mercury was adopted in 2013 in Kumamoto, Japan, named after Minamata Bay to curb industrial mercury releases and products.", "category": "Treaties: Minamata Convention", "section": "International Environmental Treaties", "isFatExam": false, "isFatFocus": false, "isDatesTreatiesSdg": true}, {"id": 427, "question": "According to the World Health Organization (WHO) 2021 Global Air Quality Guidelines, the recommended annual mean limit for fine particulate matter (PM2.5) is:", "options": ["5 µg/m³", "25 µg/m³", "50 µg/m³", "100 µg/m³"], "correctAnswer": "5 µg/m³", "explanation": "In 2021, the WHO tightened its health-based annual guideline for PM2.5 from 10 µg/m³ down to 5 µg/m³ due to evidence of cardiovascular and respiratory damage.", "category": "WHO & Health Guidelines", "section": "WHO & Health Guidelines", "isFatExam": false, "isFatFocus": false, "isDatesTreatiesSdg": true}, {"id": 428, "question": "The WHO recommended permissible guideline limit for arsenic in drinking water is:", "options": ["0.01 mg/L (10 µg/L)", "0.5 mg/L", "1.5 mg/L", "5.0 mg/L"], "correctAnswer": "0.01 mg/L (10 µg/L)", "explanation": "The WHO provisional guideline value for arsenic in drinking water is 10 µg/L (0.01 mg/L) to prevent chronic arsenicosis, skin lesions, and cancers.", "category": "WHO & Health Guidelines", "section": "WHO & Health Guidelines", "isFatExam": false, "isFatFocus": false, "isDatesTreatiesSdg": true}, {"id": 429, "question": "In which year was the Air (Prevention and Control of Pollution) Act amended to explicitly include 'noise' under the statutory definition of air pollutants?", "options": ["1974", "1981", "1987", "2000"], "correctAnswer": "1987", "explanation": "The Air Act, 1981 was amended in 1987 to introduce noise pollution into Section 2(a) within the ambit of air pollutants.", "category": "Indian Environmental Laws", "section": "Indian Environmental Laws", "isFatExam": false, "isFatFocus": false, "isDatesTreatiesSdg": true}, {"id": 430, "question": "The historic UN Conference on Environment and Development (UNCED), also known as the Earth Summit, was held in 1992 in:", "options": ["Kyoto, Japan", "Rio de Janeiro, Brazil", "Stockholm, Sweden", "Paris, France"], "correctAnswer": "Rio de Janeiro, Brazil", "explanation": "The 1992 Rio Earth Summit produced Agenda 21, the Rio Declaration on Environment and Development, and opened the UNFCCC and CBD for signature.", "category": "International Treaties", "section": "International Environmental Treaties", "isFatExam": false, "isFatFocus": false, "isDatesTreatiesSdg": true}, {"id": 431, "question": "How many Sustainable Development Goals (SDGs) and corresponding targets were established by the United Nations for the 2030 Agenda?", "options": ["8 Goals and 21 Targets", "12 Goals and 100 Targets", "17 Goals and 169 Targets", "20 Goals and 200 Targets"], "correctAnswer": "17 Goals and 169 Targets", "explanation": "The 2030 Agenda for Sustainable Development, adopted by all 193 UN Member States in 2015, comprises 17 interconnected Goals and 169 specific Targets.", "category": "UN Sustainable Development Goals", "section": "UN Sustainable Development Goals", "isFatExam": false, "isFatFocus": false, "isDatesTreatiesSdg": true}, {"id": 432, "question": "Which UN Sustainable Development Goal is specifically dedicated to 'Good Health and Well-being'?", "options": ["SDG 1", "SDG 3", "SDG 6", "SDG 13"], "correctAnswer": "SDG 3", "explanation": "SDG 3 aims to ensure healthy lives and promote well-being for all at all ages, including reducing pollution-related deaths.", "category": "UN Sustainable Development Goals", "section": "UN Sustainable Development Goals", "isFatExam": false, "isFatFocus": false, "isDatesTreatiesSdg": true}, {"id": 433, "question": "Which UN Sustainable Development Goal focuses on making human settlements and cities inclusive, safe, resilient, and sustainable?", "options": ["SDG 2", "SDG 7", "SDG 11", "SDG 16"], "correctAnswer": "SDG 11", "explanation": "SDG 11 focuses on 'Sustainable Cities and Communities', targeting urban air quality, municipal waste management, and green public spaces.", "category": "UN Sustainable Development Goals", "section": "UN Sustainable Development Goals", "isFatExam": false, "isFatFocus": false, "isDatesTreatiesSdg": true}, {"id": 434, "question": "The Ramsar Convention on Wetlands of International Importance was signed in which year in Ramsar, Iran?", "options": ["1971", "1982", "1992", "2005"], "correctAnswer": "1971", "explanation": "The Ramsar Convention was signed on February 2, 1971 (celebrated as World Wetlands Day) to provide a framework for the conservation and wise use of wetlands.", "category": "Treaties: Ramsar Convention", "section": "International Environmental Treaties", "isFatExam": false, "isFatFocus": false, "isDatesTreatiesSdg": true}, {"id": 435, "question": "The Convention on International Trade in Endangered Species of Wild Fauna and Flora (CITES) was drafted in 1973 and entered into force in:", "options": ["1975", "1985", "1995", "2005"], "correctAnswer": "1975", "explanation": "CITES was agreed in Washington D.C. in 1973 and formally entered into force on July 1, 1975, protecting over 38,000 species across Appendices I, II, and III.", "category": "Treaties: CITES", "section": "International Environmental Treaties", "isFatExam": false, "isFatFocus": false, "isDatesTreatiesSdg": true}];

const fatNotesData = [{"id": "mod-1", "num": 1, "category": "Cheat Sheet & Numbers", "title": "Module 1: Numbers, Targets & Values to Memorise", "badge": "Cheat Sheet", "summary": "Essential numerical statistics, temperature limits, atmospheric concentrations, capacity factors, and Indian government targets frequently tested in FAT MCQs.", "type": "table", "tableHeaders": ["Exam Topic / Parameter", "Exact Value / Exam Fact"], "tableRows": [["Earth surface temp without greenhouse effect", "-18 °C (natural greenhouse keeps it at ~15 °C)"], ["Global mean warming to date", "~1.1 °C above pre-industrial baseline (before 1850)"], ["Atmospheric CO2 concentration", "280 ppm pre-industrial -> >420 ppm currently (highest in 800,000+ yrs)"], ["Methane (CH4) warming potency", "~80–84x CO2 over 20-year horizon; GWP100 = 28–34"], ["Nitrous oxide (N2O) potency", "~265x CO2 over 100-year horizon (GWP100 = 265–298)"], ["Sea level rise since 1900", "~20 cm rise; IPCC projects 0.3 to 1.0 m rise by 2100"], ["Arctic summer sea ice loss rate", "Declining ~13% per decade since satellite telemetry began in 1979"], ["Global ocean heat absorption", ">90% of excess heat trapped; ~25–30% of anthropogenic CO2"], ["Ocean pH drop & acidity surge", "Dropped ~0.1 units since industrialization = ~26% increase in acidity"], ["Tropical coral reef loss", "Support ~25% marine life; bleach at +1 °C; >99% severely degraded at +2 °C"], ["Atmospheric moisture per degree warming", "~7% more water vapor per 1 °C warming (Clausius-Clapeyron relation)"], ["Global anthropogenic emissions by source", "Fossil fuels ~75%; Deforestation 10–15%; Agriculture 10–12%; Cement ~8%"], ["Sectoral GHG shares", "Electricity & heat ~34%; Industry ~24%; Agri & land use ~22%; Transport ~16%; Buildings 17–19% (incl. Scope 2)"], ["Cement manufacturing footprint", "~0.8 t CO2 per tonne cement; ~50% from calcination of limestone (CaCO3 -> CaO + CO2)"], ["Per capita annual carbon footprints", "Global average ~4 t CO2e; USA 14–16 t; India ~2 t CO2e/year"], ["Peak clear-day solar irradiance", "~1000 W/m² at solar noon (Standard Test Conditions)"], ["Solar PV module efficiencies", "Monocrystalline: 20–22%; Polycrystalline: 15–17%; Thin-film: 10–13%; Perovskite tandem: >30%"], ["Solar degradation & tracking gains", "~0.5%/year degradation (80–85% after 25 yrs); tracking systems add 15–35% yield"], ["Betz limit for wind turbines", "59.3% (16/27) maximum theoretical aerodynamic kinetic energy extraction"], ["Wind capacity factors", "Onshore: 35–50%; Offshore: 50–60%; Solar: 20–25%; Geothermal: 80–95% (baseload)"], ["India renewable & climate targets", "500 GW non-fossil by 2030; 50% electric power from non-fossil by 2030; Net-Zero by 2070"], ["Hydropower global share & efficiency", "15–16% of global electricity; efficiency >90%; dam lifespan 50–100+ years"], ["Geothermal global benchmarks", "Kenya generates 47% electricity from geothermal; Iceland over 20% (nearly 100% building heat)"], ["Geothermal thermodynamic temps", "Flash steam plants: >180 °C; Binary cycle plants: 100–180 °C (uses isobutane/pentane)"], ["Prominent Indian hydro plants", "Tehri Dam (1000 MW, Uttarakhand - Storage); Srinagar (330 MW - Run-of-river); Kadamparai (400 MW, TN - Pumped storage)"], ["Recycled aluminium energy savings", "~95% less energy needed compared to primary smelting of bauxite ore"], ["Global food waste proportion", "~1/3 of all food produced globally for human consumption is lost or wasted"], ["Sound thresholds (Noise pollution)", "Whisper ~30 dB; Normal speech ~50–60 dB; Traffic ~85 dB (damage threshold); >120 dB (immediate pain/harm)"], ["Acid rain pH threshold", "Rainwater precipitation with pH < 5.6 (driven by SO2 and NOx converting to sulfuric and nitric acids)"]]}, {"id": "mod-2", "num": 2, "category": "Climate & Carbon", "title": "Module 2: Climate Change Science & Global Warming", "badge": "Core Theory", "summary": "Atmospheric radiation balance, greenhouse gas properties, empirical evidence pillars, anthropogenic causes, and climate policy.", "type": "sections", "sections": [{"heading": "1. Radiation Physics of the Greenhouse Effect", "content": "• Solar incoming radiation: Arrives primarily as short-wave radiation (visible light and UV). The atmosphere is largely transparent to this short-wave energy, which strikes and warms Earth's surface.<br>• Terrestrial re-emission: The warmed planetary surface re-radiates energy as long-wave thermal infrared.<br>• Radiative forcing: Greenhouse gases in the troposphere absorb this outgoing long-wave infrared and re-radiate it in all directions, creating a natural thermal blanket keeping Earth at ~15 °C rather than -18 °C.<br>• Enhanced greenhouse effect: Excess accumulation of anthropogenic greenhouse gases thickens this radiative blanket, trapping surplus thermal energy in the troposphere."}, {"heading": "2. Greenhouse Gases Comparison Table", "tableHeaders": ["Gas", "Anthropogenic Sources", "Atmospheric Lifespan & Relative Warming Power"], "tableRows": [["Carbon Dioxide (CO2)", "Fossil fuel combustion (coal, oil, gas), cement production, deforestation", "Centuries to millennia; baseline reference (GWP = 1); accounts for ~75% of warming"], ["Methane (CH4)", "Ruminant livestock (enteric fermentation), flooded rice paddies, anaerobic landfills, natural gas leakage", "Short-lived (~12 yrs) but 80–84x more potent than CO2 over 20 yrs (GWP100 = 28–34)"], ["Nitrous Oxide (N2O)", "Synthetic nitrogen fertilisers, livestock manure, chemical industry", "~114 years; ~265x more potent than CO2 over 100 yrs (GWP100 = 265–298)"], ["Water Vapour (H2O)", "Natural evaporation amplified by warming atmosphere", "Most abundant GHG by volume; acts as a powerful positive feedback amplifier (not direct driver)"], ["Fluorinated Gases (HFCs, PFCs, SF6)", "Refrigeration, air conditioning, electrical switchgear, semiconductor etching", "Thousands to tens of thousands of times more potent than CO2; survive centuries"]]}, {"heading": "3. Four Independent Pillars of Evidence", "content": "1. Rising Surface Temperatures: Global mean temperatures have risen ~1.1 °C above pre-industrial levels; 19 of the 20 warmest years have occurred since 2000.<br>2. Atmospheric CO2 Surge: Risen from 280 ppm pre-industrial to over 420 ppm today; validated by Antarctic ice cores spanning 800,000 years.<br>3. Melting Cryosphere & Sea Level Rise: Arctic summer sea ice shrinking ~13% per decade; global mean sea level has risen ~20 cm since 1900.<br>4. Ocean Heat & Acidification: Global oceans have absorbed >90% of excess heat and ~25–30% of anthropogenic CO2; dissolving CO2 forms carbonic acid (H2CO3), lowering ocean pH by 0.1 units (~26% acidity surge)."}, {"heading": "4. Mitigation vs Adaptation", "content": "• Mitigation (Treating the Root Cause): Human interventions to reduce or prevent GHG emissions and enhance carbon sinks (e.g., solar/wind buildout, energy efficiency, reforestation, CCS, electric mobility).<br>• Adaptation (Managing the Symptoms): Adjustments in ecological, social, or economic systems to minimize damage from unavoidable climate impacts (e.g., sea walls, flood defences, drought-resistant crops, early warning systems, rainwater harvesting)."}]}, {"id": "mod-3", "num": 3, "category": "Climate & Carbon", "title": "Module 3: Carbon Footprint & Mitigation Strategies", "badge": "Accounting & Standards", "summary": "Carbon accounting scopes (1, 2, 3), Life Cycle Assessment (LCA), corporate standards (GHG Protocol, ISO 14064, PAS 2050), and carbon capture technologies.", "type": "sections", "sections": [{"heading": "1. Greenhouse Gas Protocol Emission Scopes", "tableHeaders": ["Scope Classification", "Boundary & Definition", "Industrial Examples"], "tableRows": [["Scope 1: Direct Emissions", "Direct GHG emissions from sources owned or controlled by the reporting organization.", "Combustion in company-owned boilers, furnaces, manufacturing chemical processes, fleet delivery trucks."], ["Scope 2: Indirect Energy Emissions", "Emissions from the generation of purchased electricity, steam, heating, or cooling consumed on-site.", "Grid electricity consumed to power manufacturing machinery, office HVAC, data center servers."], ["Scope 3: Value Chain Emissions", "All other indirect upstream and downstream supply-chain emissions outside direct operational control.", "Raw materials extraction, supplier transport, business travel, customer product use, end-of-life disposal (>70% of footprint)."]]}, {"heading": "2. Life Cycle Assessment & Standards", "content": "• Life Cycle Assessment (LCA): Primary engineering methodology evaluating cumulative environmental burdens from raw material extraction ('cradle') through manufacture and use to final disposal ('grave').<br>• Cradle to Cradle: Closed-loop regenerative framework where post-consumer materials are recovered, repaired, remanufactured, or recycled back into production cycles.<br>• Standards to Memorise for FAT:<br>  - GHG Protocol: Global multi-stakeholder standard for corporate greenhouse accounting.<br>  - ISO 14064: International standard for organizational greenhouse gas inventories and verification.<br>  - PAS 2050: Standard specifically assessing the life-cycle carbon footprint of products and services."}, {"heading": "3. Carbon Capture, Utilisation & Storage (CCS / CCU / DAC)", "content": "• Carbon Capture and Storage (CCS): Capturing industrial flue gas CO2 at point source (power plants, cement kilns) and injecting it thousands of metres underground into deep saline aquifers or depleted oil fields.<br>• Carbon Capture and Utilisation (CCU): Transforming captured CO2 into commercial synthetic fuels, building aggregates, or carbonates.<br>• Direct Air Capture (DAC): Using specialized chemical contactors to scrub dilute carbon dioxide directly from the ambient free atmosphere.<br>• Carbon Offsetting Criteria: High-integrity carbon credits must satisfy 4 non-negotiable criteria: Additional (would not happen without finance), Measurable, Permanent (non-reversal), and Independently Verified."}]}, {"id": "mod-4", "num": 4, "category": "Renewable Energy", "title": "Module 4: Solar Energy & Photovoltaic Engineering", "badge": "Renewables", "summary": "Photovoltaic physics, semiconductor p-n junctions, module architectures, Concentrated Solar Power (CSP), and Indian solar deployment schemes.", "type": "sections", "sections": [{"heading": "1. Photovoltaic (PV) Working Principle", "content": "• Photovoltaic Effect: Incident sunlight photons collide with valence electrons in a semiconductor (crystalline silicon), promoting them to the conduction band. The built-in electrostatic field at the semiconductor p-n junction directs free electrons toward electrical contacts, generating direct current (DC).<br>• Core Balance of System (BOS) Components: PV module array, Inverter (converts DC into grid-frequency AC), Charge controller, Battery bank (optional for off-grid), Mounting structures and solar trackers.<br>• Power Output Formula: Power (W) = Solar Irradiance (W/m²) × Panel Area (m²) × Module Efficiency (η).<br>• Temperature Coefficient: Solar PV efficiency decreases as cell temperature rises (negative coefficient, typically -0.35% to -0.45% per °C rise above 25 °C STC)."}, {"heading": "2. Photovoltaic Cell Architectures", "tableHeaders": ["Cell Type", "Commercial Efficiency", "Manufacturing & Performance Characteristics"], "tableRows": [["Monocrystalline Silicon", "20–22%", "Sawn from single cylindrical silicon ingots (Czochralski process); highest commercial efficiency; uniform dark black appearance; higher cost."], ["Polycrystalline Silicon", "15–17%", "Multiple silicon crystal fragments melted together into square ingots; blue speckled pattern; lower cost; internal grain boundaries slightly reduce efficiency."], ["Thin-Film (CdTe, a-Si)", "10–13%", "Semiconductor materials vapor-deposited in microscopic layers on glass or metal substrates; flexible, lightweight; lower efficiency requires greater land area."], ["Perovskite Tandem (Emerging)", ">30% (lab)", "Tandem layers stacked on silicon tuning solar absorption bands; low production costs; current engineering hurdle is moisture/UV durability."]]}, {"heading": "3. Concentrated Solar Power (CSP) & Key Indian Schemes", "content": "• Concentrated Solar Power (CSP): Utilizes tracking heliostat mirror fields to concentrate solar radiation onto a central receiver tower, heating molten salt to >550 °C to power steam turbines with dispatchable thermal energy storage.<br>• Key Indian Solar Initiatives:<br>  - PM Surya Ghar: Muft Bijli Yojana: Rooftop solar for 1 crore households with subsidies up to ₹78,000.<br>  - PM-KUSUM: Solarization of agricultural pump sets with up to 60% subsidy to eliminate diesel irrigation pumps.<br>  - Bhadla Solar Park (Rajasthan): World's largest operational solar park with a capacity of ~2,245 MW.<br>  - International Solar Alliance (ISA): Headquartered in Gurugram, India; mobilising over $1 trillion in solar financing."}]}, {"id": "mod-5", "num": 5, "category": "Renewable Energy", "title": "Module 5: Wind Energy & Betz Limit", "badge": "Renewables", "summary": "Aerodynamic lift, cubic wind power physics, Betz ceiling, HAWT vs VAWT, capacity factors, and Indian coastal wind development.", "type": "sections", "sections": [{"heading": "1. Aerodynamics & Power Equation", "content": "• Wind Formation: Atmospheric pressure differences driven by uneven solar heating of Earth's surface.<br>• Cubic Power Relation: Wind power output is proportional to the cube of wind speed: Power = 0.5 × ρ × A × v³ (where ρ = air density ~1.225 kg/m³, A = rotor swept area = π·r², v = wind speed). Doubling wind speed increases power by 2³ = 8 times.<br>• Betz Limit: German physicist Albert Betz proved in 1919 that no wind turbine can convert more than 16/27 (59.3%) of kinetic energy from wind into mechanical work.<br>• Operational Wind Speeds: Cut-in speed (3–4 m/s, turbine begins turning); Rated speed (12–15 m/s, generator reaches full capacity); Cut-out speed (~25 m/s, blades feather and brakes apply to prevent catastrophic mechanical failure)."}, {"heading": "2. Turbine Architectures & Indian Wind Development", "content": "• Horizontal Axis Wind Turbines (HAWT): Dominant commercial design; blades rotate perpendicularly to wind direction; superior aerodynamic lift efficiency; requires yaw control to face wind.<br>• Vertical Axis Wind Turbines (VAWT): Accepts wind from any omni-directional angle without yaw adjustment; lower installation height; ideal for turbulent urban building rooftops.<br>• Onshore vs Offshore: Onshore wind has capacity factor of 35–50%; Offshore wind reaches 50–60% due to steady, stronger ocean winds without topographic roughness.<br>• Indian Geography: India's coastline is ~7,516.6 km. Western coast (Gujarat, Maharashtra, Tamil Nadu) is preferred for wind development because the eastern coast is cyclone-prone. The National Institute of Wind Energy (NIWE) is based in Chennai. Muppandal Wind Farm (Tamil Nadu) is one of the world's largest operational wind farms."}]}, {"id": "mod-6", "num": 6, "category": "Renewable Energy", "title": "Module 6: Hydroelectric Power Engineering", "badge": "Renewables", "summary": "Hydraulic head, potential-to-kinetic-to-electrical energy chain, impoundment vs run-of-river vs pumped storage, and environmental impacts.", "type": "sections", "sections": [{"heading": "1. Working Principle & Power Formula", "content": "• Energy Conversion Chain: Potential Energy (water stored in reservoir at hydraulic head H) -> Kinetic Energy (rushing through pressurized penstocks) -> Mechanical Energy (rotating turbine runner) -> Electrical Energy (generator spinning in magnetic field).<br>• Power Equation: P = ρ × g × Q × H × η (where ρ = water density ~1000 kg/m³, g = 9.81 m/s², Q = volumetric discharge in m³/s, H = effective hydraulic head in metres, η = turbine-generator efficiency >90%).<br>• Core Components: Reservoir (storage), Dam structure, Penstock (high-pressure conduit pipe carrying water to turbine), Hydraulic turbine (Francis, Kaplan, Pelton), Generator, Tailrace (discharge channel)."}, {"heading": "2. Hydropower Plant Classifications", "tableHeaders": ["Type", "Operational Mechanism", "Indian Benchmark"], "tableRows": [["Storage / Impoundment", "Large dam creating artificial reservoir storing seasonal river runoff for dispatchable power on demand.", "Tehri Dam, Uttarakhand (1000 MW storage, highest dam in India)"], ["Run-of-the-River", "Diverts natural river discharge through tunnels with little or no reservoir flooding; output varies with river flow.", "Srinagar Hydroelectric Project, Alaknanda River (330 MW)"], ["Pumped Storage Hydro (PSH)", "Operates as a giant grid-scale rechargeable battery; pumps water uphill to upper reservoir using cheap off-peak power, releases downhill during peak demand.", "Kadamparai Pumped Storage Hydro, Tamil Nadu (400 MW)"]]}, {"heading": "3. Environmental Trade-Offs of Hydropower", "content": "• Benefits: Clean baseload power, dispatchable peak shaving, black-start grid capability, co-benefits of flood control and agricultural irrigation.<br>• Ecological Challenges: Large dams submerge fertile agricultural valleys and virgin forests; displace communities (Sardar Sarovar Dam displaced ~320,000 people); obstruct fish migration pathways; trap river silt; decaying submerged organic matter in tropical reservoirs generates biogenic methane (CH4)."}]}, {"id": "mod-7", "num": 7, "category": "Renewable Energy", "title": "Module 7: Geothermal Energy & Thermodynamic Cycles", "badge": "Renewables", "summary": "Geothermal gradients, dry steam, flash steam, and binary cycle thermodynamic plants, global baseload leaders, and Indian geothermal fields.", "type": "sections", "sections": [{"heading": "1. Geothermal Science & Gradient", "content": "• Origin: Thermal energy generated from the radioactive decay of deep isotopes (uranium, thorium, potassium) and primordial heat trapped during planetary accretion.<br>• Geothermal Gradient: Normal continental temperature increases by 25–30 °C per kilometre of depth into Earth's crust.<br>• Baseload Reliability: Weather-independent power available 24 hours a day, 365 days a year with an exceptionally high capacity factor of 80–95%."}, {"heading": "2. Geothermal Plant Architectures", "tableHeaders": ["Plant Cycle", "Resource Temperature", "Thermodynamic Mechanism"], "tableRows": [["Dry Steam Plants", ">200 °C (natural dry steam)", "Oldest and rarest design; natural underground steam is tapped directly from production wells to spin turbines (e.g., The Geysers, California)."], ["Flash Steam Plants", ">180 °C (high-pressure liquid)", "Most common worldwide; superheated high-pressure water is sprayed into low-pressure flash tanks, instantaneously boiling into steam. Remaining liquid is re-injected."], ["Binary Cycle Plants", "100–180 °C (moderate enthalpy)", "Hot geothermal fluid is pumped through a heat exchanger to boil a secondary organic working fluid with a lower boiling point (isobutane or pentane). Geothermal fluid never touches turbine."]]}, {"heading": "3. Global Benchmarks & Indian Geothermal Fields", "content": "• Global Leaders: Kenya generates ~47% of its national electricity from geothermal; Iceland generates >20% of its electricity and heats nearly 100% of buildings geothermally.<br>• Indian Geothermal Prospects:<br>  - Puga Valley (Ladakh): Highest enthalpy geothermal field in India; active exploratory drilling.<br>  - Tattapani (Chhattisgarh): Hot springs field in central India.<br>  - Manikaran (Himachal Pradesh): Geothermal field in the Parbati valley.<br>  - Cambay Basin (Gujarat): Deep sedimentary basin geothermal potential."}]}, {"id": "mod-8", "num": 8, "category": "AI & IoT", "title": "Module 8: AI & IoT in Environmental Monitoring", "badge": "Emerging Tech", "summary": "Environmental sensor matrices, real-time telemetry protocols, LSTM air quality forecasting, digital twins, and Indian case studies.", "type": "sections", "sections": [{"heading": "1. Environmental IoT Sensor Matrix", "tableHeaders": ["Domain", "Sensors & Detectors", "Monitored Parameters"], "tableRows": [["Air Quality Telemetry", "Optical dust scattering sensors, MQ-135 electrochemical arrays", "PM2.5, PM10, carbon monoxide (CO), sulfur dioxide (SO2), nitrogen oxides (NOx), ground-level ozone (O3)"], ["Water Quality Monitoring", "Ion-selective glass electrodes, optical dissolved oxygen probes", "pH, Dissolved Oxygen (DO), Electrical Conductivity (EC), Biochemical Oxygen Demand (BOD), turbidity"], ["Soil & Precision Farming", "Capacitive moisture sensors, optical NPK spectrophotometers", "Volumetric soil moisture percentage, soil temperature, Nitrogen (N), Phosphorus (P), Potassium (K)"], ["Wildlife & Forest Conservation", "Bioacoustic microphones, PIR passive infrared camera traps", "Ultrasonic bat frequencies, detection of illegal logging chainsaw sounds and poaching gunshots"], ["Municipal Smart Waste", "Ultrasonic level sensors mounted on dumpster lids", "Real-time trash bin fill levels; automated dynamic route optimization for municipal waste collection fleets"]]}, {"heading": "2. Artificial Intelligence in Environmental Engineering", "content": "• Long Short-Term Memory (LSTM) Networks: Recurrent deep learning models specifically designed to model non-linear temporal atmospheric time-series data to forecast air quality indices (AQI) 24–72 hours in advance.<br>• Digital Twins: Real-time physics-grounded 3D computational replicas of physical systems (e.g., wastewater treatment plants, municipal water grids) continuously updated by IoT sensor streams to simulate failure scenarios.<br>• Computer Vision & Remote Sensing: Convolutional Neural Networks (CNNs) analyzing multi-spectral drone and satellite imagery to calculate Normalized Difference Vegetation Index (NDVI) and detect illegal deforestation.<br>• Landmark Indian AI Case Study: Researchers from IIT Kharagpur developed an AI machine learning geospatial framework predicting groundwater arsenic contamination across the Ganga delta, identifying safe drinking water aquifers."}]}, {"id": "mod-9", "num": 9, "category": "Earth & Ecosystems", "title": "Module 9: Earth as a Life Support System & Atmospheric Spheres", "badge": "Foundations", "summary": "The four planetary spheres, vertical atmospheric stratification (Troposphere to Exosphere), and biogeochemical life support.", "type": "sections", "sections": [{"heading": "1. Earth's Four Interactive Spheres", "content": "• Lithosphere: The solid outer crust and upper mantle containing mineral nutrients and soil.<br>• Hydrosphere: All aqueous bodies (oceans, freshwater lakes, glaciers, groundwater, water vapour).<br>• Atmosphere: The protective gaseous envelope composed of 78% Nitrogen (N2), 21% Oxygen (O2), 0.93% Argon, and trace gases.<br>• Biosphere: The global ecological sum of all living organisms interacting with the physical spheres."}, {"heading": "2. Atmospheric Stratification from Surface Upward", "tableHeaders": ["Layer", "Altitude Range", "Key Characteristics & Phenomena"], "tableRows": [["Troposphere", "0 to 12 km", "Contains ~75–80% of atmospheric mass and virtually all weather; temperature decreases with altitude (-6.5 °C/km lapse rate)."], ["Stratosphere", "12 to 50 km", "Contains the protective Ozone Layer (O3); temperature rises with altitude due to UV absorption; calm flight corridor for jets."], ["Mesosphere", "50 to 85 km", "Coldest atmospheric layer (temperatures fall to -90 °C); meteors burn up upon atmospheric entry."], ["Thermosphere", "85 to 600 km", "Absorbs energetic solar X-rays and extreme UV; temperatures exceed 1,500 °C; site of auroras and the International Space Station."], ["Exosphere", ">600 km", "Outermost atmospheric boundary gradually thinning and transitioning into interplanetary vacuum; satellites orbit here."]]}]}, {"id": "mod-10", "num": 10, "category": "Earth & Ecosystems", "title": "Module 10: Ecosystem Structure, Energy Flow & Succession", "badge": "Foundations", "summary": "Biotic/abiotic components, food chains, ecological pyramids, Lindeman's 10% law, and primary vs secondary ecological succession.", "type": "sections", "sections": [{"heading": "1. Ecosystem Components & Energy Flow", "content": "• Biotic Components: Autotrophs (primary producers), Heterotrophs (herbivores, carnivores, omnivores), and Saprotrophs (decomposers: bacteria, fungi).<br>• Unidirectional Energy Flow: Solar radiant energy enters ecosystems through photosynthesis and flows unidirectionally through trophic levels. Energy is progressively lost as metabolic heat (Thermodynamics Law II).<br>• Lindeman's 10% Law: On average, only approximately 10% of energy transferred from one trophic level is incorporated into biomass at the subsequent trophic level (90% is lost to respiration, locomotion, and heat).<br>• Ecological Pyramids: Pyramids of energy are always upright; pyramids of numbers and biomass can be inverted (e.g., inverted biomass pyramid in marine ecosystems where phytoplankton turn over rapidly)."}, {"heading": "2. Ecological Succession", "content": "• Primary Succession: Occurs on barren substrates where no soil or organic matter previously existed (e.g., cooled volcanic lava flows, retreating glaciers). Pioneer species = lichens and mosses that weather rock into soil.<br>• Secondary Succession: Occurs in areas where an existing biological community was destroyed by disturbance but soil remains intact (e.g., abandoned farmland, post-wildfire forest). Pioneer species = fast-growing grasses and weeds.<br>• Climax Community: The stable, self-perpetuating terminal ecosystem reached at the end of ecological succession (e.g., mature temperate deciduous forest)."}]}, {"id": "mod-11", "num": 11, "category": "Biodiversity", "title": "Module 11: Biodiversity, Conservation Strategies & GM Crops", "badge": "Biodiversity", "summary": "Three levels of biodiversity, biodiversity hotspots, in-situ vs ex-situ conservation, Project Tiger, and Genetically Modified crops.", "type": "sections", "sections": [{"heading": "1. Three Levels of Biodiversity & Hotspots", "content": "• Genetic Diversity: Variation of genetic information within a single species (e.g., thousands of rice varieties).<br>• Species Diversity: Variety and abundance of different species within a specific region (Species Richness).<br>• Ecosystem Diversity: Diversity of habitats, biological communities, and ecological processes across biomes.<br>• Biodiversity Hotspots (Norman Myers Criteria): Must satisfy two strict criteria: (1) Contain at least 1,500 endemic vascular plant species (>0.5% of world total); (2) Have lost at least 70% of its primary native habitat.<br>• India's 4 Biodiversity Hotspots: Western Ghats, Eastern Himalayas, Indo-Burma, and Sundaland (Nicobar Islands)."}, {"heading": "2. In-Situ vs Ex-Situ Conservation", "tableHeaders": ["Strategy", "Definition", "Institutional Examples"], "tableRows": [["In-Situ Conservation", "Protecting endangered species within their natural native ecosystems and wild habitats.", "National Parks (Jim Corbett - 1st in India), Wildlife Sanctuaries, Biosphere Reserves, Sacred Groves, Project Tiger (launched 1973)."], ["Ex-Situ Conservation", "Protecting endangered flora/fauna outside their natural habitat in controlled artificial environments.", "Botanical Gardens, Zoological Parks, Seed Banks, Gene Banks, Cryopreservation of gametes/embryos in liquid nitrogen (-196 °C)."]]}, {"heading": "3. Genetically Modified (GM) Crops", "content": "• Bt Cotton: India's only commercially cultivated GM crop; genetically engineered with the Cry gene from soil bacterium Bacillus thuringiensis to produce endotoxins targeting bollworm pests.<br>• Advantages: Pest resistance, reduced chemical insecticide spraying, enhanced nutritional content (e.g., Golden Rice with beta-carotene).<br>• Ecological Concerns: Gene escape to wild weedy relatives (superweeds), potential allergenicity, evolution of pest resistance, corporate seed monopolies."}]}, {"id": "mod-12", "num": 12, "category": "Pollution & Waste", "title": "Module 12: Air, Water & Soil Pollution Dynamics", "badge": "Pollution", "summary": "Primary vs secondary air pollutants, photochemical smog, acid rain chemistry, aquatic dissolved oxygen, BOD/COD, and soil salinization.", "type": "sections", "sections": [{"heading": "1. Atmospheric Pollution Chemistry", "content": "• Primary Pollutants: Emitted directly from source into air (e.g., CO, SO2, NO, unburnt hydrocarbons, PM2.5, PM10).<br>• Secondary Pollutants: Formed in atmosphere via chemical reactions between primary pollutants and atmospheric reagents (e.g., Ground-level Ozone O3, Peroxyacetyl Nitrate PAN, Sulfuric Acid H2SO4).<br>• Photochemical Smog: Brown haze formed when NOx and volatile organic compounds (VOCs) react under solar UV radiation to generate ozone and PAN; requires sunlight and thermal inversion.<br>• Acid Precipitation: Rainwater with pH < 5.6 driven by sulfur dioxide (SO2) and nitrogen oxides (NOx) oxidized to sulfuric and nitric acids. Damages marble stone monuments ('Stone Cancer' on Taj Mahal), acidifies lakes, leaches toxic aluminium from soils."}, {"heading": "2. Water Quality Indicators (BOD, COD, DO)", "content": "• Dissolved Oxygen (DO): Amount of free, non-compound oxygen in water essential for aquatic life. Normal healthy clean water has DO > 8 mg/L; below 4 mg/L causes fish asphyxiation.<br>• Biochemical Oxygen Demand (BOD): Amount of dissolved oxygen required by aerobic microbes to biologically decompose organic matter in a water sample over 5 days at 20 °C (BOD5). Clean water BOD < 1–2 mg/L; raw domestic sewage BOD > 200–400 mg/L.<br>• Chemical Oxygen Demand (COD): Amount of oxygen required to chemically oxidize all organic compounds (both biodegradable and non-biodegradable) using a strong chemical oxidant (potassium dichromate). COD is always higher than BOD.<br>• Cultural Eutrophication: Excessive nutrient loading (nitrates and phosphates from fertilizer runoff and untreated sewage) stimulating explosive algae blooms that block sunlight; dying algae consume all DO upon decomposition, creating hypoxic 'dead zones'."}]}, {"id": "mod-13", "num": 13, "category": "Pollution & Waste", "title": "Module 13: Noise, Thermal Pollution & Water Conservation", "badge": "Pollution & Water", "summary": "Acoustic decibel scales, damage thresholds, thermal power plant cooling discharges, and rainwater harvesting techniques.", "type": "sections", "sections": [{"heading": "1. Noise Pollution Standards & Health Impacts", "content": "• Decibel Scale: Sound intensity is measured logarithmically in decibels (dB).<br>• Standards: Normal whispering ~30 dB; Conversational speech ~50–60 dB; Busy road traffic ~85 dB; Concerts and firecrackers >120 dB.<br>• Health Thresholds: Prolonged exposure to ambient noise above 85 dB induces permanent sensorineural hearing loss; noise exceeding 120 dB causes acute acoustic trauma.<br>• Regulatory Control: CPCB demarcates 4 ambient noise zones: Industrial (75/70 dB day/night), Commercial (65/55 dB), Residential (55/45 dB), and Silence Zones (within 100 m around hospitals, schools, courts: 50/40 dB)."}, {"heading": "2. Thermal Pollution & Water Conservation", "content": "• Thermal Pollution: Discharge of heated cooling water from thermal power plants, nuclear reactors, and refineries directly into natural rivers or lakes.<br>• Ecological Consequence: Thermal shock; higher water temperatures physically decrease the solubility of dissolved oxygen while accelerating aquatic organisms' metabolic rate, causing acute hypoxia.<br>• Water Conservation Techniques: Rainwater Harvesting (recharging groundwater aquifers via percolation pits and rooftop catchments), Watershed Management, and Drip Irrigation (delivers water directly to plant root zones with 90%+ efficiency vs flood irrigation)."}]}, {"id": "mod-14", "num": 14, "category": "Waste & C // ── Fisher-Yates Array Shuffle ─────────────────────────────────
function shuffleArray(origArray) {
  const arr = [...origArray];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Shuffles both question sequence and each question's 4 options
function prepareQuizQuestions(rawQuestionList) {
  const shuffledList = shuffleArray(rawQuestionList);
  return shuffledList.map(q => ({
    ...q,
    options: shuffleArray(q.options)
  }));
}

// Samples random count and shuffles options
function getRandomSample(array, count) {
  const sampled = shuffleArray(array).slice(0, Math.min(count, array.length));
  return sampled.map(q => ({
    ...q,
    options: shuffleArray(q.options)
  }));
}

// ── Stopwatch Helper Functions ─────────────────────────────────
function startStopwatch() {
  stopStopwatch();
  elapsedSeconds = 0;
  timerStartTime = Date.now();
  timerInterval = setInterval(() => {
    elapsedSeconds = Math.floor((Date.now() - timerStartTime) / 1000);
    updateStopwatchUI();
  }, 1000);
}

function stopStopwatch() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
}

function formatStopwatch(sec) {
  const m = Math.floor(sec / 60).toString().padStart(2, "0");
  const s = (sec % 60).toString().padStart(2, "0");
  return `${m}:${s}`;
}

function updateStopwatchUI() {
  const el = document.getElementById("stopwatchDisplay");
  if (el) {
    el.textContent = formatStopwatch(elapsedSeconds);
  }
}

function startTopicQuiz() {
  const select = document.getElementById("topicSelect");
  const topic = select.value;
  currentMode = "topic";
  currentTopic = topic;
  const filtered = masterQuestions.filter(q => q.category === topic);
  activeQuestions = prepareQuizQuestions(filtered);
  initQuizState();
}

function startQuiz(mode) {
  currentMode = mode;
  if (mode === "mock") {
    // Exactly 40 random questions sampled across entire bank
    activeQuestions = getRandomSample(masterQuestions, 40);
  } else if (mode === "fat_focus") {
    // Only the curated 65 important questions
    const pool = masterQuestions.filter(q => q.isFatFocus);
    activeQuestions = prepareQuizQuestions(pool);
  } else if (mode === "dates_treaties_sdg") {
    // Dedicated quiz for Dates, Treaties, WHO, and SDGs (91 questions)
    const pool = masterQuestions.filter(q => q.isDatesTreatiesSdg);
    activeQuestions = prepareQuizQuestions(pool);
  } else {
    // All old + new questions combined together (435 questions)
    activeQuestions = prepareQuizQuestions(masterQuestions);
  }
  initQuizState();
}

function handleSelectOption(selectedBtn, q) {
  if (answered) return;
  answered = true;

  const selectedValue = selectedBtn.getAttribute("data-value");
  const isCorrect = (selectedValue === q.correctAnswer);

  if (isCorrect) score++;

  userAnswers.push({
    question: q.question,
    selected: selectedValue,
    correct: q.correctAnswer,
    isCorrect: isCorrect,
    explanation: q.explanation
  });

  const buttons = document.querySelectorAll(".option-btn");
  buttons.forEach(btn => {
    btn.disabled = true;
    const val = btn.getAttribute("data-value");

    if (val === q.correctAnswer) {
      if (isCorrect) {
        btn.classList.add("selected-correct");
      } else {
        btn.classList.add("highlight-correct");
      }
    } else if (val === selectedValue && !isCorrect) {
      btn.classList.add("selected-wrong");
    } else {
      btn.classList.add("faded");
    }
  });

  // Render Instant Feedback Box
  const feedbackBox = document.getElementById("feedbackContainer");
  feedbackBox.innerHTML = `
    <div class="feedback-box ${isCorrect ? 'is-correct' : 'is-wrong'}">
      <div class="feedback-status">
        ${isCorrect ? "✔ Correct!" : "✘ Incorrect"}
      </div>
      <div class="feedback-explanation">
        ${escapeHtml(q.explanation)}
      </div>
    </div>
  `;

  // Show Next button
  const actionRow = document.getElementById("actionRow");
  actionRow.style.display = "flex";

  document.getElementById("nextBtn").addEventListener("click", () => {
    currentIndex++;
    if (currentIndex < activeQuestions.length) {
      renderQuestion();
    } else {
      renderResults();
    }
  });
}

    emoji = "🎯";
    verdict = "Great Performance! Strong grasp of concepts.";
  } else if (pct >= 50) {
    emoji = "📖";
    verdict = "Good Effort! Review your missed questions below.";
  } else {
    emoji = "💡";
    verdict = "Keep Practicing! Review the explanations below.";
  }

  app.innerHTML = `
    <div class="quiz-nav-bar">
      <div class="brand-title" onclick="renderStartScreen()">
        <span>EVS FAT Quiz</span>
        <span class="badge">FAT</span>
      </div>
      <div class="nav-actions">
        <button class="nav-notes-btn" onclick="renderNotesScreen()">📖 FAT Notes</button>
        <span class="stopwatch-badge">⏱️ Time: ${timeStr}</span>
        <span class="live-score">${score} / ${total} Correct</span>
      </div>
    </div>
    <div class="progress-track">
      <div class="progress-fill" style="width:100%"></div>
    </div>

    <div class="results-screen">
      <div class="results-badge">${emoji}</div>
      <h2 style="font-size:1.75rem; font-weight:800;">${verdict}</h2>
      <div class="results-score-big">${score} / ${total}</div>
      <div class="results-pct">${pct}% Accuracy</div>

      <div class="time-stats-pill">
        <span>⏱️ Total Time: <strong>${timeStr}</strong></span>
        <span>•</span>
        <span>⚡ Pace: <strong>${avgSecPerQ}s</strong> / question</span>
      </div>

      <div style="display:flex; justify-content:center; gap:0.75rem; flex-wrap:wrap; margin-bottom: 2rem;">
        <button class="btn" onclick="startQuiz(currentMode)">🔄 Retake with Fresh Reshuffle</button>
        <button class="btn btn-fat" onclick="startQuiz('mock')">⏱️ Start Another 40-Q Mock Test</button>
        <button class="btn btn-secondary" onclick="startQuiz('fat_focus')">⭐ Practice FAT Focus Bank</button>
        <button class="btn btn-secondary" style="border-color:#06b6d4; color:#22d3ee;" onclick="startQuiz('dates_treaties_sdg')">🏛️ Practice Dates, Treaties & SDGs</button>
        <button class="btn btn-secondary" style="border-color:#8b5cf6; color:#c4b5fd;" onclick="renderNotesScreen()">📖 Read FAT Revision Notes</button>
        <button class="btn btn-secondary" onclick="renderStartScreen()">🏠 Switch Topic/Mode</button>
      </div>

      <div class="review-section">
        <h3>
          <span>Detailed Answer Review</span>
          <span style="font-size:0.85rem; color:var(--text-muted); font-weight:normal;">${userAnswers.filter(a => !a.isCorrect).length} mistakes</span>
        </h3>
        
        <ul class="review-list">
          ${userAnswers.map((item, idx) => `
            <li class="review-item ${item.isCorrect ? "is-correct" : "is-wrong"}">
              <div class="review-q">
                <span style="color:${item.isCorrect ? "#34d399" : "#f87171"}">${item.isCorrect ? "✔" : "✘"}</span>
                Q${idx + 1}: ${escapeHtml(item.question)}
              </div>
              <div class="review-ans">
                <strong>Your answer:</strong> ${escapeHtml(item.selected)} 
                ${!item.isCorrect ? `&bull; <strong style="color:#34d399">Correct:</strong> ${escapeHtml(item.correct)}` : ""}
              </div>
              <div class="review-explanation">
                💡 <strong>Why:</strong> ${escapeHtml(item.explanation)}
              </div>
            </li>
          `).join("")}
        </ul>
      </div>
    </div>
  `;
}

// ── Screen: Single Unified EVS FAT Revision Notes Viewer ───────
function renderNotesScreen() {
  stopStopwatch();
  app.classList.add("wide-mode");

  app.innerHTML = `
    <div class="quiz-nav-bar">
      <div class="brand-title" onclick="renderStartScreen()">
        <span>EVS FAT Quiz</span>
        <span class="badge">FAT</span>
      </div>
      <div class="nav-actions">
        <button class="btn btn-secondary" style="padding:0.35rem 0.85rem; font-size:0.82rem;" onclick="renderStartScreen()">← Back to Quiz</button>
      </div>
    </div>

    <div class="notes-screen">
      <div class="notes-header">
        <div class="notes-header-top">
          <h2>📖 EVS FAT Revision Notes & Cheat Sheets</h2>
          <button class="btn btn-secondary" style="font-size:0.85rem; padding:0.4rem 0.9rem;" onclick="renderStartScreen()">← Return to Quiz Modes</button>
        </div>
        <p>
          Complete, unified revision notes covering all 18 exam modules: Numbers Cheat Sheet, Climate Science, Carbon Accounting, Renewables (Solar, Wind, Hydro, Geothermal), AI & IoT, Ecosystems, Biodiversity, Pollution, Environmental Laws, and Exam Tips.
        </p>
      </div>

      <!-- Real-time Search Box -->
      <div class="notes-search-container">
        <span class="notes-search-icon">🔍</span>
        <input 
          type="text" 
          id="notesSearchInput" 
          class="notes-search-input" 
          placeholder="Search any keyword, formula, standard, or law (e.g. 'Paris', 'Scope 3', 'Betz', 'Bhopal', 'Inverter', 'Tehri', 'Minamata', '10%', 'pH')..." 
          value="${escapeHtml(notesSearchTerm)}"
          oninput="handleNotesSearch(this.value)"
        />
      </div>

      <!-- Category Filter Pills -->
      <div class="notes-pills" id="notesPillsContainer">
        <!-- Rendered dynamically -->
      </div>

      <!-- Notes Content Container -->
      <div id="notesCardsContainer">
        <!-- Rendered dynamically -->
      </div>
    </div>
  `;

  renderNotesPills();
  renderNotesContent();
}

function renderNotesPills() {
  const container = document.getElementById("notesPillsContainer");
  if (!container) return;

  const categories = [
    { id: "all", label: "All Modules (18)" },
    { id: "Cheat Sheet & Numbers", label: "📌 Numbers & Cheat Sheet" },
    { id: "Climate & Carbon", label: "🌡️ Climate & Carbon" },
    { id: "Renewable Energy", label: "☀️ Renewable Energy" },
    { id: "AI & IoT", label: "🤖 AI & IoT Monitoring" },
    { id: "Earth & Ecosystems", label: "🌿 Earth & Ecosystems" },
    { id: "Biodiversity", label: "🦋 Biodiversity" },
    { id: "Pollution & Waste", label: "🏭 Pollution & Waste" },
    { id: "Waste & Circular", label: "🔄 Circular Economy" },
    { id: "Hazards & Disasters", label: "⚠️ Hazards & Disasters" },
    { id: "Environmental Laws", label: "⚖️ Environmental Laws" },
    { id: "International Treaties", label: "🌐 Treaties & SDGs" }
  ];

  container.innerHTML = categories.map(c => `
    <button class="notes-pill ${notesActivePill === c.id ? 'active' : ''}" onclick="selectNotesPill('${c.id}')">
      ${c.label}
    </button>
  `).join("");
}

function selectNotesPill(pillId) {
  notesActivePill = pillId;
  renderNotesPills();
  renderNotesContent();
}

function handleNotesSearch(term) {
  notesSearchTerm = term.trim().toLowerCase();
  renderNotesContent();
}

function renderNotesContent() {
  const container = document.getElementById("notesCardsContainer");
  if (!container) return;

  let items = fatNotesData;
  if (notesActivePill !== "all") {
    items = items.filter(n => n.category === notesActivePill);
  }

  const term = notesSearchTerm;
  if (term) {
    items = items.filter(n => {
      const textToSearch = (
        n.title + " " + n.category + " " + n.summary + " " +
        JSON.stringify(n.tableRows || []) + " " +
        JSON.stringify(n.sections || []) + " " +
        JSON.stringify(n.bullets || [])
      ).toLowerCase();
      return textToSearch.includes(term);
    });
  }

  if (items.length === 0) {
    container.innerHTML = `
      <div style="text-align:center; padding:3rem 1rem; color:var(--text-muted);">
        <div style="font-size:2.5rem; margin-bottom:0.75rem;">🔍</div>
        <h3>No matching FAT notes found for "${escapeHtml(notesSearchTerm)}"</h3>
        <p style="margin-top:0.5rem; font-size:0.9rem;">Try a broader keyword or select 'All Modules' above.</p>
      </div>
    `;
    return;
  }

  container.innerHTML = items.map(n => renderUnifiedNoteCard(n)).join("");
}

function renderUnifiedNoteCard(n) {
  let innerHtml = "";

  if (n.type === "table") {
    innerHtml = `
      <div class="notes-table-wrap">
        <table class="notes-table">
          <thead>
            <tr>
              ${n.tableHeaders.map(h => `<th>${escapeHtml(h)}</th>`).join("")}
            </tr>
          </thead>
          <tbody>
            ${n.tableRows.map(row => `
              <tr>
                <td style="font-weight:600; color:#38bdf8; min-width:240px;">${escapeHtml(row[0])}</td>
                <td>${escapeHtml(row[1])}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    `;
  } else if (n.type === "sections") {
    innerHtml = n.sections.map(sec => `
      <div class="note-section-block">
        <div class="note-section-heading">${escapeHtml(sec.heading)}</div>
        ${sec.content ? `<div class="note-section-content">${sec.content}</div>` : ""}
        ${sec.tableHeaders ? `
          <div class="notes-table-wrap">
            <table class="notes-table">
              <thead>
                <tr>
                  ${sec.tableHeaders.map(h => `<th>${escapeHtml(h)}</th>`).join("")}
                </tr>
              </thead>
              <tbody>
                ${sec.tableRows.map(row => `
                  <tr>
                    <td style="font-weight:600; color:#38bdf8; min-width:180px;">${escapeHtml(row[0])}</td>
                    <td>${escapeHtml(row[1])}</td>
                    ${row[2] ? `<td>${escapeHtml(row[2])}</td>` : ""}
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        ` : ""}
      </div>
    `).join("");
  } else if (n.type === "bullets") {
    innerHtml = `
      <ul class="note-bullets">
        ${n.bullets.map(b => `<li>${escapeHtml(b)}</li>`).join("")}
      </ul>
    `;
  }

  return `
    <div class="note-item">
      <div class="note-item-header">
        <div>
          <span class="note-tag">${escapeHtml(n.category)}</span>
          <h3 class="note-item-title" style="margin-top:0.4rem;">${escapeHtml(n.title)}</h3>
        </div>
        <span class="note-tag" style="background:#24355a; color:#cbd5e1;">${escapeHtml(n.badge)}</span>
      </div>
      <p class="note-item-sub">${escapeHtml(n.summary)}</p>
      ${innerHtml}
    </div>
  `;
}

function escapeHtml(str) {
  if (!str) return "";
  return String(str).replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
}

// ── Initialize App ─────────────────────────────────────────────
renderStartScreen();
</script>
</body>
</html>
