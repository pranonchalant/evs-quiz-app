<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EVS FAT Quiz & Revision Notes — VIT Vellore Exam Revision Bank</title>
  <style>
    /* ── Reset & Color Scheme ─────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-color: #0b1120;
      --card-bg: #131d35;
      --card-header: #1a2644;
      --border-color: #24355a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-gradient: linear-gradient(135deg, #6366f1, #06b6d4);
      --fat-gold: #f59e0b;
      --fat-gradient: linear-gradient(135deg, #f59e0b, #ef4444);
      --site-badge: #10b981;
      --correct-bg: #064e3b;
      --correct-border: #10b981;
      --wrong-bg: #451010;
      --wrong-border: #ef4444;
      --timer-color: #f59e0b;
      --timer-bg: rgba(245, 158, 11, 0.12);
      --timer-border: rgba(245, 158, 11, 0.35);
      --notes-purple: #8b5cf6;
    }

    body {
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem 3.5rem;
      background-image: 
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99, 102, 241, 0.18), transparent),
        radial-gradient(ellipse 60% 40% at 50% 120%, rgba(6, 182, 212, 0.12), transparent);
    }

    /* ── Card Container ───────────────────────────────────── */
    .quiz-card {
      width: 100%;
      max-width: 820px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 1.25rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.05);
      overflow: hidden;
      margin-top: 1rem;
      transition: max-width 0.25s ease;
    }

    .quiz-card.wide-mode {
      max-width: 960px;
    }

    /* ── Top Navigation Bar ───────────────────────────────── */
    .quiz-nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.15rem 1.75rem;
      background: var(--card-header);
      border-bottom: 1px solid var(--border-color);
      font-size: 0.92rem;
      font-weight: 600;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .brand-title {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      font-size: 1rem;
      cursor: pointer;
    }
    .brand-title span.badge {
      background: var(--fat-gradient);
      color: #ffffff;
      font-size: 0.72rem;
      padding: 0.15rem 0.45rem;
      border-radius: 0.4rem;
      font-weight: 700;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .nav-notes-btn {
      background: rgba(139, 92, 246, 0.18);
      color: #c4b5fd;
      border: 1px solid rgba(139, 92, 246, 0.35);
      padding: 0.35rem 0.85rem;
      border-radius: 2rem;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      text-decoration: none;
    }
    .nav-notes-btn:hover {
      background: rgba(139, 92, 246, 0.32);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .mode-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent);
      padding: 0.35rem 0.8rem;
      border-radius: 2rem;
      font-size: 0.8rem;
      border: 1px solid rgba(56, 189, 248, 0.3);
      max-width: 220px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Stopwatch Badge */
    .stopwatch-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: var(--timer-bg);
      color: var(--timer-color);
      border: 1px solid var(--timer-border);
      padding: 0.35rem 0.8rem;
      border-radius: 2rem;
      font-size: 0.85rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.15);
      transition: all 0.2s ease;
    }

    .stopwatch-badge.running {
      animation: timerPulse 2s infinite ease-in-out;
    }

    @keyframes timerPulse {
      0%, 100% { border-color: rgba(245, 158, 11, 0.3); }
      50% { border-color: rgba(245, 158, 11, 0.7); box-shadow: 0 0 14px rgba(245, 158, 11, 0.3); }
    }

    .live-score {
      color: #34d399;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 0.35rem 0.8rem;
      border-radius: 2rem;
      font-size: 0.82rem;
      font-weight: 700;
      white-space: nowrap;
    }

    /* ── Progress Bar ─────────────────────────────────────── */
    .progress-track {
      height: 6px;
      background: #182442;
      position: relative;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent-gradient);
      transition: width 0.35s ease;
    }

    /* ── Main Quiz Body ───────────────────────────────────── */
    .quiz-body {
      padding: 2.25rem 2rem;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .source-tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      padding: 0.25rem 0.65rem;
      border-radius: 0.5rem;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
    .source-tag.fat-tag {
      color: #fbbf24;
      background: rgba(245, 158, 11, 0.12);
      border-color: rgba(245, 158, 11, 0.3);
    }

    .random-tag {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .question-title {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 1.75rem;
      color: #ffffff;
    }

    /* ── Options List ─────────────────────────────────────── */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      list-style: none;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      padding: 1.05rem 1.25rem;
      background: #17233f;
      border: 1.5px solid #283a63;
      border-radius: 0.85rem;
      color: var(--text-main);
      font-size: 0.98rem;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: flex-start;
      gap: 0.85rem;
      line-height: 1.4;
      user-select: none;
    }

    .option-btn:hover:not(:disabled) {
      background: #1e2c4f;
      border-color: #38bdf8;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.15);
    }

    .option-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.75rem;
      height: 1.75rem;
      border-radius: 0.45rem;
      background: #253966;
      color: #cbd5e1;
      font-size: 0.85rem;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: -0.1rem;
    }

    .option-btn:disabled {
      cursor: not-allowed;
    }

    /* Correct / Incorrect states */
    .option-btn.selected-correct {
      background: var(--correct-bg) !important;
      border-color: var(--correct-border) !important;
      color: #ecfdf5 !important;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.3) !important;
    }
    .option-btn.selected-correct .option-badge {
      background: #10b981;
      color: #ffffff;
    }

    .option-btn.selected-wrong {
      background: var(--wrong-bg) !important;
      border-color: var(--wrong-border) !important;
      color: #fef2f2 !important;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.3) !important;
    }
    .option-btn.selected-wrong .option-badge {
      background: #ef4444;
      color: #ffffff;
    }

    .option-btn.highlight-correct {
      background: rgba(16, 185, 129, 0.18) !important;
      border-color: #10b981 !important;
      color: #a7f3d0 !important;
    }
    .option-btn.highlight-correct .option-badge {
      background: #10b981;
      color: #ffffff;
    }

    .option-btn.faded {
      opacity: 0.45;
    }

    /* ── Instant Feedback Box ─────────────────────────────── */
    .feedback-box {
      margin-top: 1.5rem;
      padding: 1.25rem 1.35rem;
      border-radius: 0.85rem;
      font-size: 0.95rem;
      line-height: 1.55;
      animation: fadeIn 0.25s ease-out;
      border-left: 4px solid;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .feedback-box.is-correct {
      background: rgba(6, 78, 59, 0.35);
      border-left-color: #10b981;
      color: #d1fae5;
    }

    .feedback-box.is-wrong {
      background: rgba(69, 16, 16, 0.4);
      border-left-color: #ef4444;
      color: #fee2e2;
    }

    .feedback-status {
      font-weight: 800;
      font-size: 1.05rem;
      margin-bottom: 0.35rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .feedback-explanation {
      color: #cbd5e1;
      font-size: 0.92rem;
    }

    /* ── Action Buttons ───────────────────────────────────── */
    .action-row {
      margin-top: 1.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 1.6rem;
      border-radius: 0.75rem;
      font-size: 0.98rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: var(--accent-gradient);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(6, 182, 212, 0.45);
    }

    .btn-fat {
      background: var(--fat-gradient);
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
    }
    .btn-fat:hover {
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.45);
    }

    .btn-secondary {
      background: #17233f;
      color: #cbd5e1;
      border: 1px solid var(--border-color);
      box-shadow: none;
    }
    .btn-secondary:hover {
      background: #283d6d;
      color: #ffffff;
      box-shadow: none;
    }

    /* ── Mode Selection Screen ────────────────────────────── */
    .start-screen {
      padding: 2.5rem 2rem;
      text-align: center;
    }

    .brand-hero {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    .brand-hero h1 {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-hero .fat-pill {
      background: var(--fat-gradient);
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 800;
      padding: 0.25rem 0.65rem;
      border-radius: 0.5rem;
      text-transform: uppercase;
      box-shadow: 0 2px 10px rgba(245, 158, 11, 0.3);
    }

    .start-subtitle {
      color: var(--text-muted);
      font-size: 0.98rem;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    .features-pill-row {
      display: flex;
      justify-content: center;
      gap: 0.6rem;
      margin-bottom: 1.75rem;
      flex-wrap: wrap;
    }

    .feature-pill {
      font-size: 0.78rem;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 0.25rem 0.75rem;
      border-radius: 1rem;
      font-weight: 600;
    }
    .feature-pill.notes-pill-top {
      color: #c4b5fd;
      background: rgba(139, 92, 246, 0.12);
      border-color: rgba(139, 92, 246, 0.35);
    }

    .mode-cards {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      margin-bottom: 2rem;
      text-align: left;
    }

    .mode-card {
      background: #17233f;
      border: 2px solid #283a63;
      border-radius: 1rem;
      padding: 1.25rem 1.5rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .mode-card:hover {
      border-color: #38bdf8;
      background: #1c2a4d;
      transform: translateY(-2px);
    }

    /* FAT Featured All 420 Questions */
    .mode-card.fat-featured {
      border-color: #f59e0b;
      background: linear-gradient(145deg, #17233f, #2e2311);
    }

    /* Timed Mock 40 Questions */
    .mode-card.mock-featured {
      border-color: #6366f1;
      background: linear-gradient(145deg, #17233f, #1e2448);
    }

    .mode-card.featured {
      border-color: #10b981;
      background: linear-gradient(145deg, #17233f, #132e3b);
    }

    /* Dates, Treaties, WHO & SDGs Card */
    .mode-card.treaties-featured {
      border-color: #06b6d4;
      background: linear-gradient(145deg, #17233f, #0c2b3a);
    }
    .mode-card.treaties-featured:hover {
      border-color: #22d3ee;
      background: #113649;
    }
    .mode-card.treaties-featured .mode-badge-count {
      color: #22d3ee;
      background: rgba(6, 182, 212, 0.15);
      border: 1px solid rgba(6, 182, 212, 0.35);
    }

    /* Notes Card */
    .mode-card.notes-card {
      border-color: #8b5cf6;
      background: linear-gradient(145deg, #17233f, #231942);
    }
    .mode-card.notes-card:hover {
      border-color: #a78bfa;
      background: #241d4c;
    }

    .mode-card h3 {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .mode-card p {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .mode-badge-count {
      background: #253966;
      color: var(--accent);
      padding: 0.35rem 0.8rem;
      border-radius: 2rem;
      font-size: 0.8rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .mode-card.fat-featured .mode-badge-count {
      color: #fbbf24;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.35);
    }

    .mode-card.mock-featured .mode-badge-count {
      color: #38bdf8;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.35);
    }

    .mode-card.featured .mode-badge-count {
      color: #34d399;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .mode-card.notes-card .mode-badge-count {
      color: #c4b5fd;
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.35);
    }

    .topic-select-row {
      margin: 1.5rem 0 2rem;
      text-align: left;
    }

    .topic-select-row label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .topic-dropdown {
      flex: 1;
      padding: 0.85rem 1rem;
      background: #17233f;
      color: #ffffff;
      border: 1.5px solid #283a63;
      border-radius: 0.65rem;
      font-size: 0.95rem;
      font-family: inherit;
      cursor: pointer;
    }

    /* ── Single Unified FAT Notes Viewer Screen ───────────── */
    .notes-screen {
      padding: 2.25rem 2rem;
      text-align: left;
    }

    .notes-header {
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1.25rem;
    }

    .notes-header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .notes-header h2 {
      font-size: 1.6rem;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .notes-header p {
      font-size: 0.92rem;
      color: var(--text-muted);
      line-height: 1.45;
    }

    /* Search Box */
    .notes-search-container {
      position: relative;
      margin-bottom: 1.25rem;
    }

    .notes-search-input {
      width: 100%;
      padding: 0.85rem 1.2rem 0.85rem 2.6rem;
      background: #17233f;
      border: 1.5px solid #283a63;
      border-radius: 0.75rem;
      color: #ffffff;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }

    .notes-search-input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .notes-search-icon {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      color: var(--text-muted);
    }

    /* Category Pill Filters */
    .notes-pills {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }

    .notes-pill {
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.35rem 0.8rem;
      border-radius: 2rem;
      border: 1px solid #283a63;
      background: #17233f;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .notes-pill:hover, .notes-pill.active {
      background: rgba(245, 158, 11, 0.18);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.4);
    }

    /* Note Card & Section Layout */
    .note-item {
      background: #17233f;
      border: 1px solid #283a63;
      border-radius: 1rem;
      padding: 1.5rem;
      margin-bottom: 1.25rem;
      transition: all 0.2s ease;
    }

    .note-item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .note-item-title {
      font-size: 1.18rem;
      font-weight: 700;
      color: #ffffff;
    }

    .note-item-sub {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      line-height: 1.45;
    }

    .note-tag {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.2rem 0.55rem;
      border-radius: 0.35rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      background: rgba(245, 158, 11, 0.18);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.35);
    }

    /* Tables in Notes */
    .notes-table-wrap {
      overflow-x: auto;
      margin: 1rem 0;
      border-radius: 0.65rem;
      border: 1px solid #283a63;
    }

    .notes-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.86rem;
      text-align: left;
    }

    .notes-table th {
      background: #1e2e50;
      color: #cbd5e1;
      padding: 0.75rem 1rem;
      font-weight: 700;
      border-bottom: 1px solid #283a63;
      white-space: nowrap;
    }

    .notes-table td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #203155;
      color: #e2e8f0;
      vertical-align: top;
      line-height: 1.45;
    }

    .notes-table tr:last-child td {
      border-bottom: none;
    }

    .notes-table tr:hover td {
      background: rgba(56, 189, 248, 0.04);
    }

    /* Bullet List in Notes */
    .note-bullets {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      margin-top: 0.75rem;
    }

    .note-bullets li {
      position: relative;
      padding-left: 1.4rem;
      font-size: 0.9rem;
      color: #cbd5e1;
      line-height: 1.5;
    }

    .note-bullets li::before {
      content: "•";
      position: absolute;
      left: 0.4rem;
      color: #f59e0b;
      font-weight: 900;
    }

    .note-section-block {
      margin-top: 1.25rem;
      padding-top: 1.25rem;
      border-top: 1px dashed #283a63;
    }
    .note-section-block:first-child {
      margin-top: 0;
      padding-top: 0;

100 years", "explanation": "Under the Greenhouse Gas Protocol and UNFCCC frameworks, Global Warming Potential (GWP) is standardly computed over a 100-year time horizon.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": true, "isDatesTreatiesSdg": false}, {"id": 41, "question": "The GWP100 of methane is approximately:", "options": ["1", "265-298", "28-34", "10,000"], "correctAnswer": "28-34", "explanation": "The IPCC 5th Assessment Report quotes the 100-year GWP of biogenic methane between 28 and 34 times that of carbon dioxide.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 42, "question": "Scope 1 emissions are:", "options": ["Emissions from disposal only", "Value-chain emissions", "Indirect emissions from purchased electricity", "Direct emissions from owned/controlled sources"], "correctAnswer": "Direct emissions from owned/controlled sources", "explanation": "Scope 1 covers direct GHG emissions from operations owned or controlled by the reporting organization (e.g., combustion in boilers, furnaces, fleet vehicles).", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": true, "isDatesTreatiesSdg": false}, {"id": 43, "question": "Emissions from purchased electricity are classified as:", "options": ["Scope 0", "Scope 3", "Scope 1", "Scope 2"], "correctAnswer": "Scope 2", "explanation": "Scope 2 encompasses indirect GHG emissions associated with the generation of purchased electricity, steam, heating, or cooling consumed by the organi otprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": true, "isDatesTreatiesSdg": false}, {"id": 47, "question": "ISO 14064 is a standard for:", "options": ["Food safety", "GHG inventories", "Energy audit of buildings", "Quality management"], "correctAnswer": "GHG inventories", "explanation": "ISO 14064 provides international guidelines for quantifying, monitoring, and reporting organizational greenhouse gas inventories and verification.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 48, "question": "Global average carbon footprint is about ______ t CO2e per person per year.", "options": ["0.4", "4", "400", "40"], "correctAnswer": "4", "explanation": "The global mean per capita carbon footprint is roughly 4.0 tonnes of CO2e per year.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 49, "question": "The average Indian's footprint is approximately ______ t CO2e per year.", "options": ["50", "2", "30", "15"], "correctAnswer": "2", "explanation": "An average person in India emits approximately 2 tonnes of CO2e per year, well below the global average (~4 t) and the US average (~14–16 t).", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 50, "question": "Life Cycle Assessment (LCA) covers:", "options": ["Only manufacturing", "Only use phase", "Cradle to grave", "Only disposal"], "correctAnswer": "Cradle to grave", "explanation": "A full LCA evaluates comprehensive environmental impacts across the complete lifespan from raw material extraction ('cradle') to end-of-life disposal ('grave').", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": true, "isDatesTreatiesSdg": false}, {"id": 51, "question": "'Cradle to cradle' LCA ideally ends with:", "options": ["Landfill", "Reuse and recycling", "Incineration", "Export"], "correctAnswer": "Reuse and recycling", "explanation": "In a regenerative 'cradle to cradle' framework, post-consumer end-of-life goods feed directly back into manufacturing loops via reuse, repair, or recycling.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 52, "question": "Emission factors convert ______ into CO2e.", "options": ["Population", "Wind speed", "Temperature", "Activity data"], "correctAnswer": "Activity data", "explanation": "Emission factors are coefficients that mathematically convert quantifiable activity data (litres of diesel, kWh of grid electricity, tonne-km) into CO2e.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 53, "question": "Electricity and heat generation account for about ______ of global CO2 emissions.", "options": ["16%", "34%", "80%", "5%"], "correctAnswer": "34%", "explanation": "Power and heat generation represent the largest single sector, accounting for roughly 34% of global CO2 emissions.", "category" f cement releases about ______ of CO2.", "options": ["8 t", "80 t", "0.8 t", "0.08 t"], "correctAnswer": "0.8 t", "explanation": "Manufacturing one tonne of ordinary Portland cement emits approximately 0.8 tonnes of CO2.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": true, "isDatesTreatiesSdg": false}, {"id": 58, "question": "Roughly half of cement CO2 comes from:", "options": ["Packaging", "Calcination of limestone", "Water use", "Transport"], "correctAnswer": "Calcination of limestone", "explanation": "Chemical decomposition (calcination of limestone: CaCO3 -> CaO + CO2) accounts for roughly 50% of cement emissions; the rest is fuel combustion.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 59, "question": "Coal-fired power produces roughly ______ the CO2 per unit energy compared with natural gas.", "options": ["Half", "One-tenth", "Twice", "Equal"], "correctAnswer": "Twice", "explanation": "Combusting coal releases approximately double the mass of CO2 per megawatt-hour of electrical output compared to modern natural gas turbines.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 60, "question": "The IEA calls energy efficiency the:", "options": ["Last resort", "First fuel", "Slow fuel", "Hidden tax"], "correctAnswer": "First fuel", "explanation": "The International Energy Agency (IEA) designates energy efficiency as the 'first fuel' because avoided waste is the cleanest and cheapest resource.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 61, "question": "CCS stands for:", "options": ["Carbon Capture and Storage", "Clean Carbon Source", "Carbon Cycle System", "Controlled Combustion Standard"], "correctAnswer": "Carbon Capture and Storage", "explanation": "CCS stands for Carbon Capture and Storage: capturing industrial flue gas CO2 and sequestering it securely deep underground in geological formations.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 62, "question": "CCU converts captured CO2 into:", "options": ["Useful products like fuels or building materials", "Radioactive waste", "Nitrogen", "Ozone"], "correctAnswer": "Useful products like fuels or building materials", "explanation": "Carbon Capture and Utilisation (CCU) recycles captured CO2 into commercially valuable commodities such as synthetic fuels, carbonates, and chemicals.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 63, "question": "DAC (Direct Air Capture) removes CO2:", "options": ["Only from oceans", "Only from power plant stacks", "Directly from ambient air", "Only from vehicles"], "correctAnswer": "Directly from ambient air", "explanation": "Direct Air Capture (DAC) uses chemical contactors to scrub dilute carbon dioxide directly out of the ambient free atmosphere.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 64, "question": "Planting trees on previously non-forested land is called:", "options": ["Deforestation", "Silviculture only", "Reforestation", "Afforestation"], "correctAnswer": "Afforestation", "explanation": "Afforestation is establishing a forest on lands that historically have not contained forest cover (reforestation restores recently cleared lands).", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 65, "question": "Recycled aluminium needs about ______ less energy than primary aluminium.", "options": ["95%", "5%", "25%", "50%"], "correctAnswer": "95%", "explanation": "Recycling secondary scrap aluminium saves roughly 95% of the massive electrical energy required to smelt virgin bauxite ore via the Hall-Héroult process.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 66, "question": "The circular economy contrasts with the linear model of:", "options": ["Repair, reuse", "Reduce, reuse, recycle", "Design for disassembly", "Take, make, dispose"], "correctAnswer": "Take, make, dispose", "explanation": "A circular economy decouples growth from resource extraction, directly rejecting the linear 'take-make-dispose' throwaway paradigm.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesS Generated": true, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 169, "question": "Which ecological pyramid is always upright?", "options": ["Numbers", "Biomass", "Energy", "All can be inverted"], "correctAnswer": "Energy", "explanation": "The pyramid of energy is always upright because energy is lost as heat at every successive trophic level according to the Second Law of Thermodynamics.", "category": "Ecosystem & Energy Flow", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": true, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 170, "question": "Primary succession begins on:", "options": ["A mature forest", "Previously cultivated soil", "Bare/lifeless substrate", "A polluted river only"], "correctAnswer": "Bare/lifeless substrate", "explanation": "Primary succession initiates on barren, lifeless substrates where no soil or previous ecological community existed (e.g., bare rock, new lava flows).", "category": "Ecological Succession", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": true, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 171, "question": "Pioneer species in primary succession include:", "options": ["Tigers", "Lichens and mosses", "Large trees", "Top carnivores"], "correctAnswer": "Lichens and mosses", "explanation": "Pioneers in primary terrestrial succession are hardy organisms such as lichens and mosses capable of adhering to bare substrates and initiating pedogenesis (soil formation).", "category": "Ecological Succession", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": true, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 172, "question": "Species diversity includes:", "options": ["Only species count", "Species richness and evenness", "Only genetic variation", "Only ecosystem area"], "correctAn ": "General EVS", "isFatExam": false, "isWebsiteOfficial63": true, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 176, "question": "A species naturally restricted to a particular geographic area is:", "options": ["Extinct", "Endemic", "Invasive", "Cosmopolitan"], "correctAnswer": "Endemic", "explanation": "An endemic species is naturally and exclusively confined to a particular geographic region or ecosystem.", "category": "Biodiversity & Conservation", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": true, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 177, "question": "A pollutant emitted directly from a source is:", "options": ["Secondary pollutant", "Primary pollutant", "Tertiary pollutant", "Residual pollutant"], "correctAnswer": "Primary pollutant", "explanation": "A primary pollutant is an air contaminant emitted directly in an active, harmful form from identifiable sources (e.g., CO, SO2 from exhausts).", "category": "Air Pollution", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": true, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 178, "question": "Ground-level ozone is generally a:", "options": ["Primary pollutant", "Secondary pollutant", "Nutrient", "Heavy metal"], "correctAnswer": "Secondary pollutant", "explanation": "Ground-level (tropospheric) ozone is a secondary pollutant synthesized photochemically when NOx reacts with volatile organic compounds (VOCs) under sunlight.", "category": "Air Pollution", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": true, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 179, "question": "AQI 401–500 in the supplied notes is:", "options": ["Good", "Moderate", "Very unhealthy", "Hazardous"], "correctAnswer": "Hazardous", "explanation": " c taxation", "Global Stocktake"], "correctAnswer": "CDM", "explanation": "The Clean Development Mechanism (CDM) is the Kyoto Protocol flexible mechanism enabling industrialized nations to implement emission-reduction projects in developing nations in return for certified carbon credits.", "category": "Kyoto, Paris & SDGs", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": true, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": true}, {"id": 193, "question": "Paris NDCs are:", "options": ["Identical for every country", "Nationally determined climate contributions", "Only financial reports", "Wildlife schedules"], "correctAnswer": "Nationally determined climate contributions", "explanation": "Nationally Determined Contributions (NDCs) represent the self-defined, bottom-up climate mitigation and adaptation commitments submitted by each signatory under the Paris Agreement.", "category": "Kyoto, Paris & SDGs", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": true, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": true}, {"id": 194, "question": "Global Stocktake occurs every:", "options": ["Year", "2 years", "5 years", "10 years"], "correctAnswer": "5 years", "explanation": "Article 14 of the Paris Agreement establishes the Global Stocktake every 5 years to evaluate collective progress toward achieving the treaty's long-term temperature and mitigation goals.", "category": "Kyoto, Paris & SDGs", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": true, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": true}, {"id": 195, "question": "Net-zero means:", "options": ["No emissions anywhere", "Emissions are balanced by removals", "Only planting trees", "Zero industrial activity"], "correctAnswer": "Emissions are balanced by removals", "explanation": "Net-zero greenhouse gas emissions describes the state where grated Wildlife Recovery Management"], "correctAnswer": "Integrated Water Resources Management", "explanation": "IWRM stands for Integrated Water Resources Management, a coordinated framework to balance social, economic, and environmental water needs.", "category": "Water Pollution & Management", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": true, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 211, "question": "Composting primarily produces:", "options": ["Compost/nutrient-rich material", "Mercury", "Ozone", "Crude oil"], "correctAnswer": "Compost/nutrient-rich material", "explanation": "Composting is the aerobic biological decomposition of organic solid wastes into nutrient-rich humus (compost) suitable for soil conditioning.", "category": "Circular Economy & Solid Waste", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": true, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 212, "question": "Which atmospheric layer is the coldest in the supplied notes?", "options": ["Troposphere", "Stratosphere", "Mesosphere", "Thermosphere"], "correctAnswer": "Mesosphere", "explanation": "The mesosphere is the coldest thermal layer of Earth's atmosphere, where temperatures plunge to approximately -90°C.", "category": "Earth as a Life Support System", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": true, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 213, "question": "Which layer has auroras?", "options": ["Troposphere", "Stratosphere", "Thermosphere", "Exosphere"], "correctAnswer": "Thermosphere", "explanation": "The thermosphere contains the ionosphere, where solar high-energy radiation ionizes atmospheric gas molecules, creating atmospheric auroras (Borealis/Australis).", "category": "Earth as a Life Support System", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": true, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 214, "question": "Which process returns nutrients from dead matter?", "options": ["Decomposition", "Photosynthesis only", "Predation only", "Evaporation"], "correctAnswer": "Decomposition", "explanation": "Decomposition by fungi and bacteria breaks down dead organic tissues, remineralizing locked nutrients and recycling them back into soil and biogeochemical cycles.", "category": "Ecosystem & Energy Flow", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": true, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 215, "question": "A food web is:", "options": ["One linear chain", "A network of interconnected food chains", "Only decomposers", "Only aquatic organisms"], "correctAnswer": "A network of interconnected food chains", "explanation": "A food web represents an interconnected, realistic network of multiple feeding interactions and cross-linked food chains within an ecosystem.", "category": "Ecosystem & Energy Flow", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": true, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 216, "question": "The end stage of succession is called:", "options": ["Nudation", "Invasion", "Competition", "Climax"], "correctAnswer": "Climax", "explanation": "The climax community represents the terminal, stabilized, self-perpetuating final stage of ecological succession in dynamic equilibrium with regional climate.", "category": "Ecological Succession", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": true, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 217, "question": "Xerosere begins in:", "options": ["Water", "Saline habitat", "Dry/waterless habitat", "Deep ocean"], "correctA d study boundaries", "explanation": "EIA scoping defines the scope, priority environmental issues, assessment methodologies, and spatial/temporal boundaries of the Environmental Impact Assessment study.", "category": "Environmental Impact Assessment (EIA)", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": true, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 225, "question": "Which boundary separates the troposphere from the stratosphere?", "options": ["Stratopause", "Mesopause", "Tropopause", "Thermopause"], "correctAnswer": "Tropopause", "explanation": "The tropopause is the atmospheric boundary layer where the environmental lapse rate drops and temperature inversion begins in the stratosphere.", "category": "Earth as a Life Support System", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 226, "question": "The lithosphere primarily comprises:", "options": ["Earth's crust and uppermost solid mantle", "Only ocean sediments", "The molten liquid outer core", "The lower atmosphere gases"], "correctAnswer": "Earth's crust and uppermost solid mantle", "explanation": "The lithosphere constitutes the rigid outermost shell of rocky terrestrial planets, consisting of the crust and upper mantle.", "category": "Earth as a Life Support System", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 227, "question": "The term 'Ecology' was coined in 1866 by:", "options": ["Charles Elton", "Ernst Haeckel", "Eugene Odum", "Arthur Tansley"], "correctAnswer": "Ernst Haeckel", "explanation": "German zoologist Ernst Haeckel coined the word 'Oecologie' from Greek oikos (house) and logos (study) to denote the study of organisms in their environment.", "category": "Ecosystem — Core Concepts", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 228, "question": "Which of the following is an artificial (man-made) ecosystem?", "options": ["Tropical rainforest", "Coral reef", "Cultivated crop field", "Natural freshwater lake"], "correctAnswer": "Cultivated crop field", "explanation": "Agricultural crop fields, managed aquaria, and botanical gardens are artificial ecosystems requiring continuous human inputs of energy and nutrients.", "category": "Ecosystem — Core Concepts", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 229, "question": "Which biome exhibits the highest Net Primary Productivity (NPP) according to the notes?", "options": ["Temperate grassland", "Tropical rainforest", "Boreal taiga", "Arctic tundra"], "correctAnswer": "Tropical rainforest", "explanation": "Tropical rainforests have optimal temperature, abundant rainfall, and year-round sunlight, generating high NPP of ~2,000 g/m²/year.", "category": "Ecosystem & Energy Flow", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 230, "question": "Why does the Second Law of Thermodynamics explain unidirectional energy flow in ecosystems?", "options": ["Energy is destroyed at each trophic level", "Energy transformation is never 100% efficient; heat is continuously lost", "Energy increases as entropy decreases", "Consumers produce their own solar radiation"], "correctAnswer": "Energy transformation is never 100% efficient; heat is continuously lost", "explanation": "Due to entropy and the 2nd law, energy degraded into metabolic heat cannot be recaptured by autotrophs, making energy flow strictly one-way.", "category": "Ecosystem & Energy Flow", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 231, "question": "According to the notes, secondary succession is roughly how much faster than primary succession?", "options": ["Equal speed", "2× faster", "5–10× faster", "100× faster"], "correctAnswer": "5–10× faster", "explanation": "Secondary succession proceeds roughly 5–10 times faster than primary succession because fertile topsoil and seed propagules already exist.", "category": "Ecological Succession", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 232, "question": "The Polyclimax Theory of ecological succession was proposed by:", "options": ["F.E. Clements", "A.G. Tansley", "Charles Darwin", "Raymond Lindeman"], "correctAnswer": "A.G. Tansley", "explanation": "Sir Arthur Tansley proposed the Polyclimax Theory, arguing that multiple stable climax types can persist in a region governed by moisture, soil, or topography.", "category": "Ecological Succession", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 233, "question": "An amensal relationship is represented by:", "options": ["(+, +)", "(+, 0)", "(-, 0)", "(-, -)"], "correctAnswer": "(-, 0)", "explanation": "In amensalism (-, 0), one organism is inhibited or destroyed while the other remains completely unaffected (e.g. Penicillium secreting penicillin).", "category": "Biodiversity & Conservation", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 234, "question": "In a Biosphere Reserve, human settlements and sustainable eco-friendly practices are permitted primarily in the:", "options": ["Core zone", "Buffer zone only", "Transition zone", "National Park core"], "correctAnswer": "Transition zone", "explanation": "The outer Transition zone (Zone of Cooperation) contains human settlements, sustainable agriculture, and economic activities managed in harmony with nature.", "category": "Biodiversity & Conservation", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 235, "question": "Bt toxins encoded by Cry genes are toxic to target insects because they:", "options": ["Freeze the insect's hemolymph", "Bind to receptors in the alkaline insect midgut and form lethal pores", "Paralyze insect wings", "Prevent egg hatching"], "correctAnswer": "Bind to receptors in the alkaline insect midgut and form lethal pores", "explanation": "Under the alkaline pH of the insect midgut, Cry protoxins are cleaved into active toxins that bind epithelial cadherin receptors and lyse gut cells.", "category": "Genetically Modified Crops", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 236, "question": "Which of the following is a primary ingredient and indicator of photochemical smog?", "options": ["Sulfur dioxide only", "Peroxyacyl nitrate (PAN) and tropospheric ozone", "Pure water vapor", "Carbonic acid"], "correctAnswer": "Peroxyacyl nitrate (PAN) and tropospheric ozone", "explanation": "Photochemical smog is characterized by oxidants such as tropospheric ozone and peroxyacyl nitrates (PAN), which irritate human eyes and respiratory tracts.", "category": "Air Pollution", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 237, "question": "What is the relationship between Biochemical Oxygen Demand (BOD) and water quality?", "options": ["Higher BOD indicates purer water", "Higher BOD indicates high organic pollution and low dissolved oxygen", "BOD is unrelated to dissolved oxygen", "BOD only measures salinity"], "correctAnswer": "Higher BOD indicates high organic pollution and low dissolved oxygen", "explanation": "High BOD means large amounts of organic waste are present; aerobic microbes consume dissolved oxygen to oxidize it, depleting oxygen for fish.", "category": "Water Pollution & Management", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 238, "question": "Under the Noise Rules 2000 in India, ambient daytime noise standard for a Silent Zone is:", "options": ["50 dB(A)", "75 dB(A)", "85 dB(A)", "100 dB(A)"], "correctAnswer": "50 dB(A)", "explanation": "In India, silent zones (areas within 100m of hospitals, courts, schools) have daytime limits of 50 dB(A) and nighttime limits of 40 dB(A).", "category": "Noise, Thermal & Soil", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 239, "question": "The biogas produced during anaerobic digestion consists predominantly of:", "options": ["Nitrogen and oxygen", "Methane (CH4) and Carbon dioxide (CO2)", "Chlorine and hydrogen", "Pure sulfur dioxide"], "correctAnswer": "Methane (CH4) and Carbon dioxide (CO2)", "explanation": "Anaerobic digesters produce biogas composed of 50–70% methane and 30–45% carbon dioxide, functioning as a clean renewable fuel.", "category": "Circular Economy & Solid Waste", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 240, "question": "Bisphenol A (BPA) poses human health risks primarily because it mimics which hormone?", "options": ["Insulin", "Estrogen", "Thyroxine", "Adrenaline"], "correctAnswer": "Estrogen", "explanation": "BPA is a xenoestrogen that binds to estrogen receptors, interfering with endocrine regulation, fetal development, and reproductive systems.", "category": "Chemical Hazards (BPA & Mercury)", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 241, "question": "The neurological disease resulting from methylmercury toxicity was first recognized around which Japanese bay?", "options": ["Tokyo Bay", "Osaka Bay", "Minamata Bay", "Kyoto Bay"], "correctAnswer": "Minamata Bay", "explanation": "Industrial discharges of inorganic mercury into Minamata Bay were biologically converted by microbes to methylmercury, intoxicating consumers of coastal seafood.", "category": "Chemical Hazards (BPA & Mercury)", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 242, "question": "What is the primary role of the Environmental Management Plan (EMP) in an EIA report?", "options": ["Calculate tax rates", "Detail mitigation measures, monitoring mechanisms, and emergency plans", "Advertise the project", "Select political representatives"], "correctAnswer": "Detail mitigation measures, monitoring mechanisms, and emergency plans", "explanation": "An EMP operationalizes the EIA by laying out specific, time-bound mitigation actions, monitoring schedules, and institutional responsibilities.", "category": "Environmental Impact Assessment (EIA)", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false, "isDatesTreaties x-situ conservation?", "options": ["National park", "Wildlife sanctuary", "Botanical garden", "Biosphere reserve"], "correctAnswer": "Botanical garden", "explanation": "Botanical gardens, zoos, and seed banks preserve species off-site outside their natural habitats (ex-situ), whereas parks and sanctuaries are in-situ.", "category": "Biodiversity & Conservation", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": true, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 253, "question": "Project Tiger was launched in:", "options": ["1972", "1973", "1980", "1992"], "correctAnswer": "1973", "explanation": "Project Tiger was launched by the Government of India in April 1973 from Jim Corbett National Park to protect the Bengal tiger.", "category": "Biodiversity & Conservation", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": true, "isFatFocus": false, "isDatesTreatiesSdg": true}, {"id": 254, "question": "India's first national park mentioned in the notes is:", "options": ["Kaziranga National Park", "Bandipur National Park", "Jim Corbett National Park", "Gir National Park"], "correctAnswer": "Jim Corbett National Park", "explanation": "Jim Corbett National Park in Uttarakhand was established in 1936 (originally as Hailey National Park), making it India's first national park.", "category": "Biodiversity & Conservation", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": true, "isFatFocus": false, "isDatesTreatiesSdg": true}, {"id": 255, "question": "Which is the correct order of the 3Rs?", "options": ["Recycle -> Reuse -> Reduce", "Reuse -> Reduce -> Recycle", "Reduce -> Reuse -> Recycle", "Reduce -> Recycle -> Reuse"], "correctAnswer": "Reduce -> Reuse -> Recycle", "explanation": "The waste hierarchy prioritizes prevention (Reduce), followed by direct re-utilization (Reuse), and lastly material reprocessing (Recycle).", "category": "Circular Economy & Waste", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": true, "isFatFocus": true, "isDatesTreatiesSdg": false}, {"id": 256, "question": "The linear economy is commonly described as:", "options": ["Reduce, reuse, recycle", "Take, make, dispose", "Produce, conserve, restore", "Extract, recycle, regenerate"], "correctAnswer": "Take, make, dispose", "explanation": "The traditional linear economic model follows a 'take-make-dispose' step, in contrast to the circular economy's regenerative closed loop.", "category": "Circular Economy & Waste", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": true, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 257, "question": "The most widely used matrix method in EIA mentioned in the notes is:", "options": ["Delphi Matrix", "Leopold Matrix", "SWOT Matrix", "Risk Matrix"], "correctAnswer": "Leopold Matrix", "explanation": "The Leopold Matrix is a pioneering and widely adopted qualitative Environmental Impact Assessment (EIA) method.", "category": "EIA & Environmental Tools", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": true, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 258, "question": "The Leopold Matrix was developed in:", "options": ["1965", "1971", "1981", "1992"], "correctAnswer": "1971", "explanation": "Luna Leopold and colleagues developed the Leopold Matrix in 1971 for the US Geological Survey to evaluate environmental impacts.", "category": "EIA & Environmental Tools", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": true, "isFatFocus": true, "isDatesTreatiesSdg": true}, {"id": 259, "question": "Which is the first major stage of EIA?", "options": ["Monitoring", "Screening", "Public consultation", "Mitigation"], "correctAnswer": "Screening", "explanation": "Screening is the initial stage of EIA to decide whether a proposed project requires an environmental assessment and at what level of detail.", "category": "EIA & Environmental Tools", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": true, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 260, "question": "Which EIA methodology maps cause-and-effect chains?", "options": ["Checklist", "Matrix", "Network analysis", "Questionnaire"], "correctAnswer": "Network analysis", "explanation": "Network analysis diagrams trace primary, secondary, and tertiary cause-and-effect pathways connecting activities to environmental consequences.", "category": "EIA & Environmental Tools", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": true, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 261, "question": "The Kyoto Protocol was adopted in:", "options": ["1992", "1995", "1997", "2005"], "correctAnswer": "1997", "explanation": "The Kyoto Protocol was adopted on 11 December 1997 in Kyoto, Japan, under the UNFCCC.", "category": "Kyoto, Paris & SDGs", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": true, "isFatFocus": false, "isDatesTreatiesSdg": true}, {"id": 262, "question": "Kyoto's first commitment period was:", "options": ["1997-2002", "2005-2010", "2008-2012", "2015-2020"], "correctAnswer": "2008-2012", "explanation": "The Kyoto Protocol's first commitment period ran from 2008 to 2012, setting binding emission reduction targets for Annex I countries.", "category": "Kyoto, Paris & SDGs", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": true, "isFatFocus": false, "isDatesTreatiesSdg": true}, {"id": 263, "qu c insect pests.", "category": "Genetically Modified Crops", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": true, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 277, "question": "Environmental science primarily studies:", "options": ["Only pollution", "Interactions between humans and natural systems", "Only biodiversity", "Only climate"], "correctAnswer": "Interactions between humans and natural systems", "explanation": "Environmental science is the systematic study of our environment and human interactions with both living and non-living systems.", "category": "Environmental Studies & Ecosystem", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 278, "question": "Environmental studies is:", "options": ["A single-discipline subject", "An interdisciplinary field", "Purely an engineering subject", "Purely a biological subject"], "correctAnswer": "An interdisciplinary field", "explanation": "Environmental studies integrates ecology, chemistry, physics, economics, law, sociology, and engineering.", "category": "Environmental Studies & Ecosystem", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 279, "question": "Which discipline can contribute to environmental studies?", "options": ["Ecology", "Geology", "Engineering", "All of the above"], "correctAnswer": "All of the above", "explanation": "Environmental studies draws insights and tools from physical sciences, life sciences, and applied engineering fields.", "category": "Environmental Studies & Ecosystem", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 280, "question": "An ecosystem is best described as:", "options": ["Only a group of animals", "Only physical surroundings", "A functional unit involving biotic and abiotic components", "A collection of plants only"], "correctAnswer": "A functional unit involving biotic and abiotic components", "explanation": "An ecosystem is a biological community of interacting organisms (biotic) and their physical environment (abiotic) functioning as a unit.", "category": "Environmental Studies & Ecosystem", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 281, "question": "Functional aspects of an ecosystem primarily include:", "options": ["Species colour and size", "Energy flow and nutrient cycling", "Population naming", "Taxonomy"], "correctAnswer": "Energy flow and nutrient cycling", "explanation": "The core functional processes of any ecosystem are the unidirectional flow of energy and the biogeochemical cycling of nutrients.", "category": "Environmental Studies & Ecosystem", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 282, "question": "Which is a terrestrial ecosystem?", "options": ["Ocean", "Lake", "Forest", "Sea"], "correctAnswer": "Forest", "explanation": "Terrestrial ecosystems are land-based communities, including forests, grasslands, deserts, and tundras.", "category": "Environmental Studies & Ecosystem", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 283, "question": "Which is a freshwater ecosystem?", "options": ["Ocean", "Lake", "Coral reef", "Estuary"], "correctAnswer": "Lake", "explanation": "Lakes, ponds, rivers, and streams are freshwater ecosystems with low dissolved salt concentrations (<0.5 ppt).", "category": "Environmental Studies & Ecosystem", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 284, "question": "Marine ecosystems are characterized by:", "options": ["No salt", "High salt content", "Only freshwater species", "Absence of biodiversity"], "correctAnswer": "High salt content", "explanation": "Marine ecosystems (oceans, coral reefs) have high salt concentrations, typically averaging around 35 parts per thousand.", "category": "Environmental Studies & Ecosystem", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 285, "question": "Energy flow in an ecosystem is:", "options": ["Cyclic", "Bidirectional", "Unidirectional", "Random"], "correctAnswer": "Unidirectional", "explanation": "Energy flows in one direction: from the sun to autotrophs, then to successive heterotrophic levels, dissipating as heat.", "category": "Ecosystem & Energy Flow", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 286, "question": "Matter in an ecosystem is:", "options": ["Destroyed permanently", "Continuously recycled", "Converted entirely into energy", "Never transferred"], "correctAnswer": "Continuously recycled", "explanation": "Unlike energy which flows unidirectionally, matter and essential nutrients (carbon, nitrogen, phosphorus) circulate cyclically.", "category": "Ecosystem & Energy Flow", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 287, "question": "The Detritus Food Chain begins with:", "options": ["Producers", "Herbivores", "Dead organic matter", "Carnivores"], "correctAnswer": "Dead organic matter", "explanation": "The detritus food chain starts with non-living dead organic matter (detritus), which is broken down by decomposers and detritivores.", "category": "Ecosystem & Energy Flow", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 288, "question": "Photosynthesis converts:", "options": ["Chemical energy into heat", "Light energy into chemical energy", "Heat into light", "Mechanical energy into chemical energy"], "correctAnswer": "Light energy into chemical energy", "explanation": "Plants capture solar light energy and convert it into chemical energy stored in the chemical bonds of glucose.", "category": "Ecosystem & Energy Flow", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 289, "question": "Lindemann's 10% law states that:", "options": ["10% of organisms survive", "10% of energy is transferred to the next trophic level", "10% of biomass becomes soil", "10% of sunlight reaches Earth"], "correctAnswer": "10% of energy is transferred to the next trophic level", "explanation": "Only about 10% of available energy at any given trophic level is passed onto organisms at the next trophic level.", "category": "Ecosystem & Energy Flow", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": true, "isDatesTreatiesSdg": false}, {"id": 290, "question": "The pyramid of energy is:", "options": ["Always inverted", "Always upright", "Sometimes absent", "Always horizontal"], "correctAnswer": "Always upright", "explanation": "Because energy is lost as heat at every step pursuant to the second law of thermodynamics, energy pyramids are always alse, "isDatesTreatiesSdg": false}, {"id": 347, "question": "Excess nitrogen and phosphorus can cause:", "options": ["Desertification", "Eutrophication", "Earthquakes", "Ozone depletion"], "correctAnswer": "Eutrophication", "explanation": "Nutrient enrichment (eutrophication) of water bodies by nitrates and phosphates triggers excessive algal blooms.", "category": "Water Pollution & Management", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 348, "question": "In eutrophication, decomposition of algal biomass leads to:", "options": ["Increased dissolved oxygen", "Oxygen depletion", "Reduced nutrients", "Reduced bacterial activity"], "correctAnswer": "Oxygen depletion", "explanation": "Aerobic bacteria consume large quantities of dissolved oxygen while breaking down dead algal blooms, suffocating fish and aquatic life.", "category": "Water Pollution & Management", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 349, "question": "Biomagnification generally causes greater pollutant concentration at:", "options": ["Lower trophic levels", "Top trophic levels", "Producers only", "Decomposers only"], "correctAnswer": "Top trophic levels", "explanation": "Persistent lipophilic contaminants (like DDT and mercury) multiply in concentration at each ascending step of the food chain, peaking at apex predators.", "category": "Water Pollution & Management", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 350, "question": "Minamata disease is associated with:", "options": ["Lead", "Mercury", "Arsenic", "Cadmium"], "correctAnswer": "Mercury", "explanation": "Minamata disease is a severe neur lse}, {"id": 358, "question": "A typical conversation is approximately:", "options": ["5 dB", "30 dB", "50 dB", "120 dB"], "correctAnswer": "50 dB", "explanation": "Standard normal human speech creates an ambient sound intensity of roughly 50 to 60 dB.", "category": "Noise, Thermal & Soil", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 359, "question": "Prolonged exposure above approximately ____ can damage hearing.", "options": ["25 dB", "50 dB", "65 dB", "85 dB"], "correctAnswer": "85 dB", "explanation": "Occupational safety standards (like OSHA/NIOSH) warn that continuous occupational noise exceeding 85 dB induces permanent hearing impairment.", "category": "Noise, Thermal & Soil", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 360, "question": "Noise pollution is particularly dangerous to marine animals because:", "options": ["They depend on sound for communication and finding food", "They cannot swim", "They cannot reproduce", "They require sunlight"], "correctAnswer": "They depend on sound for communication and finding food", "explanation": "Cetaceans and marine species rely on echolocation and acoustic channels for navigation, foraging, and social communication.", "category": "Noise, Thermal & Soil", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 361, "question": "India's Noise Pollution Regulation & Control Rules were introduced in:", "options": ["1981", "1992", "2000", "2010"], "correctAnswer": "2000", "explanation": "India framed the Noise Pollution (Regulation and Control) Rules in 2000 under the Environment (Protection) Act, 1986.", "category": "Noise, Thermal & Soil", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 362, "question": "Thermal pollution is primarily caused by:", "options": ["Discharge of abnormally hot/cold water", "Noise", "Solid waste alone", "Radiation only"], "correctAnswer": "Discharge of abnormally hot/cold water", "explanation": "Thermal pollution occurs when power plants or factories draw water for cooling and return heated water into aquatic bodies.", "category": "Noise, Thermal & Soil", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 363, "question": "Increasing water temperature generally:", "options": ["Increases oxygen solubility", "Reduces oxygen solubility", "Has no effect on oxygen", "Eliminates thermal stress"], "correctAnswer": "Reduces oxygen solubility", "explanation": "Gas solubility exhibits an inverse relationship with temperature: warmer water can hold significantly less dissolved oxygen.", "category": "Noise, Thermal & Soil", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 364, "question": "A 1-1.5 C increase in water temperature can:", "options": ["Improve biodiversity everywhere", "Reduce oxygen solubility and stress aquatic life", "Stop all biological activity", "Freeze water"], "correctAnswer": "Reduce oxygen solubility and stress aquatic life", "explanation": "Even slight temperature increases reduce dissolved oxygen and alter metabolic rates of fish and benthic organisms.", "category": "Noise, Thermal & Soil", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {" ": "Risk is quantitatively evaluated as the probability of a hazard causing injury, damage, or adverse effects multiplied by consequence.", "category": "Hazards & Disaster Management", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 369, "question": "Anthropogenic hazards arise from:", "options": ["Natural tectonic processes", "Human activities", "Solar radiation only", "Ocean tides only"], "correctAnswer": "Human activities", "explanation": "Anthropogenic hazards are threats originating from human action, inaction, negligence, or engineering failures.", "category": "Hazards & Disaster Management", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 370, "question": "A technological hazard includes:", "options": ["Oil spills", "Industrial accidents", "Chemical leaks", "All of the above"], "correctAnswer": "All of the above", "explanation": "Industrial catastrophes, petrochemical discharges, and hazardous chemical releases are prototypical technological disasters.", "category": "Hazards & Disaster Management", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreatiesSdg": false}, {"id": 371, "question": "Disaster management includes:", "options": ["Prevention", "Preparedness", "Response and recovery", "All of the above"], "correctAnswer": "All of the above", "explanation": "Comprehensive disaster risk management operates as an integrated cycle: prevention, mitigation, preparedness, response, and recovery.", "category": "Hazards & Disaster Management", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false, "isDatesTreaties
