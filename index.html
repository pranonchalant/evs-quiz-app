"isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": true, "isFatFocus": false}, {"id": 266, "question": "The central temperature goal of the Paris Agreement is to:", "options": ["Keep warming below 4 C", "Keep warming well below 2 C and pursue 1.5 C", "Maintain exactly 1 C warming", "Eliminate all greenhouse gases immediately"], "correctAnswer": "Keep warming well below 2 C and pursue 1.5 C", "explanation": "Article 2 of the Paris Agreement aims to hold global average temperature increase to well below 2 C above pre-industrial levels and pursue efforts to limit it to 1.5 C.", "category": "Kyoto, Paris & SDGs", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": true, "isFatFocus": false}, {"id": 267, "question": "Nationally Determined Contributions are associated primarily with:", "options": ["Kyoto Protocol", "Montreal Protocol", "Paris Agreement", "Ramsar Convention"], "correctAnswer": "Paris Agreement", "explanation": "Nationally Determined Contributions (NDCs) form the core bottom-up pledge mechanism of the 2015 Paris Agreement.", "category": "Kyoto, Paris & SDGs", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": true, "isFatFocus": false}, {"id": 268, "question": "India's Paris NDC includes a target of ____ of installed power capacity from non-fossil sources by 2030.", "options": ["30%", "40%", "50%", "75%"], "correctAnswer": "50%", "explanation": "India updated its NDC commitment to achieve 50% cumulative electric power installed capacity from non-fossil fuel-based energy resources by 2030.", "category": "Kyoto, Paris & SDGs", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": true, "isFatFocus": false}, {"id": 269, "question": "The Water (Prevention and Control of Pollution) Act was enacted in:", "options": ["1972", "1974", "1981", "1986"], "correctAnswer": "1974", "explanation": "India enacted the Water (Prevention and Control of Pollution) Act in 1974, providing for CPCB and SPCB regulatory frameworks.", "category": "Indian Environmental Laws", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": true, "isFatFocus": false}, {"id": 270, "question": "Section 24 of the Water Act deals with:", "options": ["Air pollution control areas", "Prohibition on discharge of polluting matter into streams/wells", "Environmental laboratories", "Wildlife protection"], "correctAnswer": "Prohibition on discharge of polluting matter into streams/wells", "explanation": "Section 24 of the Water Act 1974 explicitly prohibits knowingly causing or permitting any poisonous, noxious, or polluting matter into streams or wells.", "category": "Indian Environmental Laws", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": true, "isFatFocus": false}, {"id": 271, "question": "Under the Water Act, consent for new outlets/new discharges is primarily associated with:", "options": ["Section 19", "Section 21", "Section 25", "Section 31A"], "correctAnswer": "Section 25", "explanation": "Section 25 of the Water Act requires obtaining prior consent from the State Pollution Control Board to establish new outlets or discharges.", "category": "Indian Environmental Laws", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": true, "isFatFocus": false}, {"id": 272, "question": "The Environment (Protection) Act is commonly known as:", "options": ["Water Act", "Umbrella legislation", "Wildlife Act", "Forest Act"], "correctAnswer": "Umbrella legislation", "explanation": "The Environment (Protection) Act 1986 acts as 'umbrella legislation', coordinating regulatory activities across multiple environmental authorities.", "category": "Indian Environmental Laws", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": true, "isFatFocus": false}, {"id": 273, "question": "Noise was officially added as an air pollutant through the:", "options": ["1974 amendment", "1980 amendment", "1987 amendment", "1992 amendment"], "correctAnswer": "1987 amendment", "explanation": "The Air (Prevention and Control of Pollution) Act 1981 was amended in 1987 to expand the definition of air pollutants to include noise.", "category": "Air Pollution", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": true, "isFatFocus": false}, {"id": 274, "question": "The Forest (Conservation) Act was enacted in:", "options": ["1972", "1974", "1980", "1986"], "correctAnswer": "1980", "explanation": "The Forest (Conservation) Act was enacted in 1980 to strictly regulate and restrict the de-reservation and diversion of forest land for non-forest purposes.", "category": "Indian Environmental Laws", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": true, "isFatFocus": false}, {"id": 275, "question": "Only about what percentage of energy is transferred from one trophic level to the next according to Lindemann's law?", "options": ["1%", "5%", "10%", "25%"], "correctAnswer": "10%", "explanation": "Raymond Lindeman (1942) formulated the 10% law: only about 10% of energy transferred to a trophic level is stored as biomass for the next level.", "category": "Ecosystem & Energy Flow", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": true, "isFatFocus": false}, {"id": 276, "question": "Bt in Bt cotton refers to:", "options": ["Biotechnology", "Bacillus thuringiensis", "Biological toxin", "Botanical technology"], "correctAnswer": "Bacillus thuringiensis", "explanation": "Bt stands for Bacillus thuringiensis, a naturally occurring soil bacterium that produces proteins toxic to specific insect pests.", "category": "Genetically Modified Crops", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": true, "isFatFocus": false}, {"id": 277, "question": "Environmental science primarily studies:", "options": ["Only pollution", "Interactions between humans and natural systems", "Only biodiversity", "Only climate"], "correctAnswer": "Interactions between humans and natural systems", "explanation": "Environmental science is the systematic study of our environment and human interactions with both living and non-living systems.", "category": "Environmental Studies & Ecosystem", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 278, "question": "Environmental studies is:", "options": ["A single-discipline subject", "An interdisciplinary field", "Purely an engineering subject", "Purely a biological subject"], "correctAnswer": "An interdisciplinary field", "explanation": "Environmental studies integrates ecology, chemistry, physics, economics, law, sociology, and engineering.", "category": "Environmental Studies & Ecosystem", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 279, "question": "Which discipline can contribute to environmental studies?", "options": ["Ecology", "Geology", "Engineering", "All of the above"], "correctAnswer": "All of the above", "explanation": "Environmental studies draws insights and tools from physical sciences, life sciences, and applied engineering fields.", "category": "Environmental Studies & Ecosystem", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 280, "question": "An ecosystem is best described as:", "options": ["Only a group of animals", "Only physical surroundings", "A functional unit involving biotic and abiotic components", "A collection of plants only"], "correctAnswer": "A functional unit involving biotic and abiotic components", "explanation": "An ecosystem is a biological community of interacting organisms (biotic) and their physical environment (abiotic) functioning as a unit.", "category": "Environmental Studies & Ecosystem", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 281, "question": "Functional aspects of an ecosystem primarily include:", "options": ["Species colour and size", "Energy flow and nutrient cycling", "Population naming", "Taxonomy"], "correctAnswer": "Energy flow and nutrient cycling", "explanation": "The core functional processes of any ecosystem are the unidirectional flow of energy and the biogeochemical cycling of nutrients.", "category": "Environmental Studies & Ecosystem", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 282, "question": "Which is a terrestrial ecosystem?", "options": ["Ocean", "Lake", "Forest", "Sea"], "correctAnswer": "Forest", "explanation": "Terrestrial ecosystems are land-based communities, including forests, grasslands, deserts, and tundras.", "category": "Environmental Studies & Ecosystem", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 283, "question": "Which is a freshwater ecosystem?", "options": ["Ocean", "Lake", "Coral reef", "Estuary"], "correctAnswer": "Lake", "explanation": "Lakes, ponds, rivers, and streams are freshwater ecosystems with low dissolved salt concentrations (<0.5 ppt).", "category": "Environmental Studies & Ecosystem", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 284, "question": "Marine ecosystems are characterized by:", "options": ["No salt", "High salt content", "Only freshwater species", "Absence of biodiversity"], "correctAnswer": "High salt content", "explanation": "Marine ecosystems (oceans, coral reefs) have high salt concentrations, typically averaging around 35 parts per thousand.", "category": "Environmental Studies & Ecosystem", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 285, "question": "Energy flow in an ecosystem is:", "options": ["Cyclic", "Bidirectional", "Unidirectional", "Random"], "correctAnswer": "Unidirectional", "explanation": "Energy flows in one direction: from the sun to autotrophs, then to successive heterotrophic levels, dissipating as heat.", "category": "Ecosystem & Energy Flow", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 286, "question": "Matter in an ecosystem is:", "options": ["Destroyed permanently", "Continuously recycled", "Converted entirely into energy", "Never transferred"], "correctAnswer": "Continuously recycled", "explanation": "Unlike energy which flows unidirectionally, matter and essential nutrients (carbon, nitrogen, phosphorus) circulate cyclically.", "category": "Ecosystem & Energy Flow", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 287, "question": "The Detritus Food Chain begins with:", "options": ["Producers", "Herbivores", "Dead organic matter", "Carnivores"], "correctAnswer": "Dead organic matter", "explanation": "The detritus food chain starts with non-living dead organic matter (detritus), which is broken down by decomposers and detritivores.", "category": "Ecosystem & Energy Flow", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 288, "question": "Photosynthesis converts:", "options": ["Chemical energy into heat", "Light energy into chemical energy", "Heat into light", "Mechanical energy into chemical energy"], "correctAnswer": "Light energy into chemical energy", "explanation": "Plants capture solar light energy and convert it into chemical energy stored in the chemical bonds of glucose.", "category": "Ecosystem & Energy Flow", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 289, "question": "Lindemann's 10% law states that:", "options": ["10% of organisms survive", "10% of energy is transferred to the next trophic level", "10% of biomass becomes soil", "10% of sunlight reaches Earth"], "correctAnswer": "10% of energy is transferred to the next trophic level", "explanation": "Only about 10% of available energy at any given trophic level is passed onto organisms at the next trophic level.", "category": "Ecosystem & Energy Flow", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": true}, {"id": 290, "question": "The pyramid of energy is:", "options": ["Always inverted", "Always upright", "Sometimes absent", "Always horizontal"], "correctAnswer": "Always upright", "explanation": "Because energy is lost as heat at every step pursuant to the second law of thermodynamics, energy pyramids are always upright.", "category": "Ecosystem & Energy Flow", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 291, "question": "The ecological pyramid is associated with:", "options": ["Charles Elton", "Charles Darwin only", "Mendel", "Louis Pasteur"], "correctAnswer": "Charles Elton", "explanation": "British ecologist Charles Elton introduced the concept of ecological pyramids (Eltonian pyramids) in 1927.", "category": "Ecosystem & Energy Flow", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 292, "question": "Charles Elton proposed the ecological pyramid in:", "options": ["1890", "1927", "1942", "1972"], "correctAnswer": "1927", "explanation": "Charles Elton published 'Animal Ecology' in 1927, in which he conceptualized ecological pyramids of numbers, biomass, and energy.", "category": "Ecosystem & Energy Flow", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 293, "question": "Tropical rainforests have approximately:", "options": ["100 g/m2/year NPP", "500 g/m2/year", "2,000 g/m2/year", "10,000 g/m2/year"], "correctAnswer": "2,000 g/m2/year", "explanation": "Tropical rainforests are among the most productive terrestrial biomes, boasting a net primary productivity around 2,000 g/m²/year.", "category": "Ecosystem & Energy Flow", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 294, "question": "Nitrogen fixation in legumes is associated with:", "options": ["Lactobacillus", "Rhizobium", "Vibrio", "Plasmodium"], "correctAnswer": "Rhizobium", "explanation": "Rhizobium bacteria form symbiotic nodules on legume roots, converting atmospheric nitrogen (N2) into bioavailable ammonia.", "category": "Ecosystem & Energy Flow", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 295, "question": "Ecological succession refers to:", "options": ["Sudden extinction", "Gradual change in community composition over time", "Migration of animals only", "Pollution of an ecosystem"], "correctAnswer": "Gradual change in community composition over time", "explanation": "Ecological succession is the orderly, predictable process of gradual change in species structure of an ecological community over time.", "category": "Ecological Succession", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 296, "question": "Secondary succession occurs where:", "options": ["Life never existed", "The previous ecosystem has been disturbed or destroyed", "There is no soil", "There are no microorganisms"], "correctAnswer": "The previous ecosystem has been disturbed or destroyed", "explanation": "Secondary succession occurs following a disturbance (e.g., fire, flood, logging) in an area where soil and seed banks already exist.", "category": "Ecological Succession", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 297, "question": "Pioneer species are:", "options": ["Final climax species", "First colonizing species", "Largest predators", "Extinct species"], "correctAnswer": "First colonizing species", "explanation": "Pioneer species (such as lichens and mosses) are the hardy first colonizers of newly created or disturbed environments.", "category": "Ecological Succession", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 298, "question": "Which generally occurs faster?", "options": ["Primary succession", "Secondary succession", "Both always take equal time", "Neither"], "correctAnswer": "Secondary succession", "explanation": "Secondary succession is significantly faster because fertile soil, organic matter, and dormant propagules are already present.", "category": "Ecological Succession", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 299, "question": "The final stabilized stage of succession is called:", "options": ["Pioneer stage", "Seral stage", "Climax community", "Nudation"], "correctAnswer": "Climax community", "explanation": "The climax community represents the stable, self-perpetuating end-point of ecological succession in dynamic equilibrium with climate.", "category": "Ecological Succession", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 300, "question": "According to the notes, the theory of monoclimax was given by:", "options": ["F.E. Clements", "Charles Elton", "Lindemann", "Tansley"], "correctAnswer": "F.E. Clements", "explanation": "Frederic Clements proposed the Monoclimax Theory, postulating that a region's vegetation culminates in a single climatic climax community.", "category": "Ecological Succession", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 301, "question": "Nudation refers to:", "options": ["Formation of a bare area", "Formation of a climax community", "Pollination", "Nutrient recycling"], "correctAnswer": "Formation of a bare area", "explanation": "Nudation is the initial stage of succession involving the development of a bare, uninhabited substrate.", "category": "Ecological Succession", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 302, "question": "Which biodiversity component concerns variation between ecosystems?", "options": ["Genetic diversity", "Species diversity", "Ecosystem diversity", "Population density"], "correctAnswer": "Ecosystem diversity", "explanation": "Ecosystem diversity encompasses the variety of habitats, natural communities, and ecological processes across biomes.", "category": "Biodiversity & Species Status", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 303, "question": "Species evenness indicates:", "options": ["Total number of species", "How evenly individuals are distributed among species", "Genetic mutation", "Number of habitats"], "correctAnswer": "How evenly individuals are distributed among species", "explanation": "Species evenness measures the relative abundance of the different species making up the richness of an area.", "category": "Biodiversity & Species Status", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 304, "question": "High species diversity generally increases:", "options": ["Ecosystem instability", "Ecosystem stability and resilience", "Pollution", "Extinction rate"], "correctAnswer": "Ecosystem stability and resilience", "explanation": "Diverse communities tend to have more functional redundancy and buffering capacity against environmental shocks.", "category": "Biodiversity & Species Status", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 305, "question": "Which is an economic value of biodiversity?", "options": ["Pharmaceutical resources", "Ecotourism", "Agricultural genetic resources", "All of the above"], "correctAnswer": "All of the above", "explanation": "Biodiversity underpins medicine, nature-based tourism, and crop breeding programs essential for food security.", "category": "Biodiversity & Species Status", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 306, "question": "A species facing a very high risk of extinction in the near future is:", "options": ["Rare", "Endemic", "Endangered", "Common"], "correctAnswer": "Endangered", "explanation": "IUCN defines endangered species as those confronting an extremely elevated probability of extinction in the wild.", "category": "Biodiversity & Species Status", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 307, "question": "A rare species differs from an endangered species because a rare species:", "options": ["Is necessarily extinct", "Is not currently at high risk of extinction according to the notes", "Has no ecological value", "Exists everywhere"], "correctAnswer": "Is not currently at high risk of extinction according to the notes", "explanation": "Rare species have small or localized populations, but are not necessarily facing immediate extinction unlike endangered species.", "category": "Biodiversity & Species Status", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 308, "question": "The Nilgiri tahr is endemic to:", "options": ["Eastern Himalayas", "Western Ghats", "Andaman Islands", "Thar Desert"], "correctAnswer": "Western Ghats", "explanation": "The Nilgiri tahr (an endangered mountain ungulate) is endemic to the high-altitude shola grasslands of the Western Ghats.", "category": "Biodiversity & Species Status", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 309, "question": "The Ganges river dolphin is threatened particularly by:", "options": ["Desertification", "Water pollution and dam construction", "Forest fires only", "Noise from airports only"], "correctAnswer": "Water pollution and dam construction", "explanation": "Dams and barrages fragment dolphin habitats and disrupt migration, exacerbated by heavy industrial and municipal river pollution.", "category": "Biodiversity & Species Status", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 310, "question": "Which is an example of commensalism?", "options": ["Predator and prey", "Barnacles and whales", "Bee and flower", "Parasite and host"], "correctAnswer": "Barnacles and whales", "explanation": "In commensalism (+/0), barnacles benefit by hitching a ride to feed in plankton-rich waters while causing no substantial harm or benefit to whales.", "category": "Species Interactions", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 311, "question": "In mutualism:", "options": ["Both species benefit", "One benefits and one is harmed", "One benefits and the other is unaffected", "Both are harmed"], "correctAnswer": "Both species benefit", "explanation": "Mutualism (+/+) is an ecological interaction in which each participating species derives a fitness benefit.", "category": "Species Interactions", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 312, "question": "Predation involves:", "options": ["Both organisms benefiting", "One organism killing and eating another", "One organism remaining unaffected", "Resource sharing"], "correctAnswer": "One organism killing and eating another", "explanation": "Predation (+/-) is a biological interaction where one organism (predator) captures, kills, and feeds on another (prey).", "category": "Species Interactions", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 313, "question": "Competition occurs when organisms:", "options": ["Depend on the same limited resources", "Always help one another", "Never interact", "Are all parasites"], "correctAnswer": "Depend on the same limited resources", "explanation": "Competition (-/-) arises when organisms exploit the same restricted supply of vital resources like food, water, or territory.", "category": "Species Interactions", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 314, "question": "In-situ conservation maintains:", "options": ["Natural evolutionary processes", "Only laboratory populations", "Only seeds", "Only captive animals"], "correctAnswer": "Natural evolutionary processes", "explanation": "In-situ conservation protects organisms within their evolving ecosystems, allowing natural selection and evolutionary processes to continue uninterrupted.", "category": "Conservation", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 315, "question": "Cryopreservation commonly uses:", "options": ["Boiling water", "Liquid nitrogen", "Sunlight", "Dry heat"], "correctAnswer": "Liquid nitrogen", "explanation": "Cryopreservation preserves cells, tissues, and germplasm at ultra-low temperatures using liquid nitrogen.", "category": "Conservation", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 316, "question": "Cryopreservation may involve storage at approximately:", "options": ["0 C", "-20 C", "-196 C", "+100 C"], "correctAnswer": "-196 C", "explanation": "Liquid nitrogen cools samples down to -196 °C, suspending all biochemical activity and degradation.", "category": "Conservation", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 317, "question": "The National Bureau of Plant Genetic Resources is located in:", "options": ["Mumbai", "New Delhi", "Chennai", "Bengaluru"], "correctAnswer": "New Delhi", "explanation": "The NBPGR is headquartered in New Delhi and manages India's national gene bank for plant genetic resources.", "category": "Conservation", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 318, "question": "The Indian Botanical Garden mentioned in the notes was established in:", "options": ["1787", "1857", "1936", "1972"], "correctAnswer": "1787", "explanation": "The Indian Botanic Garden at Shibpur, Howrah (near Kolkata), was founded in 1787 by Colonel Robert Kyd.", "category": "Conservation", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 319, "question": "Biosphere reserves aim to combine:", "options": ["Conservation and sustainable development", "Mining and conservation", "Industrialization and deforestation", "Urbanization and pollution"], "correctAnswer": "Conservation and sustainable development", "explanation": "Under UNESCO's MAB program, biosphere reserves harmonize ecological conservation with socio-economic sustainable development.", "category": "Conservation", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 320, "question": "The Convention on Biological Diversity was established in:", "options": ["1972", "1980", "1992", "2002"], "correctAnswer": "1992", "explanation": "The CBD was opened for signature at the Rio Earth Summit in 1992 to protect biological diversity globally.", "category": "Conservation", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 321, "question": "Project Elephant was launched in:", "options": ["1973", "1980", "1992", lse}, {"id": 325, "question": "Reduce is first in the 3R hierarchy because:", "options": ["Recycling is impossible", "It prevents waste from being generated in the first place", "Reuse is illegal", "Landfills are free"], "correctAnswer": "It prevents waste from being generated in the first place", "explanation": "Source reduction avoids resource extraction, energy expenditures, and waste handling altogether.", "category": "Circular Economy & Waste", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 326, "question": "Reuse means:", "options": ["Destroying a product", "Using something again without significant reprocessing", "Burning waste", "Converting waste into energy"], "correctAnswer": "Using something again without significant reprocessing", "explanation": "Reuse repurposes items in their existing form without consuming substantial energy to dismantle or re-melt them.", "category": "Circular Economy & Waste", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 327, "question": "Recycling means:", "options": ["Disposing of waste", "Processing material into something new", "Storing waste underground", "Producing virgin raw material"], "correctAnswer": "Processing material into something new", "explanation": "Recycling transforms waste materials into new substances or manufactured products.", "category": "Circular Economy & Waste", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 328, "question": "Extended Producer Responsibility means:", "options": ["Consumers are legally responsible for everything", "Producers bear responsibility for products at end-of-life", "Government owns every product", "Recycling is prohibited"], "correctAnswer": "Producers bear responsibility for products at end-of-life", "explanation": "EPR is an environmental policy approach assigning manufacturers financial and physical responsibility for end-of-life treatment of their goods.", "category": "Circular Economy & Waste", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 329, "question": "Industrial symbiosis involves:", "options": ["Industries independently discarding all waste", "Industries exchanging by-products/resources", "Closing industries", "Only household recycling"], "correctAnswer": "Industries exchanging by-products/resources", "explanation": "In industrial symbiosis, the waste output or byproduct of one industrial process serves directly as the input feedstock for another.", "category": "Circular Economy & Waste", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 330, "question": "Urban mining involves recovering:", "options": ["Soil from forests", "Valuable materials from discarded electronics", "Water from oceans", "Coal from mountains"], "correctAnswer": "Valuable materials from discarded electronics", "explanation": "Urban mining is the reclaim of precious and critical raw materials (gold, copper, rare earths) from electronic waste and discarded infrastructure.", "category": "Circular Economy & Waste", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 331, "question": "Controlled incineration generally occurs at approximately:", "options": ["100-200 C", "300-400 C", "800-1000 C", "2000-3000 C"], "correctAnswer": "800-1000 C", "explanation": "Modern controlled waste incinerators operate between 850°C and 1000°C to guarantee complete thermal breakdown of dioxins and hazardous volatiles.", "category": "Circular Economy & Waste", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 332, "question": "The circular economy differs from the linear economy because it emphasizes:", "options": ["Take-make-dispose", "Continuous resource use and regeneration", "Landfill dependency", "Resource depletion"], "correctAnswer": "Continuous resource use and regeneration", "explanation": "Circular systems decouple economic activity from the consumption of finite resources through continuous regeneration.", "category": "Circular Economy & Waste", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 333, "question": "The two major categories based on formation are:", "options": ["Indoor and outdoor", "Primary and secondary", "Natural and biological", "Local and global"], "correctAnswer": "Primary and secondary", "explanation": "Based on their mode of formation, air pollutants are classified into primary (emitted directly) and secondary (formed via reactions).", "category": "Air Pollution", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 334, "question": "A primary pollutant is:", "options": ["Formed only after atmospheric reactions", "Directly emitted from a source", "Always harmless", "Always a solid"], "correctAnswer": "Directly emitted from a source", "explanation": "Primary pollutants enter the atmosphere directly from identifiable point or mobile sources (e.g., CO, SO2 from smokestacks).", "category": "Air Pollution", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 335, "question": "Ground-level ozone is primarily a:", "options": ["Primary pollutant", "Secondary pollutant", "Heavy metal", "Particulate"], "correctAnswer": "Secondary pollutant", "explanation": "Tropospheric ozone is not emitted directly; it is synthesized through photochemical reactions between NOx and VOCs under solar radiation.", "category": "Air Pollution", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 336, "question": "Photochemical smog formation involves:", "options": ["NOx + VOCs + sunlight", "CO2 + nitrogen", "SO2 + methane only", "Oxygen + water only"], "correctAnswer": "NOx + VOCs + sunlight", "explanation": "Photochemical smog forms when nitrogen oxides and volatile organic compounds react in the presence of ultraviolet sunlight.", "category": "Air Pollution", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 337, "question": "Acid rain commonly has a pH:", "options": ["Above 8", "Exactly 7", "Below 5.6", "Above 10"], "correctAnswer": "Below 5.6", "explanation": "Normal unpolluted rain has a pH around 5.6 due to dissolved atmospheric CO2 forming mild carbonic acid; precipitation with pH < 5.6 is acid rain.", "category": "Air Pollution", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": true}, {"id": 338, "question": "The major natural source of SO2 in the notes is:", "options": ["Volcanic eruptions", "Earthquakes", "Rain", "Ocean waves"], "correctAnswer": "Volcanic eruptions", "explanation": "Volcanoes vent massive volumes of sulfur dioxide naturally into the atmosphere during eruptive and outgassing phases.", "category": "Air Pollution", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 339, "question": "Radon is:", "options": ["A radioactive gas", "A greenhouse particle", "A heavy metal", "A biological pollutant"], "correctAnswer": "A radioactive gas", "explanation": "Radon is a colorless, odorless, naturally occurring radioactive noble gas produced from the decay of uranium in soils and rocks.", "category": "Air Pollution", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 340, "question": "Radon is described as the second leading cause of lung cancer after:", "options": ["Air pollution", "Smoking", "Alcohol", "Noise"], "correctAnswer": "Smoking", "explanation": "Radon gas decay products lodge in lung tissues and emit alpha radiation, making radon the #1 cause of lung cancer in non-smokers and #2 overall after smoking.", "category": "Air Pollution", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 341, "question": "Which device is designed to remove particulate matter from industrial exhaust?", "options": ["Electrostatic precipitator", "Refrigerator", "Condenser only", "Chlorinator"], "correctAnswer": "Electrostatic precipitator", "explanation": "Electrostatic precipitators (ESPs) charge suspended dust particles and collect them on oppositely charged plates with over 99% efficiency.", "category": "Air Pollution", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 342, "question": "India adopted BS-VI emission standards in:", "options": ["2015", "2018", "2020", "2024"], "correctAnswer": "2020", "explanation": "India leapfrogged directly from Bharat Stage IV to BS-VI vehicular emission norms nationwide starting April 1, 2020.", "category": "Air Pollution", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 343, "question": "The safe drinking-water pH range given in the notes is:", "options": ["2-4", "4-6", "6.5-8.5", "9-12"], "correctAnswer": "6.5-8.5", "explanation": "WHO and BIS drinking water specifications dictate an acceptable potable pH range between 6.5 and 8.5.", "category": "Water Pollution & Management", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 344, "question": "The WHO water-quality value for TDS given in the notes is:", "options": ["<50 mg/L", "<100 mg/L", "<500 mg/L", "<5000 mg/L"], "correctAnswer": "<500 mg/L", "explanation": "Total Dissolved Solids (TDS) under 500 mg/L is generally classified by WHO as good to excellent for drinking purposes.", "category": "Water Pollution & Management", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 345, "question": "A factory pipe discharging wastewater is an example of:", "options": ["Non-point source pollution", "Point source pollution", "Natural pollution", "Diffuse pollution"], "correctAnswer": "Point source pollution", "explanation": "Point-source pollution originates from an identifiable, single, and stationary localized discharge outlet such as an industrial conduit.", "category": "Water Pollution & Management", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 346, "question": "Agricultural runoff is generally:", "options": ["Point-source pollution", "Non-point-source pollution", "Thermal pollution only", "Noise pollution"], "correctAnswer": "Non-point-source pollution", "explanation": "Agricultural runoff containing pesticides and fertilizers flows diffusely over vast catchment areas, representing non-point-source pollution.", "category": "Water Pollution & Management", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 347, "question": "Excess nitrogen and phosphorus can cause:", "options": ["Desertification", "Eutrophication", "Earthquakes", "Ozone depletion"], "correctAnswer": "Eutrophication", "explanation": "Nutrient enrichment (eutrophication) of water bodies by nitrates and phosphates triggers excessive algal blooms.", "category": "Water Pollution & Management", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 348, "question": "In eutrophication, decomposition of algal biomass leads to:", "options": ["Increased dissolved oxygen", "Oxygen depletion", "Reduced nutrients", "Reduced bacterial activity"], "correctAnswer": "Oxygen depletion", "explanation": "Aerobic bacteria consume large quantities of dissolved oxygen while breaking down dead algal blooms, suffocating fish and aquatic life.", "category": "Water Pollution & Management", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 349, "question": "Biomagnification generally causes greater pollutant concentration at:", "options": ["Lower trophic levels", "Top trophic levels", "Producers only", "Decomposers only"], "correctAnswer": "Top trophic levels", "explanation": "Persistent lipophilic contaminants (like DDT and mercury) multiply in concentration at each ascending step of the food chain, peaking at apex predators.", "category": "Water Pollution & Management", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 350, "question": "Minamata disease is associated with:", "options": ["Lead", "Mercury", "Arsenic", "Cadmium"], "correctAnswer": "Mercury", "explanation": "Minamata disease is a severe neurological syndrome caused by bioaccumulated methylmercury poisoning.", "category": "Water Pollution & Management", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": true}, {"id": 351, "question": "Minamata disease occurred in:", "options": ["India", "Japan", "USA", "France"], "correctAnswer": "Japan", "explanation": "The outbreak occurred around Minamata Bay in Kumamoto Prefecture, Japan, starting in the mid-1950s due to industrial effluent.", "category": "Water Pollution & Management", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 352, "question": "Secondary wastewater treatment is primarily:", "options": ["Physical", "Biological", "Geological", "Thermal"], "correctAnswer": "Biological", "explanation": "Secondary treatment utilizes aerobic or anaerobic microorganisms (e.g., activated sludge, trickling filters) to degrade dissolved organic matter.", "category": "Water Pollution & Management", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 353, "question": "Tertiary treatment is:", "options": ["Advanced treatment", "Preliminary screening only", "Primary sedimentation only", "Open dumping"], "correctAnswer": "Advanced treatment", "explanation": "Tertiary treatment is the advanced polishing step removing residual phosphorus, nitrogen, heavy metals, and pathogens before reuse.", "category": "Water Pollution & Management", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 354, "question": "Drip irrigation conserves water mainly by:", "options": ["Flooding the entire field", "Delivering water directly to the root zone", "Increasing evaporation", "Increasing runoff"], "correctAnswer": "Delivering water directly to the root zone", "explanation": "Micro-irrigation drippers supply metered moisture straight to root zones, drastically cutting evaporation and surface runoff losses.", "category": "Water Pollution & Management", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 355, "question": "Integrated Water Resources Management is abbreviated:", "options": ["IWRM", "IWPM", "IRWM", "WRIM"], "correctAnswer": "IWRM", "explanation": "IWRM stands for Integrated Water Resources Management, a coordinated development process for water, land, and related resources.", "category": "Water Pollution & Management", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 356, "question": "Jal Shakti Abhiyan was launched in:", "options": ["1992", "2002", "2012", "2019"], "correctAnswer": "2019", "explanation": "The Government of India inaugurated the Jal Shakti Abhiyan campaign in 2019 for water conservation and rainwater harvesting.", "category": "Water Pollution & Management", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 357, "question": "Sound is measured in:", "options": ["Pascal", "Decibel", "Joule", "Watt"], "correctAnswer": "Decibel", "explanation": "Sound intensity and sound pressure levels are measured on a logarithmic scale in units of decibels (dB).", "category": "Noise, Thermal & Soil", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 358, "question": "A typical conversation is approximately:", "options": ["5 dB", "30 dB", "50 dB", "120 dB"], "correctAnswer": "50 dB", "explanation": "Standard normal human speech creates an ambient sound intensity of roughly 50 to 60 dB.", "category": "Noise, Thermal & Soil", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 359, "question": "Prolonged exposure above approximately ____ can damage hearing.", "options": ["25 dB", "50 dB", "65 dB", "85 dB"], "correctAnswer": "85 dB", "explanation": "Occupational safety standards (like OSHA/NIOSH) warn that continuous occupational noise exceeding 85 dB induces permanent hearing impairment.", "category": "Noise, Thermal & Soil", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 360, "question": "Noise pollution is particularly dangerous to marine animals because:", "options": ["They depend on sound for communication and finding food", "They cannot swim", "They cannot reproduce", "They require sunlight"], "correctAnswer": "They depend on sound for communication and finding food", "explanation": "Cetaceans and marine species rely on echolocation and acoustic channels for navigation, foraging, and social communication.", "category": "Noise, Thermal & Soil", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 361, "question": "India's Noise Pollution Regulation & Control Rules were introduced in:", "options": ["1981", "1992", "2000", "2010"], "correctAnswer": "2000", "explanation": "India framed the Noise Pollution (Regulation and Control) Rules in 2000 under the Environment (Protection) Act, 1986.", "category": "Noise, Thermal & Soil", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 362, "question": "Thermal pollution is primarily caused by:", "options": ["Discharge of abnormally hot/cold water", "Noise", "Solid waste alone", "Radiation only"], "correctAnswer": "Discharge of abnormally hot/cold water", "exp const notesData = {"fatNotes": [{"id": "part-a", "part": "PART A", "title": "Numbers to Memorise (FAT Cheat Sheet)", "badge": "Cheat Sheet", "intro": "One-page number cheat sheet covering key statistics, temperatures, capacities, targets, and Indian government schemes. Note: quote the topic-specific value in case of minor variations across modules.", "type": "table", "tableHeaders": ["Topic / Concept", "Key Fact / Numerical Value"], "tableRows": [["Earth temp without greenhouse effect", "-18 °C (with natural greenhouse: ~15 °C)"], ["Warming so far", "~1.1 °C above pre-industrial baseline (before 1850)"], ["CO2 atmospheric concentration", "280 ppm (pre-industrial) -> over 420 ppm currently (highest in 800,000 to 3M years)"], ["Methane warming potency", "~80–84x CO2 over 20-year horizon; GWP100 = 28–34"], ["Nitrous oxide (N2O) potency", "~265x CO2 over 100-year horizon (GWP100 = 265–298)"], ["Sea level rise", "~20 cm rise since 1900; projected 0.3 to 1.0 m by 2100 (IPCC)"], ["Arctic summer sea ice loss", "Declining ~13% per decade since satellite records began in 1979"], ["Ocean absorption", "~90% of excess heat trapped; ~25–30% of anthropogenic CO2"], ["Ocean pH drop", "Dropped ~0.1 units since industrial era = ~26% increase in acidity"], ["Coral reef degradation", "Support ~25% of marine life; bleach at +1 °C; >99% severely degraded at +2 °C"], ["Warmer air moisture capacity", "~7% more water vapor per 1 °C of warming (Clausius-Clapeyron relation)"], ["Global emission shares", "Fossil fuels ~75%; Deforestation 10–15%; Agriculture 10–12%; Cement ~8%"], ["Sectoral emission shares", "Electricity & heat ~34%; Industry ~24%; Agri & land use ~22%; Transport ~16%; Buildings 17–19% (incl. Scope 2)"], ["Cement production footprint", "~0.8 t CO2 per tonne of cement; roughly half from calcination of limestone (CaCO3 -> CaO + CO2)"], ["Per capita carbon footprint", "Global average ~4 t CO2e/yr; USA 14–16 t; India ~2 t CO2e/yr"], ["Peak solar irradiance", "~1000 W/m² at solar noon on a clear day (standard test conditions)"], ["Solar PV efficiencies", "Monocrystalline: 20–22%; Polycrystalline: 15–17%; Thin-film: 10–13%; Perovskite tandem: >30%"], ["Solar degradation & tracking", "~0.5%/year degradation (80–85% after 25 yrs); single/dual-axis trackers add 15–35% yield"], ["Capacity factors by tech", "Wind: 35–50% onshore, 50–60% offshore; Geothermal: 80–95% (baseload); Solar: 20–25%"], ["India renewable & climate targets", "500 GW non-fossil capacity by 2030; 50% electric power from non-fossil by 2030; Net-Zero by 2070"], ["Hydropower global share & efficiency", "15–16% of global electricity; efficiency above 90%; dam lifespan 50–100+ years"], ["Geothermal global leaders", "Kenya generates 47% of its electricity from geothermal; Iceland over 20% (nearly 100% building heat)"], ["Geothermal plant operating temps", "Flash steam: >180 °C; Binary cycle: 100–180 °C (uses isobutane/pentane)"], ["Prominent Indian hydro plants", "Tehri Dam (1000 MW, Uttarakhand - Storage); Srinagar (330 MW - Run-of-river); Kadamparai (400 MW, TN - Pumped storage)"], ["Sardar Sarovar displacement", "Displaced ~320,000 people (major social/ecological controversy)"], ["Cost reductions in renewables", "Solar PV and wind capital costs down over 80% in a decade; solar LCOE down >90% since 2010"], ["WHO climate mortality estimate", "~250,000 additional deaths per year (2030–2050) from malnutrition, malaria, diarrhoea & heat stress"], ["Recycled aluminium savings", "~95% less energy required compared to smelting primary bauxite ore"], ["Global food waste", "~1/3 of all food produced for human consumption is lost or wasted globally"]]}, {"id": "part-b", "part": "PART B", "title": "Climate Change Science & Global Warming (W5S1, W5S2)", "badge": "Core Theory", "intro": "Physics of the greenhouse effect, atmospheric drivers, 4 pillars of empirical evidence, causes vs natural factors, consequences, and mitigation vs adaptation.", "type": "sections", "sections": [{"heading": "1. Greenhouse Effect Fundamentals", "content": "• Natural greenhouse effect = beneficial heat trapping keeping Earth's mean temperature at ~15 °C (without it: -18 °C).<br>• Enhanced greenhouse effect = excessive anthropogenic radiative forcing caused by elevated GHG concentrations from fossil fuel burning, deforestation, and industrial processes.<br>• Radiation physics: Sun emits short-wave radiation (visible, UV) which penetrates the atmosphere and heats Earth's surface. The warmed surface re-emits thermal radiation as long-wave infrared. Greenhouse gases absorb this infrared radiation and re-radiate it in all directions, trapping heat in the lower troposphere."}, {"heading": "2. Key Greenhouse Gases Table", "tableHeaders": ["Greenhouse Gas", "Main Anthropogenic Sources", "Atmospheric Lifespan & Potency"], "tableRows": [["Carbon Dioxide (CO2)", "Fossil fuel combustion (coal, oil, gas), cement production, deforestation", "Stays centuries to millennia; baseline reference (GWP = 1)"], ["Methane (CH4)", "Enteric fermentation (cattle), rice paddies, landfills, fossil fuel leaks", "Short-lived (~12 yrs) but 80–84x more potent than CO2 over 20 yrs (GWP100 = 28–34)"], ["Nitrous Oxide (N2O)", "Synthetic nitrogen fertilisers, manure management, nylon/chemical industry", "~114 yrs lifespan; ~265x more potent than CO2 (GWP100 = 265–298)"], ["Water Vapour (H2O)", "Natural hydrological evaporation (amplified by warming air)", "Most abundant GHG by volume; acts as a powerful positive feedback amplifier"], ["Fluorinated Gases (HFCs, PFCs, SF6)", "Refrigeration, AC, semiconductor manufacturing, electrical switchgear", "Synthetic gases; GWPs thousands to tens of thousands; persist centuries"]]}, {"heading": "3. Four Independent Pillars of Evidence", "content": "1. Rising Surface Temperatures: Global mean temp up ~1.1 °C; 19 of the 20 hottest years on record have occurred since 2000 (NASA, NOAA, UK Met Office, JMA).<br>2. Rising Atmospheric CO2: Surged from 280 ppm pre-industrial to >420 ppm; confirmed by Antarctic ice core bubbles dating back 800,000 years.<br>3. Melting Cryosphere & Sea Level Rise: Arctic summer sea ice extent shrinking ~13%/decade; Antarctic and Greenland ice sheets losing mass; global mean sea level up ~20 cm since 1900.<br>4. Ocean Warming & Acidification: Oceans have absorbed >90% of excess heat and 25–30% of anthropogenic CO2; dissolving CO2 forms carbonic acid (H2CO3), dropping pH by 0.1 units (~26% acidity surge)."}, {"heading": "4. Why Natural Factors Do NOT Explain Warming", "content": "• Volcanic Eruptions: Eject sulfate aerosols into the stratosphere that reflect sunlight, causing short-term cooling (1–3 years), not warming.<br>• Solar Output: Satellite observations confirm solar irradiance has slightly decreased since the 1980s while Earth's surface warmed rapidly.<br>• Milankovitch Orbital Cycles: Operate on timescales of 20,000 to 100,000 years — incapable of driving century-scale rapid warming."}, {"heading": "5. Mitigation vs Adaptation", "tableHeaders": ["Parameter", "Mitigation (Root Cause)", "Adaptation (Managing Symptoms)"], "tableRows": [["Objective", "Reduce or prevent greenhouse gas emissions; enhance carbon sinks", "Adjust ecological, social, or economic systems to cope with unavoidable impacts"], ["Examples", "Renewable energy (solar, wind), energy efficiency, reforestation, Carbon Capture & Storage (CCS), electric vehicles", "Sea walls, flood barriers, drought-resistant crop varieties, early warning systems, rainwater harvesting, elevated roadways"], ["Timing & Scale", "Global benefit with long-term atmospheric delay", "Local/regional benefit with immediate protective effect"]]}, {"heading": "6. Policy Frameworks & Indian Commitments", "content": "• Paris Agreement (2015): Legally binding treaty aiming to hold global warming well below 2 °C and pursue efforts to cap warming at 1.5 °C above pre-industrial baselines.<br>• Nationally Determined Contributions (NDCs): National climate pledges updated every 5 years.<br>• India's NDC & Glasgow COP26 Commitments: Net-Zero by 2070; 500 GW non-fossil capacity by 2030; 50% cumulative electric power from non-fossil sources by 2030; carbon intensity reduction of 45% by 2030.<br>• National Action Plan on Climate Change (NAPCC, 2008): 8 National Missions — Solar Mission, Enhanced Energy Efficiency, Sustainable Habitat, Water Mission, Sustaining Himalayan Ecosystem, Green India Mission (afforestation), Sustainable Agriculture, Strategic Knowledge for Climate Change."}]}, {"id": "part-c", "part": "PART C", "title": "Carbon Footprint & Mitigation Strategies (W5S3)", "badge": "Accounting & Policy", "intro": "Standardized GHG quantification (Scopes 1, 2, 3), Life Cycle Assessment (LCA), sectoral emission breakdowns, mitigation pillars, and carbon offsets.", "type": "sections", "sections": [{"heading": "1. Scopes of Carbon Footprint (Greenhouse Gas Protocol)", "tableHeaders": ["Scope", "Classification", "Definition & Industrial Examples"], "tableRows": [["Scope 1", "Direct Emissions", "GHG emissions directly from owned or company-controlled sources (boilers, furnaces, company-owned vehicles, chemical reaction vessels)."], ["Scope 2", "Indirect Energy Emissions", "Emissions from the generation of purchased electricity, steam, heating, or cooling consumed by the organization."], ["Scope 3", "Indirect Value-Chain Emissions", "All other indirect emissions throughout the upstream and downstream supply chain (raw materials extraction, transport, customer product use, end-of-life disposal). Frequently accounts for >70% of a company's total footprint."]]}, {"heading": "2. Carbon Accounting Standards & LCA", "content": "• Life Cycle Assessment (LCA): Primary engineering tool assessing cumulative environmental impacts from 'cradle' (raw material extraction) to 'grave' (disposal). 'Cradle to cradle' closes the loop through repair, remanufacture, and recycling.<br>• Standards to Memorise:<br>  - GHG Protocol: Most widely used global corporate accounting standard.<br>  - ISO 14064: International standard for organizational GHG inventories and verification.<br>  - PAS 2050: Standard specifically measuring life cycle GHG emissions of goods and services."}, {"heading": "3. Global Sectoral Breakdown", "tableHeaders": ["Sector", "Share of Global Emissions", "Key Decarbonization Levers"], "tableRows": [["Electricity & Heat Generation", "~34% of global CO2", "Phase out coal (emits ~2x CO2/MWh vs natural gas); rapid buildout of solar PV, wind, hydro, and nuclear baseload."], ["Industry & Manufacturing", "~24% of global GHGs", "Iron & steel (green hydrogen direct reduction), cement (clinker substitution, CCS), circular aluminium."], ["Agriculture & Land Use", "~22% of global GHGs", "Methane capture from manure, precision nitrogen fertilisation, agroforestry, alternate wetting/drying in rice."], ["Transport", "~16% of global GHGs", "Fleet electrification (EVs), modal shift from road/air to electrified rail, Sustainable Aviation Fuel (SAF)."], ["Buildings", "6% direct (~17–19% with Scope 2)", "Heat pumps, building envelope insulation, LED retrofits, passive solar design."]]}, {"heading": "4. Key Mitigation Technologies", "content": "• Energy Efficiency: Designated by the IEA as the 'first fuel' — cleanest and cheapest decarbonization mechanism.<br>• Carbon Capture & Storage (CCS): Capturing industrial flue gas CO2 and sequestering it securely deep underground in saline aquifers or depleted oil fields.<br>• Carbon Capture & Utilisation (CCU): Transforming captured CO2 into commercial building aggregates, synthetic fuels, or chemicals.<br>• Direct Air Capture (DAC): Scrubbing dilute CO2 directly from ambient air using chemical contactors.<br>• Carbon Offsets: High-integrity credits must satisfy 4 criteria: Additional (would not happen without finance), Measurable, Permanent (non-reversal), and Independently Verified."}]}, {"id": "part-d", "part": "PART D", "title": "Solar & Wind Energy (W6S1 Part 1)", "badge": "Renewable Tech", "intro": "Engineering principles of photovoltaic cells, Concentrated Solar Power (CSP), wind turbine mechanics, HAWT vs VAWT, Betz limit, and Indian renewable policies.", "type": "sections", "sections": [{"heading": "1. Solar Photovoltaic (PV) Technology", "content": "• Photovoltaic Effect: Incident photons knock valence electrons loose in a semiconductor (crystalline silicon); an internal electric field at the p-n junction sweeps free electrons, generating direct current (DC).<br>• Core Components: Solar PV array, Inverter (converts DC into grid-synchronized AC), Charge controller, Battery storage (optional), Mounting racks/trackers.<br>• Solar Output Equation: Power (W) = Irradiance (W/m²) × Panel Area (m²) × Module Efficiency (η).<br>• Temperature Coefficient: Solar PV efficiency decreases as temperature rises (negative coefficient, typically -0.35% to -0.45% per °C above 25 °C)."}, {"heading": "2. PV Cell Types Comparison", "tableHeaders": ["Cell Technology", "Efficiency Range", "Key Engineering Features"], "tableRows": [["Monocrystalline Silicon", "20–22%", "Single continuous crystal (Czochralski process); highest commercial efficiency; uniform dark black appearance; higher cost."], ["Polycrystalline Silicon", "15–17%", "Multiple silicon fragments melted together; blue speckled look; lower manufacturing cost; grain boundaries slightly reduce efficiency."], ["Thin-Film (CdTe, a-Si)", "10–13%", "Semiconductor deposited in microscopic layers on glass/metal; flexible, lightweight, excellent low-light response; requires larger land area."], ["Perovskite Tandem (Emerging)", ">30% (lab)", "Tandem layer on silicon tuning solar absorption bands; low production cost; currently hindered by moisture/UV degradation."]]}, {"heading": "3. Concentrated Solar Power (CSP) & Key Indian Schemes", "content": "• Concentrated Solar Power (CSP): Utilizes tracking heliostat mirrors to focus sunlight onto a central receiver tower, heating molten salt to >550 °C to generate superheated steam for conventional turbines with dispatchable thermal energy storage.<br>• Key Indian Solar Schemes:<br>  - PM Surya Ghar Muft Bijli Yojana: Rooftop solar for 1 crore households with subsidies up to ₹78,000.<br>  - PM-KUSUM: Solarization of agricultural pump sets (up to 60% subsidy to replace diesel pumps).<br>  - Bhadla Solar Park (Rajasthan): World's largest operational solar park (~2,245 MW).<br>  - International Solar Alliance (ISA): Co-founded by India and France; headquarters in Gurugram, India."}, {"heading": "4. Wind Turbine Mechanics & Betz Limit", "content": "• Wind Power Physics: Kinetic energy of moving air converted to electricity. Power Equation: P = 0.5 × ρ × A × v³ (Power is proportional to the cube of wind speed — doubling wind speed yields 8x power).<br>• Betz Limit: Theoretical aerodynamic ceiling proving no wind turbine can extract more than 59.3% (16/27) of kinetic energy from wind.<br>• Turbine Speeds: Cut-in speed (3–4 m/s, blades begin rotating); Rated wind speed (12–15 m/s, maximum generator output); Cut-out speed (~25 m/s, pitch brakes activate to prevent mechanical failure).<br>• HAWT vs VAWT: Horizontal Axis Wind Turbines (HAWT) dominate commercial power due to superior aerodynamic efficiency; Vertical Axis Wind Turbines (VAWT) accept wind from any direction, ideal for turbulent urban settings.<br>• Indian Geography: Western coast (Gujarat, Maharashtra) is preferred due to consistent winds; Eastern coast is cyclone-prone. National Institute of Wind Energy (NIWE) is headquartered in Chennai. Muppandal Wind Farm (Tamil Nadu) is one of the world's largest."}]}, {"id": "part-e", "part": "PART E", "title": "Hydroelectric & Geothermal Energy (W6S1 Part 2)", "badge": "Baseload Renewables", "intro": "Hydraulic head and penstocks, pumped storage, dam impacts, geothermal enthalpy classification, flash vs binary plants, and tectonic sites.", "type": "sections", "sections": [{"heading": "1. Hydroelectric Power Generation", "content": "• Energy Conversion Chain: Potential Energy (water head in reservoir) -> Kinetic Energy (rushing through penstock) -> Mechanical Energy (turbine rotation) -> Electrical Energy (generator).<br>• Power Equation: P = ρ × g × Q × H × η (where ρ = water density, g = 9.81 m/s², Q = volumetric discharge in m³/s, H = effective hydraulic head in metres, η = turbine-generator efficiency >90%).<br>• Hydropower Classifications:<br>  - Storage / Impoundment: Large dam reservoir storing seasonal discharge (e.g., Tehri Dam, 1000 MW, Uttarakhand - highest in India).<br>  - Run-of-the-River: Diverts natural river flow through tunnels/canals with minimal reservoir flooding (e.g., Srinagar Hydro, 330 MW, Alaknanda).<br>  - Pumped Storage Hydro (PSH): Acts as a giant rechargeable grid battery; pumps water uphill during off-peak hours and discharges downhill during peak demand (e.g., Kadamparai, 400 MW, Tamil Nadu).<br>• Environmental Trade-offs: Zero direct operating stack emissions, but decaying submerged biomass in tropical reservoirs emits biogenic methane (CH4); blocks fish migration; causes reservoir-induced seismicity and downstream silt deprivation."}, {"heading": "2. Geothermal Energy & Plant Architectures", "content": "• Geothermal Gradient: Normal continental temperature rise of 25–30 °C per kilometre of depth into Earth's crust.<br>• Geothermal Plant Thermodynamic Cycles:<br>  - Dry Steam Plants: Directly exploits rare natural dry underground steam (>200 °C) to drive turbines (e.g., The Geysers, California).<br>  - Flash Steam Plants: High-pressure deep water (>180 °C) is sprayed into lower-pressure flash tanks, instantaneously boiling ('flashing') into steam. Most prevalent global technology.<br>  - Binary Cycle Plants: Utilizes moderate geothermal fluid temperatures (100–180 °C) to heat a secondary organic working fluid with a lower boiling point (isobutane or pentane) in a closed heat exchanger. Geothermal water is 100% re-injected without atmospheric release.<br>• Indian Geothermal Prospects: Puga Valley (Ladakh - highest enthalpy in India), Tattapani (Chhattisgarh), Manikaran (Himachal Pradesh), Cambay Basin (Gujarat)."}]}, {"id": "part-f", "part": "PART F", "title": "AI & IoT in Environmental Monitoring", "badge": "Emerging Tech", "intro": "Sensors (NPK, optical dust, gas arrays), telemetry protocols, edge AI, LSTM pollution forecasting, digital twins, and case studies.", "type": "sections", "sections": [{"heading": "1. IoT Sensor Matrix for Environmental Telemetry", "tableHeaders": ["Domain / Medium", "Sensors & Detectors", "Monitored Environmental Parameters"], "tableRows": [["Air Quality", "Optical light scattering, MQ-135, electrochemical sensors", "PM2.5, PM10, CO, SO2, NOx, ground-level O3, volatile organic compounds (VOCs)"], ["Water Quality", "Ion-selective electrodes, optical dissolved oxygen probes, turbidity meters", "pH, Dissolved Oxygen (DO), Electrical Conductivity (EC), Biochemical Oxygen Demand (BOD), turbidity"], ["Soil & Precision Agri", "Capacitive probes, optical NPK spectrophotometers", "Volumetric soil moisture, soil temperature, Nitrogen (N), Phosphorus (P), Potassium (K) levels"], ["Biodiversity & Wildlife", "Bioacoustic microphones, PIR motion camera traps", "Ultrasonic bat calls, illegal chain-saw logging sounds, wildlife poaching identification"], ["Urban Waste", "Ultrasonic level sensors inside smart dumpsters", "Trash bin fill percentage, automated route optimization for municipal compactor trucks"]]}, {"heading": "2. Artificial Intelligence in Environmental Protection", "content": "• Long Short-Term Memory (LSTM) Networks: Recurrent neural networks ideal for processing temporal atmospheric time-series data to forecast air quality (AQI) 24–72 hours in advance.<br>• Digital Twins: Real-time physics-grounded 3D computational replicas of water treatment plants, urban airsheds, or river basins continuously updated by IoT telemetry to simulate failure scenarios.<br>• Computer Vision: Convolutional Neural Networks (CNNs) analyzing multi-spectral drone and satellite imagery to calculate NDVI (vegetation index) and map illegal deforestation.<br>• Landmark Indian AI Case Study: IIT Kharagpur researchers developed an AI geospatial machine learning framework predicting high-risk arsenic contamination in groundwater across the Ganga delta."}]}, {"id": "part-g", "part": "PART G", "title": "Last-Minute Exam Tips & VIT Marking Guide", "badge": "Exam Strategy", "intro": "High-frequency 2-mark definitions, 5/10-mark structures, and examiners' preferred keywords.", "type": "bullets", "bullets": ["Frequent 2-Mark Definitions to Memorise verbatim: Carbon footprint (CO2e), Global Warming Potential (GWP100), Scope 1 vs Scope 2 vs Scope 3, Betz limit (59.3%), Photovoltaic effect (p-n junction), Flash vs Binary geothermal cycles, Run-of-river vs Pumped storage hydro, Digital Twin.", "Frequent 5/10-Mark Question Frameworks: When asked for working principles of Solar PV / Wind / Hydro / Geothermal, ALWAYS draw the labelled block diagram showing the energy conversion chain.", "Always include Indian context: Mention 500 GW by 2030, Net-Zero 2070, PM Surya Ghar, Bhadla Solar Park (Rajasthan), Muppandal (Tamil Nadu), Tehri Dam (Uttarakhand), Puga Valley (Ladakh).", "Marking Scheme Tip: VIT examiners heavily reward technical terms (Clausius-Clapeyron, calcination, Betz limit, isobutane, enthalpy, LSTM, ISO 14064, CPCB under Water Act 1974)."]}], "masterdooomTopics": [{"group": "FOUNDATIONS", "title": "Earth as a Life Support System", "sub": "Four Earth spheres + atmosphere layers + water/geosphere/biosphere basics", "priority": "high", "must": ["Earth’s four major spheres: lithosphere (rock/minerals), hydrosphere (water), biosphere (life), atmosphere (air/weather).", "Atmosphere is the gaseous envelope; mainly 78% N₂ and 21% O₂.", "Atmospheric layers from ground upward: Troposphere → Stratosphere → Mesosphere → Thermosphere → Exosphere.", "Troposphere: weather + most atmospheric mass; temperature generally decreases with altitude.", "Stratosphere: ozone layer; absorbs harmful UV; temperature rises with altitude.", "Mesosphere: coldest layer; meteors burn up here.", "Thermosphere: temperature rises; absorbs energetic UV/X-rays; auroras occur here.", "Exosphere: outermost layer, gradually merging/leaking into space.", "Earth functions as an interconnected system: changes in one sphere can affect the others, such as rainfall influencing soil, rivers and living organisms.", "The atmosphere regulates temperature, supports weather and climate, and provides gases needed for life.", "The hydrosphere includes oceans, rivers, lakes, groundwater, glaciers and atmospheric water; most of Earth’s water is saline.", "The lithosphere provides soil, minerals and the physical base for terrestrial ecosystems.", "The biosphere interacts with the other spheres through processes such as photosynthesis, decomposition and nutrient cycling."]}, {"group": "FOUNDATIONS", "title": "Ecosystem — Core Concepts", "sub": "Ecology, levels of organization, natural vs artificial ecosystems", "priority": "high", "must": ["Ecology = study of organisms in their natural home interacting with surroundings.", "Ecosystem = biotic communities interacting with the non-living environment, exchanging energy and matter.", "Ecological organization: Organism → Population → Community → Ecosystem → Biosphere.", "Population = same species in an area. Community = multiple populations in an area.", "Biosphere = sum/global ecological system of all ecosystems on Earth.", "Natural ecosystems evolve without human intervention; artificial ecosystems require management.", "An ecosystem has two broad components: biotic organisms and the abiotic environment they interact with.", "Ecosystems can be small, such as a pond, or large, such as a forest or ocean.", "Energy enters an ecosystem and moves through feeding relationships, while materials are continuously recycled.", "Habitat is the place where an organism lives; its ecological role or function is its niche.", "Examples of artificial ecosystems include crop fields, aquariums and managed gardens."]}, {"group": "FOUNDATIONS", "title": "Ecosystem Structure & Functions", "sub": "Biotic/abiotic components, ecosystem types, trophic levels, nutrient cycling", "priority": "high", "must": ["Biotic = living components: producers, consumers, decomposers. Abiotic = physical/chemical factors: light, temperature, water, soil, air, minerals, pH, salinity.", "Producers form the base by converting solar energy to chemical energy.", "Consumers include herbivores, carnivores, omnivores and parasites.", "Decomposers such as bacteria/fungi break down dead organisms and recycle nutrients.", "Trophic levels: producers → primary consumers → secondary consumers → tertiary consumers.", "About 10% of energy passes to the next trophic level; ~90% is lost mainly as heat.", "Food chain is linear; food web is interconnected and more realistic.", "Major nutrient cycles in the notes include water, carbon, nitrogen and phosphorus cycles.", "Producers are autotrophs that manufacture organic food; consumers obtain energy by feeding on other organisms.", "Decomposers return simpler nutrients to the environment, making them available again to producers.", "Abiotic factors influence productivity and distribution of organisms; examples include light, temperature, water and soil conditions.", "Food chains show one pathway of energy transfer, while food webs connect many feeding pathways.", "Ecological pyramids can represent numbers, biomass or energy; the energy pyramid is always upright."]}, {"group": "FOUNDATIONS", "title": "Energy Flow in an Ecosystem", "sub": "Photosynthesis, GPP/NPP, food chains, pyramids and thermodynamics", "priority": "high", "must": ["All ecosystem energy enters mainly through producers via photosynthesis; deep-sea chemoautotrophs use chemical energy.", "Photosynthesis: 6CO₂ + 6H₂O + light → C₆H₁₂O₆ + 6O₂.", "GPP = total energy fixed by photosynthesis. Respiration = energy used by producer. NPP = GPP − respiration.", "NPP is the energy available to the rest of the food chain.", "Grazing food chain starts with living green plants; detritus food chain starts with dead organic matter.", "Food webs provide alternate feeding pathways and can increase ecosystem stability.", "Energy pyramid is ALWAYS upright because energy decreases at successive trophic levels.", "First law: energy is conserved during transformations. Second law: transformations release heat, explaining one-way energy flow.", "Only a fraction of incoming solar radiation is captured by producers, and only part of that captured energy becomes biomass available to consumers.", "Gross Primary Productivity measures total photosynthetic production, while Net Primary Productivity represents production remaining after plant respiration.", "As energy moves between trophic levels, much is used for metabolism and released as heat, so higher trophic levels receive less usable energy.", "Detritivores and decomposers process dead organic matter and connect the detritus pathway with nutrient cycling.", "Food webs are generally more stable than a single food chain because organisms may have alternative food sources."]}, {"group": "FOUNDATIONS", "title": "Ecological Succession", "sub": "Primary/secondary succession, stages, pioneer and climax communities", "priority": "high", "must": ["Ecological succession = gradual change in species composition and community processes over time.", "Primary succession begins on barren/lifeless substrate; soil formation starts with pioneer species such as lichens and mosses.", "Secondary succession occurs where a previous ecosystem was disturbed but soil/life remnants remain.", "Secondary succession is much faster because soil and nutrients remain; the notes state roughly 5–10× faster.", "Sequence: Nudation → Invasion → Competition → Climax/stabilization.", "Pioneers arrive first and modify the environment; climax community i // ── Fisher-Yates Array Shuffle ─────────────────────────────────
function shuffleArray(origArray) {
  const arr = [...origArray];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Shuffles both question sequence and each question's 4 options
function prepareQuizQuestions(rawQuestionList) {
  const shuffledList = shuffleArray(rawQuestionList);
  return shuffledList.map(q => ({
    ...q,
    options: shuffleArray(q.options)
  }));
}

// Samples random count and shuffles options
function getRandomSample(array, count) {
  const sampled = shuffleArray(array).slice(0, Math.min(count, array.length));
  return sampled.map(q => ({
    ...q,
    options: shuffleArray(q.options)
  }));
}

// ── Stopwatch Helper Functions ─────────────────────────────────
function startStopwatch() {
  stopStopwatch();
  elapsedSeconds = 0;
  timerStartTime = Date.now();
  timerInterval = setInterval(() => {
    elapsedSeconds = Math.floor((Date.now() - timerStartTime) / 1000);
    updateStopwatchUI();
  }, 1000);
}

function stopStopwatch() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
}

function formatStopwatch(sec) {
  const m = Math.floor(sec / 60).toString().padStart(2, "0");
  const s = (sec % 60).toString().padStart(2, "0");
  return `${m}:${s}`;
}

function updateStopwatchUI() {
  const el = document.getElementById("stopwatchDisplay");
  if (el) {
    el.textContent = formatStopwatch(elapsedSeconds);
  }
}
