<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EVS High-Yield Exam Prep Quiz</title>
  <style>
    /* ── Reset & Variables ────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-color: #090d16;
      --card-bg: #131b2e;
      --card-header: #1a243b;
      --border-color: #23314e;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-gradient: linear-gradient(135deg, #6366f1, #06b6d4);
      --correct-bg: #064e3b;
      --correct-border: #10b981;
      --correct-text: #a7f3d0;
      --wrong-bg: #451010;
      --wrong-border: #ef4444;
      --wrong-text: #fecaca;
    }

    body {
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem 3rem;
      background-image: 
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99, 102, 241, 0.15), transparent),
        radial-gradient(ellipse 60% 40% at 50% 120%, rgba(6, 182, 212, 0.1), transparent);
    }

    /* ── Quiz Card Container ──────────────────────────────── */
    .app-card {
      width: 100%;
      max-width: 760px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 1.25rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
      overflow: hidden;
      margin-top: 1rem;
    }

    /* ── Header ───────────────────────────────────────────── */
    .quiz-nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.15rem 1.75rem;
      background: var(--card-header);
      border-bottom: 1px solid var(--border-color);
      font-size: 0.92rem;
      font-weight: 600;
    }

    .mode-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent);
      padding: 0.3rem 0.75rem;
      border-radius: 2rem;
      font-size: 0.8rem;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .live-score {
      color: #34d399;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 0.3rem 0.75rem;
      border-radius: 2rem;
      font-size: 0.82rem;
      font-weight: 700;
    }

    /* ── Progress Bar ─────────────────────────────────────── */
    .progress-track {
      height: 6px;
      background: #182239;
      position: relative;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent-gradient);
      transition: width 0.35s ease;
    }

    /* ── Main Quiz Body ───────────────────────────────────── */
    .quiz-body {
      padding: 2.25rem 2rem;
    }

    .category-tag {
      display: inline-block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 0.6rem;
      font-weight: 700;
    }

    .question-title {
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1.55;
      margin-bottom: 1.75rem;
      color: #ffffff;
    }

    /* ── Options ──────────────────────────────────────────── */
    .options-grid {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      padding: 1.05rem 1.35rem;
      font-size: 1rem;
      font-family: inherit;
      color: var(--text-main);
      background: #182239;
      border: 1.5px solid #283756;
      border-radius: 0.85rem;
      cursor: pointer;
      transition: all 0.18s ease;
      display: flex;
      align-items: center;
      gap: 1rem;
      line-height: 1.4;
    }

    .option-btn:hover:not(.locked) {
      background: #202d4b;
      border-color: #4f46e5;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.15);
    }

    .option-badge {
      flex-shrink: 0;
      width: 2.1rem;
      height: 2.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 0.55rem;
      background: #253350;
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--text-muted);
      transition: all 0.18s ease;
    }

    /* Selected Correct */
    .option-btn.correct {
      background: var(--correct-bg) !important;
      border-color: var(--correct-border) !important;
      color: #ffffff !important;
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.25);
    }
    .option-btn.correct .option-badge {
      background: #10b981;
      color: #064e3b;
    }

    /* Selected Incorrect */
    .option-btn.incorrect {
      background: var(--wrong-bg) !important;
      border-color: var(--wrong-border) !important;
      color: #ffffff !important;
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.25);
    }
    .option-btn.incorrect .option-badge {
      background: #ef4444;
      color: #451010;
    }

    .option-btn.locked {
      cursor: default;
    }
    .option-btn.locked:not(.correct):not(.incorrect) {
      opacity: 0.45;
    }

    /* ── Instant Feedback Explanation Box ─────────────────── */
    .feedback-box {
      margin-top: 1.75rem;
      padding: 1.25rem 1.5rem;
      border-radius: 0.85rem;
      animation: slideUp 0.25s ease forwards;
      background: #182239;
      border: 1px solid #283756;
      border-left: 5px solid #6366f1;
    }

    .feedback-box.is-correct {
      border-left-color: #10b981;
      background: rgba(16, 185, 129, 0.08);
    }

    .feedback-box.is-wrong {
      border-left-color: #ef4444;
      background: rgba(239, 68, 68, 0.08);
    }

    .feedback-status {
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .feedback-status.correct { color: #34d399; }
    .feedback-status.wrong { color: #f87171; }

    .explanation-text {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #cbd5e1;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── Next Button & Action Bars ─────────────────────────── */
    .action-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.75rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border-color);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 1.75rem;
      font-size: 0.98rem;
      font-family: inherit;
      font-weight: 600;
      color: #ffffff;
      background: var(--accent-gradient);
      border: none;
      border-radius: 0.75rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
    }

    .btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
    }

    .btn-secondary {
      background: #202d4b;
      color: #cbd5e1;
      border: 1px solid var(--border-color);
      box-shadow: none;
    }
    .btn-secondary:hover {
      background: #2a3b61;
      color: #ffffff;
      box-shadow: none;
    }

    /* ── Mode Selection Screen ────────────────────────────── */
    .start-screen {
      padding: 2.5rem 2rem;
      text-align: center;
    }

    .start-screen h1 {
      font-size: 1.85rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .start-subtitle {
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    .mode-cards {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      margin-bottom: 2rem;
      text-align: left;
    }

    .mode-card {
      background: #182239;
      border: 2px solid #283756;
      border-radius: 1rem;
      padding: 1.25rem 1.5rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .mode-card:hover, .mode-card.active {
      border-color: #38bdf8;
      background: #1c2945;
      transform: translateY(-2px);
    }

    .mode-card.featured {
      border-color: #6366f1;
      background: linear-gradient(145deg, #182239, #1e2448);
    }

    .mode-card h3 {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .mode-card p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .mode-badge-count {
      background: #253350;
      color: var(--accent);
      padding: 0.35rem 0.75rem;
      border-radius: 2rem;
      font-size: 0.8rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .topic-select-row {
      margin: 1.5rem 0 2rem;
      text-align: left;
    }

    .topic-select-row label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .topic-dropdown {
      flex: 1;
      padding: 0.85rem 1rem;
      background: #182239;
      color: #ffffff;
      border: 1.5px solid #283756;
      border-radius: 0.65rem;
      font-size: 0.95rem;
      font-family: inherit;
      cursor: pointer;
    }

    /* ── Results Screen ───────────────────────────────────── */
    .results-screen {
      padding: 2.75rem 2rem;
      text-align: center;
    }

    .results-badge {
      font-size: 3.5rem;
      margin-bottom: 0.5rem;
    }

    .results-score-big {
      font-size: 3.8rem;
      font-weight: 900;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin: 0.75rem 0;
    }

    .results-pct {
      font-size: 1.25rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 2rem;
    }

    .review-section {
      text-align: left;
      margin: 2.5rem 0 1.5rem;
      border-top: 1px solid var(--border-color);
      padding-top: 1.75rem;
    }

    .review-section h3 {
      font-size: 1.15rem;
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .review-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      max-height: 480px;
      overflow-y: auto;
      padding-right: 0.5rem;
    }

    .review-list::-webkit-scrollbar {
      width: 6px;
    }
    .review-list::-webkit-scrollbar-thumb {
      background: #2a3b61;
      border-radius: 4px;
    }

    .review-item {
      background: #182239;
      border-radius: 0.75rem;
      padding: 1rem 1.25rem;
      border: 1px solid #283756;
      border-left: 4px solid #94a3b8;
      font-size: 0.92rem;
    }

    .review-item.is-correct {
      border-left-color: #10b981;
    }

    .review-item.is-wrong {
      border-left-color: #ef4444;
    }

    .review-q {
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #ffffff;
    }

    .review-ans {
      font-size: 0.85rem;
      margin-top: 0.25rem;
      color: #94a3b8;
    }

    .review-ans strong {
      color: #cbd5e1;
    }

    .review-explanation {
      margin-top: 0.5rem;
      padding-top: 0.5rem;
      border-top: 1px dashed #283756;
      font-size: 0.82rem;
      color: #38bdf8;
    }

    /* ── Responsive adjustments ───────────────────────────── */
    @media (max-width: 600px) {
      body { padding: 0.75rem 0.5rem 2rem; }
      .quiz-body { padding: 1.5rem 1.25rem; }
      .quiz-nav-bar { padding: 1rem 1.25rem; }
      .question-title { font-size: 1.1rem; }
      .option-btn { font-size: 0.93rem; padding: 0.9rem 1.1rem; }
      .results-score-big { font-size: 3rem; }
    }
  </style>
</head>

const rawQuestions = [{"id": 1, "isTop30": true, "category": "Biodiversity & Conservation", "question": "Biodiversity exists at which three major levels?", "options": ["Organism, population, community", "Genetic, species, ecosystem", "Cellular, tissue, organ", "Individual, population, biome"], "correctAnswer": "Genetic, species, ecosystem", "explanation": "Biodiversity is universally recognized and classified across three interconnected levels: genetic diversity, species diversity, and ecosystem diversity."}, {"id": 2, "isTop30": true, "category": "Biodiversity & Conservation", "question": "Genetic diversity refers to:", "options": ["Variety of ecosystems in a region", "Number of species in an area", "Variation in genes within a species", "Number of organisms in an ecosystem"], "correctAnswer": "Variation in genes within a species", "explanation": "Genetic diversity represents the total variety of genetic information contained in the genes of individuals of a single species."}, {"id": 3, "isTop30": true, "category": "Biodiversity & Conservation", "question": "Species richness means:", "options": ["Even distribution of individuals", "Number of species present", "Genetic variation within species", "Number of ecosystems present"], "correctAnswer": "Number of species present", "explanation": "Species richness is the count of different species represented in an ecological community or defined region."}, {"id": 4, "isTop30": true, "category": "Biodiversity & Conservation", "question": "Which is an example of endemic species?", "options": ["A species found throughout the world", "A species found only in a particular geographical region", "An extinct species", "A species with a very large population"], "correctAnswer": "A species found only in a particular geographical region", "explanation": "Endemic species are plants or animals native and exclusively restricted to a specific geographical location."}, {"id": 5, "isTop30": true, "category": "Biodiversity & Conservation", "question": "In-situ conservation means:", "options": ["Conservation outside natural habitat", "Conservation inside natural habitat", "Conservation only in laboratories", "Conservation only through seed banks"], "correctAnswer": "Conservation inside natural habitat", "explanation": "In-situ conservation is on-site conservation: the preservation of wild species within their natural surroundings and habitats."}, {"id": 6, "isTop30": true, "category": "Biodiversity & Conservation", "question": "Which is an example of ex-situ conservation?", "options": ["National park", "Wildlife sanctuary", "Botanical garden", "Biosphere reserve"], "correctAnswer": "Botanical garden", "explanation": "Botanical gardens, zoos, and seed banks preserve species off-site outside their natural habitats (ex-situ), whereas parks and sanctuaries are in-situ."}, {"id": 7, "isTop30": true, "category": "Biodiversity & Conservation", "question": "Project Tiger was launched in:", "options": ["1972", "1973", "1980", "1992"], "correctAnswer": "1973", "explanation": "Project Tiger was launched by the Government of India in April 1973 from Jim Corbett National Park to protect the Bengal tiger."}, {"id": 8, "isTop30": true, "category": "Biodiversity & Conservation", "question": "India's first national park mentioned in the notes is:", "options": ["Kaziranga National Park", "Bandipur National Park", "Jim Corbett National Park", "Gir National Park"], "correctAnswer": "Jim Corbett National Park", "explanation": "Jim Corbett National Park in Uttarakhand was established in 1936 (originally as Hailey National Park), making it India's first national park."}, {"id": 9, "isTop30": true, "category": "Circular Economy & Waste", "question": "Which is the correct order of the 3Rs?", "options": ["Recycle -> Reuse -> Reduce", "Reuse -> Reduce -> Recycle", "Reduce -> Reuse -> Recycle", "Reduce -> Recycle -> Reuse"], "correctAnswer": "Reduce -> Reuse -> Recycle", "explanation": "The waste hierarchy prioritizes prevention (Reduce), followed by direct re-utilization (Reuse), and lastly material reprocessing (Recycle)."}, {"id": 10, "isTop30": true, "category": "Circular Economy & Waste", "question": "The linear economy is commonly described as:", "options": ["Reduce, reuse, recycle", "Take, make, dispose", "Produce, conserve, restore", "Extract, recycle, regenerate"], "correctAnswer": "Take, make, dispose", "explanation": "The traditional linear economic model follows a 'take-make-dispose' step, in contrast to the circular economy's regenerative closed loop."}, {"id": 11, "isTop30": true, "category": "EIA & Environmental Tools", "question": "The most widely used matrix method in EIA mentioned in the notes is:", "options": ["Delphi Matrix", "Leopold Matrix", "SWOT Matrix", "Risk Matrix"], "correctAnswer": "Leopold Matrix", "explanation": "The Leopold Matrix is a pioneering and widely adopted qualitative Environmental Impact Assessment (EIA) method."}, {"id": 12, "isTop30": true, "category": "EIA & Environmental Tools", "question": "The Leopold Matrix was developed in:", "options": ["1965", "1971", "1981", "1992"], "correctAnswer": "1971", "explanation": "Luna Leopold and colleagues developed the Leopold Matrix in 1971 for the US Geological Survey to evaluate environmental impacts."}, {"id": 13, "isTop30": true, "category": "EIA & Environmental Tools", "question": "Which is the first major stage of EIA?", "options": ["Monitoring", "Screening", "Public consultation", "Mitigation"], "correctAnswer": "Screening", "explanation": "Screening is the initial stage of EIA to decide whether a proposed project requires an environmental assessment and at what level of detail."}, {"id": 14, "isTop30": true, "category": "EIA & Environmental Tools", "question": "Which EIA methodology maps cause-and-effect chains?", "options": ["Checklist", "Matrix", "Network analysis", "Questionnaire"], "correctAnswer": "Network analysis", "explanation": "Network analysis diagrams trace primary, secondary, and tertiary cause-and-effect pathways connecting activities to environmental consequences."}, {"id": 15, "isTop30": true, "category": "Kyoto, Paris & SDGs", "question": "The Kyoto Protocol was adopted in:", "options": ["1992", "1995", "1997", "2005"], "correctAnswer": "1997", "explanation": "The Kyoto Protocol was adopted on 11 December 1997 in Kyoto, Japan, under the UNFCCC."}, {"id": 16, "isTop30": true, "category": "Kyoto, Paris & SDGs", "question": "Kyoto's first commitment period was:", "options": ["1997-2002", "2005-2010", "2008-2012", "2015-2020"], "correctAnswer": "2008-2012", "explanation": "The Kyoto Protocol's first commitment period ran from 2008 to 2012, setting binding emission reduction targets for Annex I countries."}, {"id": 17, "isTop30": true, "category": "Kyoto, Paris & SDGs", "question": "Under the Kyoto Protocol, Annex I countries were required to reduce emissions by at least:", "options": ["2% below 1990 levels", "5% below 1990 levels", "10% below 2000 levels", "15% below 1990 levels"], "correctAnswer": "5% below 1990 levels", "explanation": "Annex I parties committed to reduce aggregate greenhouse gas emissions by an average of 5% below their 1990 baseline levels."}, {"id": 18, "isTop30": true, "category": "Kyoto, Paris & SDGs", "question": "Which country signed but never ratified the Kyoto Protocol?", "options": ["India", "China", "United States", "Japan"], "correctAnswer": "United States", "explanation": "The United States signed the Kyoto Protocol in 1998 under President Clinton, but the US Senate never ratified it and the US later withdrew."}, {"id": 19, "isTop30": true, "category": "Kyoto, Paris & SDGs", "question": "Which is NOT one of Kyoto's three flexible mechanisms?", "options": ["Emissions Trading", "Joint Implementation", "Clean Development Mechanism", "Global Stocktake"], "correctAnswer": "Global Stocktake", "explanation": "The three Kyoto mechanisms are Emissions Trading, Joint Implementation (JI), and Clean Development Mechanism (CDM). Global Stocktake belongs to the Paris Agreement."}, {"id": 20, "isTop30": true, "category": "Kyoto, Paris & SDGs", "question": "The central temperature goal of the Paris Agreement is to:", "options": ["Keep warming below 4 C", "Keep warming well below 2 C and pursue 1.5 C", "Maintain exactly 1 C warming", "Eliminate all greenhouse gases immediately"], "correctAnswer": "Keep warming well below 2 C and pursue 1.5 C", "explanation": "Article 2 of the Paris Agreement aims to hold global average temperature increase to well below 2 C above pre-industrial levels and pursue efforts to limit it to 1.5 C."}, {"id": 21, "isTop30": true, "category": "Kyoto, Paris & SDGs", "question": "Nationally Determined Contributions are associated primarily with:", "options": ["Kyoto Protocol", "Montreal Protocol", "Paris Agreement", "Ramsar Convention"], "correctAnswer": "Paris Agreement", "explanation": "Nationally Determined Contributions (NDCs) form the core bottom-up pledge mechanism of the 2015 Paris Agreement."}, {"id": 22, "isTop30": true, "category": "Kyoto, Paris & SDGs", "question": "India's Paris NDC includes a target of ____ of installed power capacity from non-fossil sources by 2030.", "options": ["30%", "40%", "50%", "75%"], "correctAnswer": "50%", "explanation": "India updated its NDC commitment to achieve 50% cumulative electric power installed capacity from non-fossil fuel-based energy resources by 2030."}, {"id": 23, "isTop30": true, "category": "Indian Environmental Laws", "question": "The Water (Prevention and Control of Pollution) Act was enacted in:", "options": ["1972", "1974", "1981", "1986"], "correctAnswer": "1974", "explanation": "India enacted the Water (Prevention and Control of Pollution) Act in 1974, providing for CPCB and SPCB regulatory frameworks."}, {"id": 24, "isTop30": true, "category": "Indian Environmental Laws", "question": "Section 24 of the Water Act deals with:", "options": ["Air pollution control areas", "Prohibition on discharge of polluting matter into streams/wells", "Environmental laboratories", "Wildlife protection"], "correctAnswer": "Prohibition on discharge of polluting matter into streams/wells", "explanation": "Section 24 of the Water Act 1974 explicitly prohibits knowingly causing or permitting any poisonous, noxious, or polluting matter into streams or wells."}, {"id": 25, "isTop30": true, "category": "Indian Environmental Laws", "question": "Under the Water Act, consent for new outlets/new discharges is primarily associated with:", "options": ["Section 19", "Section 21", "Section 25", "Section 31A"], "correctAnswer": "Section 25", "explanation": "Section 25 of the Water Act requires obtaining prior consent from the State Pollution Control Board to establish new outlets or discharges."}, {"id": 26, "isTop30": true, "category": "Indian Environmental Laws", "question": "The Environment (Protection) Act is commonly known as:", "options": ["Water Act", "Umbrella legislation", "Wildlife Act", "Forest Act"], "correctAnswer": "Umbrella legislation", "explanation": "The Environment (Protection) Act 1986 acts as 'umbrella legislation', coordinating regulatory activities across multiple environmental authorities."}, {"id": 27, "isTop30": true, "category": "Air Pollution", "question": "Noise was officially added as an air pollutant through the:", "options": ["1974 amendment", "1980 amendment", "1987 amendment", "1992 amendment"], "correctAnswer": "1987 amendment", "explanation": "The Air (Prevention and Control of Pollution) Act 1981 was amended in 1987 to expand the definition of air pollutants to include noise."}, {"id": 28, "isTop30": true, "category": "Indian Environmental Laws", "question": "The Forest (Conservation) Act was enacted in:", "options": ["1972", "1974", "1980", "1986"], "correctAnswer": "1980", "explanation": "The Forest (Conservation) Act was enacted in 1980 to strictly regulate and restrict the de-reservation and diversion of forest land for non-forest purposes."}, {"id": 29, "isTop30": true, "category": "Ecosystem & Energy Flow", "question": "Only about what percentage of energy is transferred from one trophic level to the next according to Lindemann's law?", "options": ["1%", "5%", "10%", "25%"], "correctAnswer": "10%", "explanation": "Raymond Lindeman (1942) formulated the 10% law: only about 10% of energy transferred to a trophic level is stored as biomass for the next level."}, {"id": 30, "isTop30": true, "category": "Genetically Modified Crops", "question": "Bt in Bt cotton refers to:", "options": ["Biotechnology", "Bacillus thuringiensis", "Biological toxin", "Botanical technology"], "correctAnswer": "Bacillus thuringiensis", "explanation": "Bt stands for Bacillus thuringiensis, a naturally occurring soil bacterium that produces proteins toxic to specific insect pests."}, {"id": 31, "category": "Environmental Studies & Ecosystem", "question": "Environmental science primarily studies:", "options": ["Only pollution", "Interactions between humans and natural systems", "Only biodiversity", "Only climate"], "correctAnswer": "Interactions between humans and natural systems", "explanation": "Environmental science is the systematic study of our environment and human interactions with both living and non-living systems."}, {"id": 32, "category": "Environmental Studies & Ecosystem", "question": "Environmental studies is:", "options": ["A single-discipline subject", "An interdisciplinary field", "Purely an engineering subject", "Purely a biological subject"], "correctAnswer": "An interdisciplinary field", "explanation": "Environmental studies integrates ecology, chemistry, physics, economics, law, sociology, and engineering."}, {"id": 33, "category": "Environmental Studies & Ecosystem", "question": "Which discipline can contribute to environmental studies?", "options": ["Ecology", "Geology", "Engineering", "All of the above"], "correctAnswer": "All of the above", "explanation": "Environmental studies draws insights and tools from physical sciences, life sciences, and applied engineering fields."}, {"id": 34, "category": "Environmental Studies & Ecosystem", "question": "An ecosystem is best described as:", "options": ["Only a group of animals", "Only physical surroundings", "A functional unit involving biotic and abiotic components", "A collection of plants only"], "correctAnswer": "A functional unit involving biotic and abiotic components", "explanation": "An ecosystem is a biological community of interacting organisms (biotic) and their physical environment (abiotic) functioning as a unit."}, {"id": 35, "category": "Environmental Studies & Ecosystem", "question": "Which is an abiotic component?", "options": ["Bacteria", "Plants", "Temperature", "Animals"], "correctAnswer": "Temperature", "explanation": "Abiotic factors are non-living physical and chemical elements like temperature, sunlight, water, and soil."}, {"id": 36, "category": "Environmental Studies & Ecosystem", "question": "Functional aspects of an ecosystem primarily include:", "options": ["Species colour and size", "Energy flow and nutrient cycling", "Population naming", "Taxonomy"], "correctAnswer": "Energy flow and nutrient cycling", "explanation": "The core functional processes of any ecosystem are the unidirectional flow of energy and the biogeochemical cycling of nutrients."}, {"id": 37, "category": "Environmental Studies & Ecosystem", "question": "Which is a terrestrial ecosystem?", "options": ["Ocean", "Lake", "Forest", "Sea"], "correctAnswer": "Forest", "explanation": "Terrestrial ecosystems are land-based communities, including forests, grasslands, deserts, and tundras."}, {"id": 38, "category": "Environmental Studies & Ecosystem", "question": "Which is a freshwater ecosystem?", "options": ["Ocean", "Lake", "Coral reef", "Estuary"], "correctAnswer": "Lake", "explanation": "Lakes, ponds, rivers, and streams are freshwater ecosystems with low dissolved salt concentrations (<0.5 ppt)."}, {"id": 39, "category": "Environmental Studies & Ecosystem", "question": "Marine ecosystems are characterized by:", "options": ["No salt", "High salt content", "Only freshwater species", "Absence of biodiversity"], "correctAnswer": "High salt content", "explanation": "Marine ecosystems (oceans, coral reefs) have high salt concentrations, typically averaging around 35 parts per thousand."}, {"id": 40, "category": "Ecosystem & Energy Flow", "question": "Energy flow in an ecosystem is:", "options": ["Cyclic", "Bidirectional", "Unidirectional", "Random"], "correctAnswer": "Unidirectional", "explanation": "Energy flows in one direction: from the sun to autotrophs, then to successive heterotrophic levels, dissipating as heat."}, {"id": 41, "category": "Ecosystem & Energy Flow", "question": "Matter in an ecosystem is:", "options": ["Destroyed permanently", "Continuously recycled", "Converted entirely into energy", "Never transferred"], "correctAnswer": "Continuously recycled", "explanation": "Unlike energy which flows unidirectionally, matter and essential nutrients (carbon, nitrogen, phosphorus) circulate cyclically."}, {"id": 42, "category": "Ecosystem & Energy Flow", "question": "The Detritus Food Chain begins with:", "options": ["Producers", "Herbivores", "Dead organic matter", "Carnivores"], "correctAnswer": "Dead organic matter", "explanation": "The detritus food chain starts with non-living dead organic matter (detritus), which is broken down by decomposers and detritivores."}, {"id": 43, "category": "Ecosystem & Energy Flow", "question": "Photosynthesis converts:", "options": ["Chemical energy into heat", "Light energy into chemical energy", "Heat into light", "Mechanical energy into chemical energy"], "correctAnswer": "Light energy into chemical energy", "explanation": "Plants capture solar light energy and convert it into chemical energy stored in the chemical bonds of glucose."}, {"id": 44, "category": "Ecosystem & Energy Flow", "question": "Lindemann's 10% law states that:", "options": ["10% of organisms survive", "10% of energy is transferred to the next trophic level", "10% of biomass becomes soil", "10% of sunlight reaches Earth"], "correctAnswer": "10% of energy is transferred to the next trophic level", "explanation": "Only about 10% of available energy at any given trophic level is passed onto organisms at the next trophic level."}, {"id": 45, "category": "Ecosystem & Energy Flow", "question": "The pyramid of energy is:", "options": ["Always inverted", "Always upright", "Sometimes absent", "Always horizontal"], "correctAnswer": "Always upright", "explanation": "Because energy is lost as heat at every step pursuant to the second law of thermodynamics, energy pyramids are always upright."}, {"id": 46, "category": "Ecosystem & Energy Flow", "question": "The ecological pyramid is associated with:", "options": ["Charles Elton", "Charles Darwin only", "Mendel", "Louis Pasteur"], "correctAnswer": "Charles Elton", "explanation": "British ecologist Charles Elton introduced the concept of ecological pyramids (Eltonian pyramids) in 1927."}, {"id": 47, "category": "Ecosystem & Energy Flow", "question": "Charles Elton proposed the ecological pyramid in:", "options": ["1890", "1927", "1942", "1972"], "correctAnswer": "1927", "explanation": "Charles Elton published 'Animal Ecology' in 1927, in which he conceptualized ecological pyramids of numbers, biomass, and energy."}, {"id": 48, "category": "Ecosystem & Energy Flow", "question": "Tropical rainforests have approximately:", "options": ["100 g/m2/year NPP", "500 g/m2/year", "2,000 g/m2/year", "10,000 g/m2/year"], "correctAnswer": "2,000 g/m2/year", "explanation": "Tropical rainforests are among the most productive terrestrial biomes, boasting a net primary productivity around 2,000 g/m²/year."}, {"id": 49, "category": "Ecosystem & Energy Flow", "question": "Nitrogen fixation in legumes is associated with:", "options": ["Lactobacillus", "Rhizobium", "Vibrio", "Plasmodium"], "correctAnswer": "Rhizobium", "explanation": "Rhizobium bacteria form symbiotic nodules on legume roots, converting atmospheric nitrogen (N2) into bioavailable ammonia."}, {"id": 50, "category": "Ecological Succession", "question": "Ecological succession refers to:", "options": ["Sudden extinction", "Gradual change in community composition over time", "Migration of animals only", "Pollution of an ecosystem"], "correctAnswer": "Gradual change in community composition over time", "explanation": "Ecological succession is the orderly, predictable process of gradual change in species structure of an ecological community over time."}, {"id": 51, "category": "Ecological Succession", "question": "Primary succession begins on:", "options": ["A mature forest", "Bare/lifeless land", "Agricultural land", "A developed city"], "correctAnswer": "Bare/lifeless land", "explanation": "Primary succession starts in newly formed or exposed environments lacking pre-existing soil (e.g., bare rock, cooled lava)."}, {"id": 52, "category": "Ecological Succession", "question": "Secondary succession occurs where:", "options": ["Life never existed", "The previous ecosystem has been disturbed or destroyed", "There is no soil", "There are no microorganisms"], "correctAnswer": "The previous ecosystem has been disturbed or destroyed", "explanation": "Secondary succession occurs following a disturbance (e.g., fire, flood, logging) in an area where soil and seed banks already exist."}, {"id": 53, "category": "Ecological Succession", "question": "Pioneer species are:", "options": ["Final climax species", "First colonizing species", "Largest predators", "Extinct species"], "correctAnswer": "First colonizing species", "explanation": "Pioneer species (such as lichens and mosses) are the hardy first colonizers of newly created or disturbed environments."}, {"id": 54, "category": "Ecological Succession", "question": "Which generally occurs faster?", "options": ["Primary succession", "Secondary succession", "Both always take equal time", "Neither"], "correctAnswer": "Secondary succession", "explanation": "Secondary succession is significantly faster because fertile soil, organic matter, and dormant propagules are already present."}, {"id": 55, "category": "Ecological Succession", "question": "The final stabilized stage of succession is called:", "options": ["Pioneer stage", "Seral stage", "Climax community", "Nudation"], "correctAnswer": "Climax community", "explanation": "The climax community represents the stable, self-perpetuating end-point of ecological succession in dynamic equilibrium with climate."}, {"id": 56, "category": "Ecological Succession", "question": "According to the notes, the theory of monoclimax was given by:", "options": ["F.E. Clements", "Charles Elton", "Lindemann", "Tansley"], "correctAnswer": "F.E. Clements", "explanation": "Frederic Clements proposed the Monoclimax Theory, postulating that a region's vegetation culminates in a single climatic climax community."}, {"id": 57, "category": "Ecological Succession", "question": "Nudation refers to:", "options": ["Formation of a bare area", "Formation of a climax community", "Pollination", "Nutrient recycling"], "correctAnswer": "Formation of a bare area", "explanation": "Nudation is the initial stage of succession involving the development of a bare, uninhabited substrate."}, {"id": 58, "category": "Biodiversity & Species Status", "question": "Which biodiversity component concerns variation between ecosystems?", "options": ["Genetic diversity", "Species diversity", "Ecosystem diversity", "Population density"], "correctAnswer": "Ecosystem diversity", "explanation": "Ecosystem diversity encompasses the variety of habitats, natural communities, and ecological processes across biomes."}, {"id": 59, "category": "Biodiversity & Species Status", "question": "Species evenness indicates:", "options": ["Total number of species", "How evenly individuals are distributed among species", "Genetic mutation", "Number of habitats"], "correctAnswer": "How evenly individuals are distributed among species", "explanation": "Species evenness measures the relative abundance of the different species making up the richness of an area."}, {"id": 60, "category": "Biodiversity & Species Status", "question": "High species diversity generally increases:", "options": ["Ecosystem instability", "Ecosystem stability and resilience", "Pollution", "Extinction rate"], "correctAnswer": "Ecosystem stability and resilience", "explanation": "Diverse communities tend to have more functional redundancy and buffering capacity against environmental shocks."}, {"id": 61, "category": "Biodiversity & Species Status", "question": "Which is an economic value of biodiversity?", "options": ["Pharmaceutical resources", "Ecotourism", "Agricultural genetic resources", "All of the above"], "correctAnswer": "All of the above", "explanation": "Biodiversity underpins medicine, nature-based tourism, and crop breeding programs essential for food security."}, {"id": 62, "category": "Biodiversity & Species Status", "question": "A species facing a very high risk of extinction in the near future is:", "options": ["Rare", "Endemic", "Endangered", "Common"], "correctAnswer": "Endangered", "explanation": "IUCN defines endangered species as those confronting an extremely elevated probability of extinction in the wild."}, {"id": 63, "category": "Biodiversity & Species Status", "question": "A rare species differs from an endangered species because a rare species:", "options": ["Is necessarily extinct", "Is not currently at high risk of extinction according to the notes", "Has no ecological value", "Exists everywhere"], "correctAnswer": "Is not currently at high risk of extinction according to the notes", "explanation": "Rare species have small or localized populations, but are not necessarily facing immediate extinction unlike endangered species."}, {"id": 64, "category": "Biodiversity & Species Status", "question": "The Nilgiri tahr is endemic to:", "options": ["Eastern Himalayas", "Western Ghats", "Andaman Islands", "Thar Desert"], "correctAnswer": "Western Ghats", "explanation": "The Nilgiri tahr (an endangered mountain ungulate) is endemic to the high-altitude shola grasslands of the Western Ghats."}, {"id": 65, "category": "Biodiversity & Species Status", "question": "The Ganges river dolphin is threatened particularly by:", "options": ["Desertification", "Water pollution and dam construction", "Forest fires only", "Noise from airports only"], "correctAnswer": "Water pollution and dam construction", "explanation": "Dams and barrages fragment dolphin habitats and disrupt migration, exacerbated by heavy industrial and municipal river pollution."}, {"id": 66, "category": "Species Interactions", "question": "Which is an example of commensalism?", "options": ["Predator and prey", "Barnacles and whales", "Bee and flower", "Parasite and host"], "correctAnswer": "Barnacles and whales", "explanation": "In commensalism (+/0), barnacles benefit by hitching a ride to feed in plankton-rich waters while causing no substantial harm or benefit to whales."}, {"id": 67, "category": "Species Interactions", "question": "In mutualism:", "options": ["Both species benefit", "One benefits and one is harmed", "One benefits and the other is unaffected", "Both are harmed"], "correctAnswer": "Both species benefit", "explanation": "Mutualism (+/+) is an ecological interaction in which each participating species derives a fitness benefit."}, {"id": 68, "category": "Species Interactions", "question": "Predation involves:", "options": ["Both organisms benefiting", "One organism killing and eating another", "One organism remaining unaffected", "Resource sharing"], "correctAnswer": "One organism killing and eating another", "explanation": "Predation (+/-) is a biological interaction where one organism (predator) captures, kills, and feeds on another (prey)."}, {"id": 69, "category": "Species Interactions", "question": "Competition occurs when organisms:", "options": ["Depend on the same limited resources", "Always help one another", "Never interact", "Are all parasites"], "correctAnswer": "Depend on the same limited resources", "explanation": "Competition (-/-) arises when organisms exploit the same restricted supply of vital resources like food, water, or territory."}, {"id": 70, "category": "Conservation", "question": "In-situ conservation maintains:", "options": ["Natural evolutionary processes", "Only laboratory populations", "Only seeds", "Only captive animals"], "correctAnswer": "Natural evolutionary processes", "explanation": "In-situ conservation protects organisms within their evolving ecosystems, allowing natural selection and evolutionary processes to continue uninterrupted."}, {"id": 71, "category": "Conservation", "question": "Cryopreservation commonly uses:", "options": ["Boiling water", "Liquid nitrogen", "Sunlight", "Dry heat"], "correctAnswer": "Liquid nitrogen", "explanation": "Cryopreservation preserves cells, tissues, and germplasm at ultra-low temperatures using liquid nitrogen."}, {"id": 72, "category": "Conservation", "question": "Cryopreservation may involve storage at approximately:", "options": ["0 C", "-20 C", "-196 C", "+100 C"], "correctAnswer": "-196 C", "explanation": "Liquid nitrogen cools samples down to -196 °C, suspending all biochemical activity and degradation."}, {"id": 73, "category": "Conservation", "question": "The National Bureau of Plant Genetic Resources is located in:", "options": ["Mumbai", "New Delhi", "Chennai", "Bengaluru"], "correctAnswer": "New Delhi", "explanation": "The NBPGR is headquartered in New Delhi and manages India's national gene bank for plant genetic resources."}, {"id": 74, "category": "Conservation", "question": "The Indian Botanical Garden mentioned in the notes was established in:", "options": ["1787", "1857", "1936", "1972"], "correctAnswer": "1787", "explanation": "The Indian Botanic Garden at Shibpur, Howrah (near Kolkata), was founded in 1787 by Colonel Robert Kyd."}, {"id": 75, "category": "Conservation", "question": "Biosphere reserves aim to combine:", "options": ["Conservation and sustainable development", "Mining and conservation", "Industrialization and deforestation", "Urbanization and pollution"], "correctAnswer": "Conservation and sustainable development", "explanation": "Under UNESCO's MAB program, biosphere reserves harmonize ecological conservation with socio-economic sustainable development."}, {"id": 76, "category": "Conservation", "question": "The Convention on Biological Diversity was established in:", "options": ["1972", "1980", "1992", "2002"], "correctAnswer": "1992", "explanation": "The CBD was opened for signature at the Rio Earth Summit in 1992 to protect biological diversity globally."}, {"id": 77, "category": "Conservation", "question": "Project Elephant was launched in:", "options": ["1973", "1980", "1992", "2002"], "correctAnswer": "1992", "explanation": "Project Elephant was launched by India's Ministry of Environment and Forests in 1992 to protect Asian elephants and elephant corridors."}, {"id": 78, "category": "Conservation", "question": "The Ramsar Convention is associated with:", "options": ["Forests", "Wetlands", "Noise pollution", "Nuclear energy"], "correctAnswer": "Wetlands", "explanation": "Signed in Ramsar, Iran in 1971, this intergovernmental treaty provides the framework for national action and international cooperation on wetlands."}, {"id": 79, "category": "Conservation", "question": "Which protected area generally has the strictest protection?", "options": ["National Park", "Wildlife Sanctuary", "Community Reserve", "Agricultural land"], "correctAnswer": "National Park", "explanation": "National Parks have the highest legal protection status in India where no human settlement or private biotic interference (like grazing) is allowed."}, {"id": 80, "category": "Circular Economy & Waste", "question": "The circular economy attempts to:", "options": ["Maximize disposal", "Keep materials and products in use", "Increase landfill use", "Promote single-use products"], "correctAnswer": "Keep materials and products in use", "explanation": "The circular economy designs out waste and pollution, ensuring products and materials circulate at their highest utility and value."}, {"id": 81, "category": "Circular Economy & Waste", "question": "Reduce is first in the 3R hierarchy because:", "options": ["Recycling is impossible", "It prevents waste from being generated in the first place", "Reuse is illegal", "Landfills are free"], "correctAnswer": "It prevents waste from being generated in the first place", "explanation": "Source reduction avoids resource extraction, energy expenditures, and waste handling altogether."}, {"id": 82, "category": "Circular Economy & Waste", "question": "Reuse means:", "options": ["Destroying a product", "Using something again without significant reprocessing", "Burning waste", "Converting waste into energy"], "correctAnswer": "Using something again without significant reprocessing", "explanation": "Reuse repurposes items in their existing form without consuming substantial energy to dismantle or re-melt them."}, {"id": 83, "category": "Circular Economy & Waste", "question": "Recycling means:", "options": ["Disposing of waste", "Processing material into something new", "Storing waste underground", "Producing virgin raw material"], "correctAnswer": "Processing material into something new", "explanation": "Recycling transforms waste materials into new substances or manufactured products."}, {"id": 84, "category": "Circular Economy & Waste", "question": "Extended Producer Responsibility means:", "options": ["Consumers are legally responsible for everything", "Producers bear responsibility for products at end-of-life", "Government owns every product", "Recycling is prohibited"], "correctAnswer": "Producers bear responsibility for products at end-of-life", "explanation": "EPR is an environmental policy approach assigning manufacturers financial and physical responsibility for end-of-life treatment of their goods."}, {"id": 85, "category": "Circular Economy & Waste", "question": "Industrial symbiosis involves:", "options": ["Industries independently discarding all waste", "Industries exchanging by-products/resources", "Closing industries", "Only household recycling"], "correctAnswer": "Industries exchanging by-products/resources", "explanation": "In industrial symbiosis, the waste output or byproduct of one industrial process serves directly as the input feedstock for another."}, {"id": 86, "category": "Circular Economy & Waste", "question": "Urban mining involves recovering:", "options": ["Soil from forests", "Valuable materials from discarded electronics", "Water from oceans", "Coal from mountains"], "correctAnswer": "Valuable materials from discarded electronics", "explanation": "Urban mining is the reclaim of precious and critical raw materials (gold, copper, rare earths) from electronic waste and discarded infrastructure."}, {"id": 87, "category": "Circular Economy & Waste", "question": "Controlled incineration generally occurs at approximately:", "options": ["100-200 C", "300-400 C", "800-1000 C", "2000-3000 C"], "correctAnswer": "800-1000 C", "explanation": "Modern controlled waste incinerators operate between 850°C and 1000°C to guarantee complete thermal breakdown of dioxins and hazardous volatiles."}, {"id": 88, "category": "Circular Economy & Waste", "question": "The circular economy differs from the linear economy because it emphasizes:", "options": ["Take-make-dispose", "Continuous resource use and regeneration", "Landfill dependency", "Resource depletion"], "correctAnswer": "Continuous resource use and regeneration", "explanation": "Circular systems decouple economic activity from the consumption of finite resources through continuous regeneration."}, {"id": 89, "category": "Air Pollution", "question": "The two major categories based on formation are:", "options": ["Indoor and outdoor", "Primary and secondary", "Natural and biological", "Local and global"], "correctAnswer": "Primary and secondary", "explanation": "Based on their mode of formation, air pollutants are classified into primary (emitted directly) and secondary (formed via reactions)."}, {"id": 90, "category": "Air Pollution", "question": "A primary pollutant is:", "options": ["Formed only after atmospheric reactions", "Directly emitted from a source", "Always harmless", "Always a solid"], "correctAnswer": "Directly emitted from a source", "explanation": "Primary pollutants enter the atmosphere directly from identifiable point or mobile sources (e.g., CO, SO2 from smokestacks)."}, {"id": 91, "category": "Air Pollution", "question": "Ground-level ozone is primarily a:", "options": ["Primary pollutant", "Secondary pollutant", "Heavy metal", "Particulate"], "correctAnswer": "Secondary pollutant", "explanation": "Tropospheric ozone is not emitted directly; it is synthesized through photochemical reactions between NOx and VOCs under solar radiation."}, {"id": 92, "category": "Air Pollution", "question": "Photochemical smog formation involves:", "options": ["NOx + VOCs + sunlight", "CO2 + nitrogen", "SO2 + methane only", "Oxygen + water only"], "correctAnswer": "NOx + VOCs + sunlight", "explanation": "Photochemical smog forms when nitrogen oxides and volatile organic compounds react in the presence of ultraviolet sunlight."}, {"id": 93, "category": "Air Pollution", "question": "Acid rain commonly has a pH:", "options": ["Above 8", "Exactly 7", "Below 5.6", "Above 10"], "correctAnswer": "Below 5.6", "explanation": "Normal unpolluted rain has a pH around 5.6 due to dissolved atmospheric CO2 forming mild carbonic acid; precipitation with pH < 5.6 is acid rain."}, {"id": 94, "category": "Air Pollution", "question": "The major natural source of SO2 in the notes is:", "options": ["Volcanic eruptions", "Earthquakes", "Rain", "Ocean waves"], "correctAnswer": "Volcanic eruptions", "explanation": "Volcanoes vent massive volumes of sulfur dioxide naturally into the atmosphere during eruptive and outgassing phases."}, {"id": 95, "category": "Air Pollution", "question": "Radon is:", "options": ["A radioactive gas", "A greenhouse particle", "A heavy metal", "A biological pollutant"], "correctAnswer": "A radioactive gas", "explanation": "Radon is a colorless, odorless, naturally occurring radioactive noble gas produced from the decay of uranium in soils and rocks."}, {"id": 96, "category": "Air Pollution", "question": "Radon is described as the second leading cause of lung cancer after:", "options": ["Air pollution", "Smoking", "Alcohol", "Noise"], "correctAnswer": "Smoking", "explanation": "Radon gas decay products lodge in lung tissues and emit alpha radiation, making radon the #1 cause of lung cancer in non-smokers and #2 overall after smoking."}, {"id": 97, "category": "Air Pollution", "question": "Which device is designed to remove particulate matter from industrial exhaust?", "options": ["Electrostatic precipitator", "Refrigerator", "Condenser only", "Chlorinator"], "correctAnswer": "Electrostatic precipitator", "explanation": "Electrostatic precipitators (ESPs) charge suspended dust particles and collect them on oppositely charged plates with over 99% efficiency."}, {"id": 98, "category": "Air Pollution", "question": "India adopted BS-VI emission standards in:", "options": ["2015", "2018", "2020", "2024"], "correctAnswer": "2020", "explanation": "India leapfrogged directly from Bharat Stage IV to BS-VI vehicular emission norms nationwide starting April 1, 2020."}, {"id": 99, "category": "Water Pollution & Management", "question": "The safe drinking-water pH range given in the notes is:", "options": ["2-4", "4-6", "6.5-8.5", "9-12"], "correctAnswer": "6.5-8.5", "explanation": "WHO and BIS drinking water specifications dictate an acceptable potable pH range between 6.5 and 8.5."}, {"id": 100, "category": "Water Pollution & Management", "question": "The WHO water-quality value for TDS given in the notes is:", "options": ["<50 mg/L", "<100 mg/L", "<500 mg/L", "<5000 mg/L"], "correctAnswer": "<500 mg/L", "explanation": "Total Dissolved Solids (TDS) under 500 mg/L is generally classified by WHO as good to excellent for drinking purposes."}, {"id": 101, "category": "Water Pollution & Management", "question": "A factory pipe discharging wastewater is an example of:", "options": ["Non-point source pollution", "Point source pollution", "Natural pollution", "Diffuse pollution"], "correctAnswer": "Point source pollution", "explanation": "Point-source pollution originates from an identifiable, single, and stationary localized discharge outlet such as an industrial conduit."}, {"id": 102, "category": "Water Pollution & Management", "question": "Agricultural runoff is generally:", "options": ["Point-source pollution", "Non-point-source pollution", "Thermal pollution only", "Noise pollution"], "correctAnswer": "Non-point-source pollution", "explanation": "Agricultural runoff containing pesticides and fertilizers flows diffusely over vast catchment areas, representing non-point-source pollution."}, {"id": 103, "category": "Water Pollution & Management", "question": "Excess nitrogen and phosphorus can cause:", "options": ["Desertification", "Eutrophication", "Earthquakes", "Ozone depletion"], "correctAnswer": "Eutrophication", "explanation": "Nutrient enrichment (eutrophication) of water bodies by nitrates and phosphates triggers excessive algal blooms."}, {"id": 104, "category": "Water Pollution & Management", "question": "In eutrophication, decomposition of algal biomass leads to:", "options": ["Increased dissolved oxygen", "Oxygen depletion", "Reduced nutrients", "Reduced bacterial activity"], "correctAnswer": "Oxygen depletion", "explanation": "Aerobic bacteria consume large quantities of dissolved oxygen while breaking down dead algal blooms, suffocating fish and aquatic life."}, {"id": 105, "category": "Water Pollution & Management", "questio             <p>Every single question from the exam preparation pack (Questions 1 to 177).</p>
          </div>
          <span class="mode-badge-count">177 Questions</span>
        </div>
      </div>

      <div class="topic-select-row">
        <label for="topicSelect">Or Practice by Specific Exam Section:</label>
        <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
          <select id="topicSelect" class="topic-dropdown">
            ${topics.map(t => {
              const count = rawQuestions.filter(q => q.category === t).length;
              return `<option value="${t}">${t} (${count} questions)</option>`;
            }).join("")}
          </select>
          <button class="btn btn-secondary" onclick="startTopicQuiz()">Practice Topic</button>
        </div>
      </div>

      <button class="btn" style="width:100%; justify-content:center; font-size:1.05rem;" onclick="startQuiz('top30')">
        🚀 Start Core Top 30 Exam Quiz
      </button>
    </div>
  `;
}

function startTopicQuiz() {
  const select = document.getElementById("topicSelect");
  const topic = select.value;
  currentMode = "topic";
  currentTopic = topic;
  activeQuestions = rawQuestions.filter(q => q.category === topic);
  initQuizState();
}

function startQuiz(mode) {
  currentMode = mode;
  if (mode === "top30") {
    activeQuestions = rawQuestions.filter(q => q.isTop30);
  } else {
    activeQuestions = [...rawQuestions];
  }
  initQuizState();
}

function initQuizState() {
  currentIndex = 0;
  score = 0;
  userAnswers = [];
  answered = false;
  renderQuestion();
}

// ── Screen: Question View ──────────────────────────────────────
function renderQuestion() {
  answered = false;
  const q = activeQuestions[currentIndex];
  const progressPct = ((currentIndex) / activeQuestions.length) * 100;
  
  let modeLabel = "Core Top 30";
  if (currentMode === "all") modeLabel = "All 177 Questions";
  if (currentMode === "topic") modeLabel = currentTopic;

  app.innerHTML = `
    <div class="quiz-nav-bar">
      <span class="mode-badge">🎯 ${modeLabel}</span>
      <span>Question ${currentIndex + 1} of ${activeQuestions.length}</span>
      <span class="live-score">Score: ${score} / ${currentIndex}</span>
    </div>

    <div class="progress-track">
      <div class="progress-fill" style="width:${progressPct}%"></div>
    </div>

    <div class="quiz-body">
      <span class="category-tag">${q.category}</span>
      <h2 class="question-title">${q.question}</h2>

      <ul class="options-grid" id="optionsList">
        ${q.options.map((opt, i) => `
          <li>
            <button class="option-btn" data-value="${escapeHtml(opt)}">
              <span class="option-badge">${letters[i]}</span>
              <span>${escapeHtml(opt)}</span>
            </button>
          </li>
        `).join("")}
      </ul>

      <div id="feedbackContainer"></div>

      <div class="action-row" id="actionRow" style="display:none;">
        <button class="btn btn-secondary" onclick="renderStartScreen()">Quit to Menu</button>
        <button class="btn" id="nextBtn">
          ${currentIndex === activeQuestions.length - 1 ? "Finish & View Results 🏆" : "Next Question →"}
        </button>
      </div>
    </div>
  `;

  document.querySelectorAll(".option-btn").forEach(btn => {
    btn.addEventListener("click", () => handleSelection(btn));
  });
}

function handleSelection(btn) {
  if (answered) return;
  answered = true;

  const selected = btn.dataset.value;
  const q = activeQuestions[currentIndex];
  const isCorrect = (selected === q.correctAnswer);

  if (isCorrect) {
    score++;
  }

  userAnswers.push({
    question: q.question,
    selected: selected,
    correct: q.correctAnswer,
    isCorrect: isCorrect,
    explanation: q.explanation,
    category: q.category
  });

  // Update header score pill
  app.querySelector(".live-score").textContent = `Score: ${score} / ${currentIndex + 1}`;

  // Highlight choices and lock
  document.querySelectorAll(".option-btn").forEach(b => {
    b.classList.add("locked");
    if (b.dataset.value === q.correctAnswer) {
      b.classList.add("correct");
    }
    if (b === btn && !isCorrect) {
      b.classList.add("incorrect");
    }
  });

  // Show immediate 1-2 sentence explanation
  const feedbackContainer = document.getElementById("feedbackContainer");
  feedbackContainer.innerHTML = `
    <div class="feedback-box ${isCorrect ? "is-correct" : "is-wrong"}">
      <div class="feedback-status ${isCorrect ? "correct" : "wrong"}">
        ${isCorrect ? "✅ Correct!" : "❌ Incorrect. The right answer is: " + escapeHtml(q.correctAnswer)}
      </div>
      <div class="explanation-text">${q.explanation}</div>
    </div>
  `;

  // Show the Next button
  const actionRow = document.getElementById("actionRow");
  actionRow.style.display = "flex";

  document.getElementById("nextBtn").addEventListener("click", () => {
    currentIndex++;
    if (currentIndex < activeQuestions.length) {
      renderQuestion();
    } else {
      renderResults();
    }
  });
}

// ── Screen: Results Breakdown ──────────────────────────────────
function renderResults() {
  const total = activeQuestions.length;
  const pct = Math.round((score / total) * 100);

  let emoji = "🏆";
  let verdict = "Outstanding Mastery!";
  if (pct >= 85) {
    emoji = "🌟";
    verdict = "Outstanding Mastery! Ready for the exam!";
  } else if (pct >= 70) {
    emoji = "🎯";
    verdict = "Great Job! Solid grasp of high-yield concepts.";
  } else if (pct >= 50) {
    emoji = "📖";
    verdict = "Good Effort! Review your missed concepts below.";
  } else {
    emoji = "💡";
    verdict = "Keep Practicing! Review the high-yield facts below.";
  }

  app.innerHTML = `
    <div class="quiz-nav-bar">
      <span>Exam Session Complete</span>
      <span class="live-score">${score} of ${total} Correct</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" style="width:100%"></div>
    </div>

    <div class="results-screen">
      <div class="results-badge">${emoji}</div>
      <h2 style="font-size:1.75rem; font-weight:800;">${verdict}</h2>
      <div class="results-score-big">${score} / ${total}</div>
      <div class="results-pct">${pct}% Accuracy</div>

      <div style="display:flex; justify-content:center; gap:0.75rem; flex-wrap:wrap; margin-bottom: 2rem;">
        <button class="btn" onclick="initQuizState()">🔄 Retake This Quiz</button>
        <button class="btn btn-secondary" onclick="renderStartScreen()">🏠 Change Exam Section</button>
      </div>

      <div class="review-section">
        <h3>
          <span>Detailed Answer Review</span>
          <span style="font-size:0.85rem; color:var(--text-muted); font-weight:normal;">${userAnswers.filter(a => !a.isCorrect).length} mistakes</span>
        </h3>
        
        <ul class="review-list">
          ${userAnswers.map((item, idx) => `
            <li class="review-item ${item.isCorrect ? "is-correct" : "is-wrong"}">
              <div class="review-q">
                <span style="color:${item.isCorrect ? "#34d399" : "#f87171"}">${item.isCorrect ? "✔" : "✘"}</span>
                Q${idx + 1}: ${escapeHtml(item.question)}
              </div>
              <div class="review-ans">
                <strong>Your pick:</strong> ${escapeHtml(item.selected)} 
                ${!item.isCorrect ? `&bull; <strong style="color:#34d399">Correct:</strong> ${escapeHtml(item.correct)}` : ""}
              </div>
              <div class="review-explanation">
                💡 <strong>Why:</strong> ${escapeHtml(item.explanation)}
              </div>
            </li>
          `).join("")}
        </ul>
      </div>
    </div>
  `;
}

function escapeHtml(str) {
  if (!str) return "";
  return String(str).replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
}

// ── Initialize App ─────────────────────────────────────────────
renderStartScreen();
</script>
</body>
</html>
