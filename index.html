<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EVS FAT Quiz & Revision Notes — VIT Vellore Exam Bank</title>
  <style>
    /* ── Reset & Color Scheme ─────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-color: #0b1120;
      --card-bg: #131d35;
      --card-header: #1a2644;
      --border-color: #24355a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-gradient: linear-gradient(135deg, #6366f1, #06b6d4);
      --fat-gold: #f59e0b;
      --fat-gradient: linear-gradient(135deg, #f59e0b, #ef4444);
      --site-badge: #10b981;
      --correct-bg: #064e3b;
      --correct-border: #10b981;
      --wrong-bg: #451010;
      --wrong-border: #ef4444;
      --timer-color: #f59e0b;
      --timer-bg: rgba(245, 158, 11, 0.12);
      --timer-border: rgba(245, 158, 11, 0.35);
      --notes-purple: #8b5cf6;
      --notes-gradient: linear-gradient(135deg, #8b5cf6, #3b82f6);
    }

    body {
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem 3.5rem;
      background-image: 
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99, 102, 241, 0.18), transparent),
        radial-gradient(ellipse 60% 40% at 50% 120%, rgba(6, 182, 212, 0.12), transparent);
    }

    /* ── Card Container ───────────────────────────────────── */
    .quiz-card {
      width: 100%;
      max-width: 820px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 1.25rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.05);
      overflow: hidden;
      margin-top: 1rem;
      transition: max-width 0.25s ease;
    }

    .quiz-card.wide-mode {
      max-width: 960px;
    }

    /* ── Top Navigation Bar ───────────────────────────────── */
    .quiz-nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.15rem 1.75rem;
      background: var(--card-header);
      border-bottom: 1px solid var(--border-color);
      font-size: 0.92rem;
      font-weight: 600;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .brand-title {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      font-size: 1rem;
      cursor: pointer;
    }
    .brand-title span.badge {
      background: var(--fat-gradient);
      color: #ffffff;
      font-size: 0.72rem;
      padding: 0.15rem 0.45rem;
      border-radius: 0.4rem;
      font-weight: 700;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .nav-notes-btn {
      background: rgba(139, 92, 246, 0.18);
      color: #c4b5fd;
      border: 1px solid rgba(139, 92, 246, 0.35);
      padding: 0.35rem 0.85rem;
      border-radius: 2rem;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      text-decoration: none;
    }
    .nav-notes-btn:hover {
      background: rgba(139, 92, 246, 0.32);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .mode-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent);
      padding: 0.35rem 0.8rem;
      border-radius: 2rem;
      font-size: 0.8rem;
      border: 1px solid rgba(56, 189, 248, 0.3);
      max-width: 220px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Stopwatch Badge */
    .stopwatch-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: var(--timer-bg);
      color: var(--timer-color);
      border: 1px solid var(--timer-border);
      padding: 0.35rem 0.8rem;
      border-radius: 2rem;
      font-size: 0.85rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.15);
      transition: all 0.2s ease;
    }

    .stopwatch-badge.running {
      animation: timerPulse 2s infinite ease-in-out;
    }

    @keyframes timerPulse {
      0%, 100% { border-color: rgba(245, 158, 11, 0.3); }
      50% { border-color: rgba(245, 158, 11, 0.7); box-shadow: 0 0 14px rgba(245, 158, 11, 0.3); }
    }

    .live-score {
      color: #34d399;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 0.35rem 0.8rem;
      border-radius: 2rem;
      font-size: 0.82rem;
      font-weight: 700;
      white-space: nowrap;
    }

    /* ── Progress Bar ─────────────────────────────────────── */
    .progress-track {
      height: 6px;
      background: #182442;
      position: relative;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent-gradient);
      transition: width 0.35s ease;
    }

    /* ── Main Quiz Body ───────────────────────────────────── */
    .quiz-body {
      padding: 2.25rem 2rem;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .source-tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      padding: 0.25rem 0.65rem;
      border-radius: 0.5rem;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
    .source-tag.fat-tag {
      color: #fbbf24;
      background: rgba(245, 158, 11, 0.12);
      border-color: rgba(245, 158, 11, 0.3);
    }

    .random-tag {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .question-title {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 1.75rem;
      color: #ffffff;
    }

    /* ── Options List ─────────────────────────────────────── */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      list-style: none;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      padding: 1.05rem 1.25rem;
      background: #17233f;
      border: 1.5px solid #283a63;
      border-radius: 0.85rem;
      color: var(--text-main);
      font-size: 0.98rem;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: flex-start;
      gap: 0.85rem;
      line-height: 1.4;
      user-select: none;
    }

    .option-btn:hover:not(:disabled) {
      background: #1e2c4f;
      border-color: #38bdf8;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.15);
    }

    .option-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.75rem;
      height: 1.75rem;
      border-radius: 0.45rem;
      background: #253966;
      color: #cbd5e1;
      font-size: 0.85rem;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: -0.1rem;
    }

    .option-btn:disabled {
      cursor: not-allowed;
    }

    /* Correct / Incorrect states */
    .option-btn.selected-correct {
      background: var(--correct-bg) !important;
      border-color: var(--correct-border) !important;
      color: #ecfdf5 !important;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.3) !important;
    }
    .option-btn.selected-correct .option-badge {
      background: #10b981;
      color: #ffffff;
    }

    .option-btn.selected-wrong {
      background: var(--wrong-bg) !important;
      border-color: var(--wrong-border) !important;
      color: #fef2f2 !important;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.3) !important;
    }
    .option-btn.selected-wrong .option-badge {
      background: #ef4444;
      color: #ffffff;
    }

    .option-btn.highlight-correct {
      background: rgba(16, 185, 129, 0.18) !important;
      border-color: #10b981 !important;
      color: #a7f3d0 !important;
    }
    .option-btn.highlight-correct .option-badge {
      background: #10b981;
      color: #ffffff;
    }

    .option-btn.faded {
      opacity: 0.45;
    }

    /* ── Instant Feedback Box ─────────────────────────────── */
    .feedback-box {
      margin-top: 1.5rem;
      padding: 1.25rem 1.35rem;
      border-radius: 0.85rem;
      font-size: 0.95rem;
      line-height: 1.55;
      animation: fadeIn 0.25s ease-out;
      border-left: 4px solid;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .feedback-box.is-correct {
      background: rgba(6, 78, 59, 0.35);
      border-left-color: #10b981;
      color: #d1fae5;
    }

    .feedback-box.is-wrong {
      background: rgba(69, 16, 16, 0.4);
      border-left-color: #ef4444;
      color: #fee2e2;
    }

    .feedback-status {
      font-weight: 800;
      font-size: 1.05rem;
      margin-bottom: 0.35rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .feedback-explanation {
      color: #cbd5e1;
      font-size: 0.92rem;
    }

    /* ── Action Buttons ───────────────────────────────────── */
    .action-row {
      margin-top: 1.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 1.6rem;
      border-radius: 0.75rem;
      font-size: 0.98rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: var(--accent-gradient);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(6, 182, 212, 0.45);
    }

    .btn-fat {
      background: var(--fat-gradient);
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
    }
    .btn-fat:hover {
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.45);
    }

    .btn-secondary {
      background: #17233f;
      color: #cbd5e1;
      border: 1px solid var(--border-color);
      box-shadow: none;
    }
    .btn-secondary:hover {
      background: #283d6d;
      color: #ffffff;
      box-shadow: none;
    }

    /* ── Mode Selection Screen ────────────────────────────── */
    .start-screen {
      padding: 2.5rem 2rem;
      text-align: center;
    }

    .brand-hero {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    .brand-hero h1 {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-hero .fat-pill {
      background: var(--fat-gradient);
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 800;
      padding: 0.25rem 0.65rem;
      border-radius: 0.5rem;
      text-transform: uppercase;
      box-shadow: 0 2px 10px rgba(245, 158, 11, 0.3);
    }

    .start-subtitle {
      color: var(--text-muted);
      font-size: 0.98rem;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    .features-pill-row {
      display: flex;
      justify-content: center;
      gap: 0.6rem;
      margin-bottom: 1.75rem;
      flex-wrap: wrap;
    }

    .feature-pill {
      font-size: 0.78rem;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 0.25rem 0.75rem;
      border-radius: 1rem;
      font-weight: 600;
    }
    .feature-pill.notes-pill-top {
      color: #c4b5fd;
      background: rgba(139, 92, 246, 0.12);
      border-color: rgba(139, 92, 246, 0.35);
    }

    .mode-cards {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      margin-bottom: 2rem;
      text-align: left;
    }

    .mode-card {
      background: #17233f;
      border: 2px solid #283a63;
      border-radius: 1rem;
      padding: 1.25rem 1.5rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .mode-card:hover {
      border-color: #38bdf8;
      background: #1c2a4d;
      transform: translateY(-2px);
    }

    /* FAT Featured All 420 Questions */
    .mode-card.fat-featured {
      border-color: #f59e0b;
      background: linear-gradient(145deg, #17233f, #2e2311);
    }

    /* Timed Mock 40 Questions */
    .mode-card.mock-featured {
      border-color: #6366f1;
      background: linear-gradient(145deg, #17233f, #1e2448);
    }

    .mode-card.featured {
      border-color: #10b981;
      background: linear-gradient(145deg, #17233f, #132e3b);
    }

    /* Notes Card */
    .mode-card.notes-card {
      border-color: #8b5cf6;
      background: linear-gradient(145deg, #17233f, #231942);
    }
    .mode-card.notes-card:hover {
      border-color: #a78bfa;
      background: #241d4c;
    }

    .mode-card h3 {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .mode-card p {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .mode-badge-count {
      background: #253966;
      color: var(--accent);
      padding: 0.35rem 0.8rem;
      border-radius: 2rem;
      font-size: 0.8rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .mode-card.fat-featured .mode-badge-count {
      color: #fbbf24;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.35);
    }

    .mode-card.mock-featured .mode-badge-count {
      color: #38bdf8;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.35);
    }

    .mode-card.featured .mode-badge-count {
      color: #34d399;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .mode-card.notes-card .mode-badge-count {
      color: #c4b5fd;
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.35);
    }

    .topic-select-row {
      margin: 1.5rem 0 2rem;
      text-align: left;
    }

    .topic-select-row label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .topic-dropdown {
      flex: 1;
      padding: 0.85rem 1rem;
      background: #17233f;
      color: #ffffff;
      border: 1.5px solid #283a63;
      border-radius: 0.65rem;
      font-size: 0.95rem;
      font-family: inherit;
      cursor: pointer;
    }

    /* ── Notes Viewer Screen ──────────────────────────────── */
    .notes-screen {
      padding: 2.25rem 2rem;
      text-align: left;
    }

    .notes-header {
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1.25rem;
    }

    .notes-header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .notes-header h2 {
      font-size: 1.6rem;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .notes-header p {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* Source Switcher Tabs */
    .notes-source-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
      background: #17233f;
      padding: 0.35rem;
      border-radius: 0.75rem;
      border: 1px solid var(--border-color);
    }

    .notes-source-tab {
      flex: 1;
      padding: 0.7rem 1rem;
      text-align: center;
      font-weight: 700;
      font-size: 0.92rem;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
      background: transparent;
      color: var(--text-muted);
    }

    .notes-source-tab.active {
      background: var(--accent-gradient);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(6, 182, 212, 0.25);
    }
    .notes-source-tab.fat-active {
      background: var(--fat-gradient);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.25);
    }

    /* Search Box */
    .notes-search-container {
      position: relative;
      margin-bottom: 1.25rem;
    }

    .notes-search-input {
      width: 100%;
      padding: 0.85rem 1.2rem 0.85rem 2.6rem;
      background: #17233f;
      border: 1.5px solid #283a63;
      border-radius: 0.75rem;
      color: #ffffff;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }

    .notes-search-input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .notes-search-icon {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      color: var(--text-muted);
    }

    /* Category Pill Filters */
    .notes-pills {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }

    .notes-pill {
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.35rem 0.8rem;
      border-radius: 2rem;
      border: 1px solid #283a63;
      background: #17233f;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .notes-pill:hover, .notes-pill.active {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border-color: rgba(56, 189, 248, 0.4);
    }
    .notes-pill.active.fat-pill-active {
      background: rgba(245, 158, 11, 0.18);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.4);
    }

    /* Note Card & Section Layout */
    .note-item {
      background: #17233f;
      border: 1px solid #283a63;
      border-radius: 1rem;
      padding: 1.5rem;
      margin-bottom: 1.25rem;
      transition: all 0.2s ease;
    }

    .note-item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .note-item-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
    }

    .note-item-sub {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      line-height: 1.45;
    }

    .note-tag {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.2rem 0.55rem;
      border-radius: 0.35rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .note-tag.high {
      background: rgba(239, 68, 68, 0.18);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.35);
    }
    .note-tag.med {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .note-tag.fat {
      background: rgba(245, 158, 11, 0.18);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.35);
    }

    /* Tables in Notes */
    .notes-table-wrap {
      overflow-x: auto;
      margin: 1rem 0;
      border-radius: 0.65rem;
      border: 1px solid #283a63;
    }

    .notes-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.86rem;
      text-align: left;
    }

    .notes-table th {
      background: #1e2e50;
      color: #cbd5e1;
      padding: 0.75rem 1rem;
      font-weight: 700;
      border-bottom: 1px solid #283a63;
      white-space: nowrap;
    }

    .notes-table td {
      padding: 0.75rem 1rem;

eenhouse Effect & Global Warming", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 39, "question": "Carbon footprint is expressed in units of:", "options": ["kWh", "CO2 equivalent (CO2e)", "ppm", "Watts"], "correctAnswer": "CO2 equivalent (CO2e)", "explanation": "A carbon footprint aggregates all greenhouse gas emissions normalized to their Global Warming Potential in units of carbon dioxide equivalent (CO2e).", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": true}, {"id": 40, "question": "GWP is typically calculated over a time horizon of:", "options": ["1 year", "100 years", "1000 years", "10 years"], "correctAnswer": "100 years", "explanation": "Under the Greenhouse Gas Protocol and UNFCCC frameworks, Global Warming Potential (GWP) is standardly computed over a 100-year time horizon.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": true}, {"id": 41, "question": "The GWP100 of methane is approximately:", "options": ["1", "265-298", "28-34", "10,000"], "correctAnswer": "28-34", "explanation": "The IPCC 5th Assessment Report quotes the 100-year GWP of biogenic methane between 28 and 34 times that of carbon dioxide.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 42, "question": "Scope 1 emissions are:", "options": ["Emissions from disposal only", "Value-chain emissions", "Indirect emissions from purchased electricity", "Direct emissions from owned/controlled sources"], "correctAnswer": "Direct emissions from owned/controlled sources", "explanation": "Scope 1 covers direct GHG emissions from operations owned or controlled by the reporting organization (e.g., combustion in boilers, furnaces, fleet vehicles).", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": true}, {"id": 43, "question": "Emissions from purchased electricity are classified as:", "options": ["Scope 0", "Scope 3", "Scope 1", "Scope 2"], "correctAnswer": "Scope 2", "explanation": "Scope 2 encompasses indirect GHG emissions associated with the generation of purchased electricity, steam, heating, or cooling consumed by the organization.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": true}, {"id": 44, "question": "Which scope often accounts for the largest share of a product's carbon footprint?", "options": ["Scope 1", "Scope 2", "Scope 3", "All equal"], "correctAnswer": "Scope 3", "explanation": "Scope 3 encompasses the entire value chain (raw materials extraction, transport, customer use, and disposal), frequently exceeding 70–80% of a product's total footprint.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": true}, {"id": 45, "question": "The most widely used international standard for measuring GHG emissions is the:", "options": ["Montreal Protocol", "Basel Convention", "ISO 9001", "Greenhouse Gas Protocol"], "correctAnswer": "Greenhouse Gas Protocol", "explanation": "The Greenhouse Gas Protocol (GHG Protocol), developed by WRI and WBCSD, is the premier global standard for corporate and product carbon accounting.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": true}, {"id": 46, "question": "Which standard specifically addresses product carbon footprint?", "options": ["PAS 2050", "ISO 45001", "ISO 27001", "ISO 14001"], "correctAnswer": "PAS 2050", "explanation": "PAS 2050 (Publicly Available Specification 2050) is the dedicated British/international standard assessing life cycle greenhouse emissions of goods and services.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": true}, {"id": 47, "question": "ISO 14064 is a standard for:", "options": ["Food safety", "GHG inventories", "Energy audit of buildings", "Quality management"], "correctAnswer": "GHG inventories", "explanation": "ISO 14064 provides international guidelines for quantifying, monitoring, and reporting organizational greenhouse gas inventories and verification.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 48, "question": "Global average carbon footprint is about ______ t CO2e per person per year.", "options": ["0.4", "4", "400", "40"], "correctAnswer": "4", "explanation": "The global mean per capita carbon footprint is roughly 4.0 tonnes of CO2e per year.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 49, "question": "The average Indian's footprint is approximately ______ t CO2e per year.", "options": ["50", "2", "30", "15"], "correctAnswer": "2", "explanation": "An average person in India emits approximately 2 tonnes of CO2e per year, well below the global average (~4 t) and the US average (~14–16 t).", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 50, "question": "Life Cycle Assessment (LCA) covers:", "options": ["Only manufacturing", "Only use phase", "Cradle to grave", "Only disposal"], "correctAnswer": "Cradle to grave", "explanation": "A full LCA evaluates comprehensive environmental impacts across the complete lifespan from raw material extraction ('cradle') to end-of-life disposal ('grave').", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": true}, {"id": 51, "question": "'Cradle to cradle' LCA ideally ends with:", "options": ["Landfill", "Reuse and recycling", "Incineration", "Export"], "correctAnswer": "Reuse and recycling", "explanation": "In a regenerative 'cradle to cradle' framework, post-consumer end-of-life goods feed directly back into manufacturing loops via reuse, repair, or recycling.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 52, "question": "Emission factors convert ______ into CO2e.", "options": ["Population", "Wind speed", "Temperature", "Activity data"], "correctAnswer": "Activity data", "explanation": "Emission factors are coefficients that mathematically convert quantifiable activity data (litres of diesel, kWh of grid electricity, tonne-km) into CO2e.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 53, "question": "Electricity and heat generation account for about ______ of global CO2 emissions.", "options": ["16%", "34%", "80%", "5%"], "correctAnswer": "34%", "explanation": "Power and heat generation represent the largest single sector, accounting for roughly 34% of global CO2 emissions.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 54, "question": "Industry accounts for about ______ of global GHG emissions.", "options": ["24%", "6%", "60%", "16%"], "correctAnswer": "24%", "explanation": "Heavy manufacturing and industrial processing (iron & steel, chemicals, cement, aluminium) produce approximately 24% of global greenhouse emissions.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 55, "question": "Transportation accounts for about ______ of global GHG emissions.", "options": ["34%", "50%", "16%", "6%"], "correctAnswer": "16%", "explanation": "The global transport sector (road, aviation, maritime, rail) generates roughly 16% of direct greenhouse gas emissions.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 56, "question": "Buildings contribute about 6% direct emissions but ______ when Scope 2 is included.", "options": ["17-19%", "40%", "60%", "10%"], "correctAnswer": "17-19%", "explanation": "While direct on-site combustion in buildings accounts for ~6%, factoring in indirect Scope 2 electricity consumption raises their impact to 17–19%.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 57, "question": "Producing one tonne of cement releases about ______ of CO2.", "options": ["8 t", "80 t", "0.8 t", "0.08 t"], "correctAnswer": "0.8 t", "explanation": "Manufacturing one tonne of ordinary Portland cement emits approximately 0.8 tonnes of CO2.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": true}, {"id": 58, "question": "Roughly half of cement CO2 comes from:", "options": ["Packaging", "Calcination of limestone", "Water use", "Transport"], "correctAnswer": "Calcination of limestone", "explanation": "Chemical decomposition (calcination of limestone: CaCO3 -> CaO + CO2) accounts for roughly 50% of cement emissions; the rest is fuel combustion.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 59, "question": "Coal-fired power produces roughly ______ the CO2 per unit energy compared with natural gas.", "options": ["Half", "One-tenth", "Twice", "Equal"], "correctAnswer": "Twice", "explanation": "Combusting coal releases approximately double the mass of CO2 per megawatt-hour of electrical output compared to modern natural gas turbines.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 60, "question": "The IEA calls energy efficiency the:", "options": ["Last resort", "First fuel", "Slow fuel", "Hidden tax"], "correctAnswer": "First fuel", "explanation": "The International Energy Agency (IEA) designates energy efficiency as the 'first fuel' because avoided waste is the cleanest and cheapest resource.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 61, "question": "CCS stands for:", "options": ["Carbon Capture and Storage", "Clean Carbon Source", "Carbon Cycle System", "Controlled Combustion Standard"], "correctAnswer": "Carbon Capture and Storage", "explanation": "CCS stands for Carbon Capture and Storage: capturing industrial flue gas CO2 and sequestering it securely deep underground in geological formations.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 62, "question": "CCU converts captured CO2 into:", "options": ["Useful products like fuels or building materials", "Radioactive waste", "Nitrogen", "Ozone"], "correctAnswer": "Useful products like fuels or building materials", "explanation": "Carbon Capture and Utilisation (CCU) recycles captured CO2 into commercially valuable commodities such as synthetic fuels, carbonates, and chemicals.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 63, "question": "DAC (Direct Air Capture) removes CO2:", "options": ["Only from oceans", "Only from power plant stacks", "Directly from ambient air", "Only from vehicles"], "correctAnswer": "Directly from ambient air", "explanation": "Direct Air Capture (DAC) uses chemical contactors to scrub dilute carbon dioxide directly out of the ambient free atmosphere.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 64, "question": "Planting trees on previously non-forested land is called:", "options": ["Deforestation", "Silviculture only", "Reforestation", "Afforestation"], "correctAnswer": "Afforestation", "explanation": "Afforestation is establishing a forest on lands that historically have not contained forest cover (reforestation restores recently cleared lands).", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 65, "question": "Recycled aluminium needs about ______ less energy than primary aluminium.", "options": ["95%", "5%", "25%", "50%"], "correctAnswer": "95%", "explanation": "Recycling secondary scrap aluminium saves roughly 95% of the massive electrical energy required to smelt virgin bauxite ore via the Hall-Héroult process.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 66, "question": "The circular economy contrasts with the linear model of:", "options": ["Repair, reuse", "Reduce, reuse, recycle", "Design for disassembly", "Take, make, dispose"], "correctAnswer": "Take, make, dispose", "explanation": "A circular economy decouples growth from resource extraction, directly rejecting the linear 'take-make-dispose' throwaway paradigm.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 67, "question": "'Modal shift' in transport means:", "options": ["Using bigger vehicles", "Changing vehicle colour", "Increasing flight speed", "Moving from higher-carbon to lower-carbon transport modes"], "correctAnswer": "Moving from higher-carbon to lower-carbon transport modes", "explanation": "Modal shift describes transitioning commuter and freight traffic from energy-intensive modes (aviation, private ICE cars) to low-carbon alternatives (rail, transit).", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 68, "question": "Carbon tax and cap-and-trade are examples of:", "options": ["Adaptation measures", "Carbon pricing policies", "Remote sensing", "Natural sinks"], "correctAnswer": "Carbon pricing policies", "explanation": "Carbon taxes and cap-and-trade Emissions Trading Schemes (ETS) are market-based carbon pricing instruments that internalize the environmental cost of emissions.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 69, "question": "About ______ of all food produced globally is wasted.", "options": ["One-tenth", "One-third", "Nine-tenths", "Two-thirds"], "correctAnswer": "One-third", "explanation": "Roughly one-third (~1.3 billion tonnes annually) of all agricultural food produced for human consumption is lost or wasted globally.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 70, "question": "REDD+ is associated with:", "options": ["Wind policy", "Avoided deforestation offsets", "Plastic recycling", "Solar tariffs"], "correctAnswer": "Avoided deforestation offsets", "explanation": "REDD+ (Reducing Emissions from Deforestation and forest Degradation) financially incentivizes developing countries to conserve forests.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 71, "question": "Credible carbon offsets must be:", "options": ["Additional, measurable, permanent, verified", "Cheap and quick", "Only government-owned", "Only domestic"], "correctAnswer": "Additional, measurable, permanent, verified", "explanation": "High-integrity carbon credits must satisfy 4 criteria: additionality, accurate measurability, permanence (non-reversal), and independent verification.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": true}, {"id": 72, "question": "Carbon offsetting should be treated as:", "options": ["Illegal", "Replacement for renewables", "A substitute for reductions", "A complement to direct reductions"], "correctAnswer": "A complement to direct reductions", "explanation": "Carbon offsetting is a complement to direct emissions reductions, used to balance residual unavoidable emissions after maximizing energy efficiency and renewables.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 73, "question": "The Clean Development Mechanism (CDM) falls under the:", "options": ["Basel Convention", "Ramsar Convention", "Kyoto Protocol", "Montreal Protocol"], "correctAnswer": "Kyoto Protocol", "explanation": "Article 12 of the Kyoto Protocol established the Clean Development Mechanism (CDM) allowing Annex I countries to earn CER credits in developing nations.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 74, "question": "SMRs stand for:", "options": ["Small Modular Reactors", "Solar Module Reactors", "Sustainable Material Recycling", "Standard Metering Receivers"], "correctAnswer": "Small Modular Reactors", "explanation": "SMRs are Small Modular Reactors: advanced nuclear fission units generating up to 300 MWe that offer scalable zero-carbon baseload power.", "category": "FAT: Carbon Footprint & Mitigation", "section": "Section 2: Carbon Footprint & Mitigation", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": false}, {"id": 75, "question": "Approximate solar irradiance at Earth's surface at solar noon on a clear day:", "options": ["5000 W/m2", "1000 W/m2", "500 W/m2", "100 W/m2"], "correctAnswer": "1000 W/m2", "explanation": "Under standard clear-sky conditions at solar noon, peak solar irradiance reaching Earth's surface is approximately 1,000 W/m² (1 kW/m²).", "category": "FAT: Solar Energy", "section": "Section 3: Solar Energy", "isFatExam": true, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": false, "isFatFocus": true}, {"id": 76, "question": "Solar output is calculated as:", "options": ["Irradiance x time only", "Irradiance / area", "Irradiance x area x efficiency", "Area + efficiency"], "correctAnswer": "Irradiance x area x efficiency", "explanation": "Solar electrical power output equals incident Irradiance (W/m²) multiplied by panel Area (m²) multiplied by the conversion Efficiency factor (η).", "category": "FAT: Solar Energy", "section": "Sect esponse", "explanation": "The disaster response phase focuses on immediate search and rescue, evacuation, first aid, and urgent humanitarian relief during and right after impact.", "category": "Hazards & Disaster Management", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": true, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false}, {"id": 189, "question": "EIA screening is used to:", "options": ["Write the final law", "Determine whether/what level of EIA is required", "Plant compensatory forests", "Measure only noise"], "correctAnswer": "Determine whether/what level of EIA is required", "explanation": "EIA screening is the initial gatekeeping step that determines whether a proposed project requires a formal Environmental Impact Assessment and the extent of assessment needed.", "category": "Environmental Impact Assessment (EIA)", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": true, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false}, {"id": 190, "question": "Under the Water Act, Section 25 is associated with:", "options": ["Wildlife schedules", "Consent/restrictions for new outlets/discharges", "Ozone protection", "EIA public consultation"], "correctAnswer": "Consent/restrictions for new outlets/discharges", "explanation": "Section 25 of the Water Act 1974 requires obtaining prior consent from the State Pollution Control Board before setting up any new outlet or discharge into water bodies.", "category": "Indian Environmental Laws", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": true, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false}, {"id": 191, "question": "The Forest Conservation Act’s key Section 2 concerns:", "options": ["Air samples", "Prior Central Government approval for forest diversion", "Noise limits", "Wildlife trade"], "correctAnswer": "Prior Central Government approval for forest diversion", "explanation": "Section 2 of the Forest (Conservation eparates the troposphere from the stratosphere?", "options": ["Stratopause", "Mesopause", "Tropopause", "Thermopause"], "correctAnswer": "Tropopause", "explanation": "The tropopause is the atmospheric boundary layer where the environmental lapse rate drops and temperature inversion begins in the stratosphere.", "category": "Earth as a Life Support System", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false}, {"id": 226, "question": "The lithosphere primarily comprises:", "options": ["Earth's crust and uppermost solid mantle", "Only ocean sediments", "The molten liquid outer core", "The lower atmosphere gases"], "correctAnswer": "Earth's crust and uppermost solid mantle", "explanation": "The lithosphere constitutes the rigid outermost shell of rocky terrestrial planets, consisting of the crust and upper mantle.", "category": "Earth as a Life Support System", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false}, {"id": 227, "question": "The term 'Ecology' was coined in 1866 by:", "options": ["Charles Elton", "Ernst Haeckel", "Eugene Odum", "Arthur Tansley"], "correctAnswer": "Ernst Haeckel", "explanation": "German zoologist Ernst Haeckel coined the word 'Oecologie' from Greek oikos (house) and logos (study) to denote the study of organisms in their environment.", "category": "Ecosystem — Core Concepts", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false}, {"id": 228, "question": "Which of the following is an artificial (man-made) ecosystem?", "options": ["Tropical rainforest", "Coral reef", "Cultivated crop field", "Natural freshwater lake"], "correctAnswer": "Cultivated crop field", "explanation": "Agricultural crop fields, managed aquaria, and botanical gardens are artificial ecosystems requiring continuous human inputs of energy and nutrients.", "category": "Ecosystem — Core Concepts", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false}, {"id": 229, "question": "Which biome exhibits the highest Net Primary Productivity (NPP) according to the notes?", "options": ["Temperate grassland", "Tropical rainforest", "Boreal taiga", "Arctic tundra"], "correctAnswer": "Tropical rainforest", "explanation": "Tropical rainforests have optimal temperature, abundant rainfall, and year-round sunlight, generating high NPP of ~2,000 g/m²/year.", "category": "Ecosystem & Energy Flow", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false}, {"id": 230, "question": "Why does the Second Law of Thermodynamics explain unidirectional energy flow in ecosystems?", "options": ["Energy is destroyed at each trophic level", "Energy transformation is never 100% efficient; heat is continuously lost", "Energy increases as entropy decreases", "Consumers produce their own solar radiation"], "correctAnswer": "Energy transformation is never 100% efficient; heat is continuously lost", "explanation": "Due to entropy and the 2nd law, energy degraded into metabolic heat cannot be recaptured by autotrophs, making energy flow strictly one-way.", "category": "Ecosystem & Energy Flow", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false}, {"id": 231, "question": "According to the notes, secondary succession is roughly how much faster than primary succession?", "options": ["Equal speed", "2× faster", "5–10× faster", "100× faster"], "correctAnswer": "5–10× faster", "explanation": "Secondary succession proceeds roughly 5–10 times faster than primary succession because fertile topsoil and seed propagules already exist.", "category": "Ecological nd to receptors in the alkaline insect midgut and form lethal pores", "Paralyze insect wings", "Prevent egg hatching"], "correctAnswer": "Bind to receptors in the alkaline insect midgut and form lethal pores", "explanation": "Under the alkaline pH of the insect midgut, Cry protoxins are cleaved into active toxins that bind epithelial cadherin receptors and lyse gut cells.", "category": "Genetically Modified Crops", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false}, {"id": 236, "question": "Which of the following is a primary ingredient and indicator of photochemical smog?", "options": ["Sulfur dioxide only", "Peroxyacyl nitrate (PAN) and tropospheric ozone", "Pure water vapor", "Carbonic acid"], "correctAnswer": "Peroxyacyl nitrate (PAN) and tropospheric ozone", "explanation": "Photochemical smog is characterized by oxidants such as tropospheric ozone and peroxyacyl nitrates (PAN), which irritate human eyes and respiratory tracts.", "category": "Air Pollution", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false}, {"id": 237, "question": "What is the relationship between Biochemical Oxygen Demand (BOD) and water quality?", "options": ["Higher BOD indicates purer water", "Higher BOD indicates high organic pollution and low dissolved oxygen", "BOD is unrelated to dissolved oxygen", "BOD only measures salinity"], "correctAnswer": "Higher BOD indicates high organic pollution and low dissolved oxygen", "explanation": "High BOD means large amounts of organic waste are present; aerobic microbes consume dissolved oxygen to oxidize it, depleting oxygen for fish.", "category": "Water Pollution & Management", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false}, {"id": 238, "question": "Under the Noise Rules utions).", "category": "Indian Environmental Laws", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false}, {"id": 245, "question": "The 1996 Supreme Court T.N. Godavarman judgment held that 'forest' must be understood according to its:", "options": ["Revenue department record only", "Dictionary meaning regardless of ownership", "Commercial timber yield", "Area exceeding 1,000 hectares only"], "correctAnswer": "Dictionary meaning regardless of ownership", "explanation": "The Supreme Court ruled that the Forest (Conservation) Act applies to all tracts bearing natural tree cover according to the dictionary meaning, irrespective of ownership.", "category": "Indian Environmental Laws", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false}, {"id": 246, "question": "Article 4 of the Paris Agreement commits nations to reach global peaking of emissions and achieve:", "options": ["A complete ban on coal by 2020", "Net-zero greenhouse gas emissions in the second half of this century", "Zero cars worldwide by 2030", "Equal emissions for every citizen"], "correctAnswer": "Net-zero greenhouse gas emissions in the second half of this century", "explanation": "Article 4.1 aims to achieve a balance between anthropogenic emissions by sources and removals by sinks of greenhouse gases in the second half of this century.", "category": "Kyoto, Paris & SDGs", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false}, {"id": 247, "question": "Which SDG is dedicated to 'Life on Land' (conserving terrestrial ecosystems, combating desertification and stopping biodiversity loss)?", "options": ["SDG 6", "SDG 13", "SDG 14", "SDG 15"], "correctAnswer": "SDG 15", "explanation": "SDG 15 focuses on protecting and restoring terrestrial ecosystems, managing forests sustainably, halting land degradation, and conserving biodiversity.", "category": "Sustainable Development Goals", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": true, "isTop30": false, "isFatFocus": false}, {"id": 248, "question": "Biodiversity exists at which three major levels?", "options": ["Organism, population, community", "Genetic, species, ecosystem", "Cellular, tissue, organ", "Individual, population, biome"], "correctAnswer": "Genetic, species, ecosystem", "explanation": "Biodiversity is universally recognized and classified across three interconnected levels: genetic diversity, species diversity, and ecosystem diversity.", "category": "Biodiversity & Conservation", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": true, "isFatFocus": false}, {"id": 249, "question": "Genetic diversity refers to:", "options": ["Variety of ecosystems in a region", "Number of species in an area", "Variation in genes within a species", "Number of organisms in an ecosystem"], "correctAnswer": "Variation in genes within a species", "explanation": "Genetic diversity represents the total variety of genetic information contained in the genes of individuals of a single species.", "category": "Biodiversity & Conservation", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": true, "isFatFocus": false}, {"id": 250, "question": "Species richness means:", "options": ["Even distribution of individuals", "Number of species present", "Genetic variation within species", "Number of ecosystems present"], "correctAnswer": "Number of species present", "explanation": "Species richness is the count of different species represented in an ecological community or defined region.", "category": "Biodiversity & Conservation", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": true, "isFatFocus": false}, {"id": 251, "question": "Which is an example of endemic species?", "options": ["A species found throughout the world", "A species found only in a particular geographical region", "An extinct species", "A species with a very large population"], "correctAnswer": "A species found only in a particular geographical region", "explanation": "Endemic species are plants or animals native and exclusively restricted to a specific geographical location.", "category": "Biodiversity & Conservation", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": true, "isFatFocus": false}, {"id": 252, "question": "Which is an example of ex-situ conservation?", "options": ["National park", "Wildlife sanctuary", "Botanical garden", "Biosphere reserve"], "correctAnswer": "Botanical garden", "explanation": "Botanical gardens, zoos, and seed banks preserve species off-site outside their natural habitats (ex-situ), whereas parks and sanctuaries are in-situ.", "category": "Biodiversity & Conservation", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": true, "isFatFocus": false}, {"id": 253, "question": "Project Tiger was launched in:", "options": ["1972", "1973", "1980", "1992"], "correctAnswer": "1973", "explanation": "Project Tiger was launched by the Government of India in April 1973 from Jim Corbett National Park to protect the Bengal tiger.", "category": "Biodiversity & Conservation", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": true, "isFatFocus": false}, {"id": 254, "question": "India's first national park mentioned in the notes is:", "options": ["Kaziranga National Park", "Bandipur National Park", "Jim Corbett National Park", "Gir National Park"], "correctAnswer": "Jim Corbett National Park", "explanation": "Jim Corbett National Park in Uttarakhand was established in 1936 (originally as Hailey National Park), making it India's first national park.", "category": "Biodiversity & Conservation", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": true, "isFatFocus": false}, {"id": 255, "question": "Which is the correct order of the 3Rs?", "options": ["Recycle -> Reuse -> Reduce", "Reuse -> Reduce -> Recycle", "Reduce -> Reuse -> Recycle", "Reduce -> Recycle -> Reuse"], "correctAnswer": "Reduce -> Reuse -> Recycle", "explanation": "The waste hierarchy prioritizes prevention (Reduce), followed by direct re-utilization (Reuse), and lastly material reprocessing (Recycle).", "category": "Circular Economy & Waste", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": true, "isFatFocus": true}, {"id": 256, "question": "The linear economy is commonly described as:", "options": ["Reduce, reuse, recycle", "Take, make, dispose", "Produce, conserve, restore", "Extract, recycle, regenerate"], "correctAnswer": "Take, make, dispose", "explanation": "The traditional linear economic model follows a 'take-make-dispose' step, in contrast to the circular economy's regenerative closed loop.", "category": "Circular Economy & Waste", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": true, "isFatFocus": false}, {"id": 257, "question": "The most widely used matrix method in EIA mentioned in the notes is:", "options": ["Delphi Matrix", "Leopold Matrix", "SWOT Matrix", "Risk Matrix"], "correctAnswer": "Leopold Matrix", "explanation": "The Leopold Matrix is a pioneering and widely adopted qualitative Environmental Impact Assessment (EIA) method.", "category": "EIA & Environmental Tools", "section": "General EVS", "isFatExam": false, "isWebsiteOfficial63": false, "isWebsiteGenerated": false, "isTop30": true, "isFatFocus": false}, {"
